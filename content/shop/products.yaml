  # 銀行（提携リンクなし。公式ページへの普通のリンク。PR の印は出ない）。事実は 2026-10-25 に公式ページで確認
  - id: bank-yucho
    item: 銀行口座（窓口・アプリ）
    name: ゆうちょ銀行
    note: 在留カードの満了日まで3か月を超えていれば申し込める。外国籍の人向けのアプリの申し込みは7言語。郵便局の窓口でも相談できる。
    official_url: https://www.jp-bank.japanpost.jp/kaisetu/kat_gaikokujin.html
  - id: bank-rakuten
    item: 銀行口座（ネット）
    name: 楽天銀行
    note: 英語の申込ページと英語の電話窓口あり（平日9〜17時）。在留カード交付から6か月未満は、勤務先の健康保険の資格確認書などを足す。申し込み後のサポートは日本語。
    official_url: https://www.rakuten-bank.co.jp/english/account/opening/
  - id: bank-paypay
    item: 銀行口座（ネット）
    name: PayPay銀行
    note: 在留カードのICチップをスマホで読み取って申し込める。満了日まで3か月未満は不可。2026年6月14日以降に発行の在留カードは郵送。
    official_url: https://www.paypay-bank.co.jp/en/account.html
  - id: bank-seven
    item: 銀行口座（ネット・ATM）
    name: セブン銀行
    note: 外国籍の人専用のネット申し込みあり。ATMの画面は9言語。入国6か月未満は在職証明書か社員証を足す。2026年6月14日以降に発行の在留カードはネットでは使えない。
    official_url: https://www.sevenbank.co.jp/personal/account/application/online-kaisetsu-foreignnational.html
