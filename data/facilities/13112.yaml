# 収集手順（Claude Code はこの順で埋める。推測で埋めない）:
#  1. 出産なび（https://birth-navi.mhlw.go.jp/）で「世田谷区」を検索し、施設名・種別・住所・無痛分娩の有無・費用を転載する。
#     転載時は source_url に出産なびのURLを入れる（厚労省の利用条件: 出所の明記）。
#  2. 東京都の無痛分娩費用助成「対象医療機関一覧」（2026年4月1日時点のExcel）で tokyo_epidural_subsidy_target を埋める。
