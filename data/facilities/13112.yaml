#  3. 各施設HPで分娩予約のルール（何週までに受診・予約金・制限）を確認し booking_policy と booking_deadline_week_official を埋める。
#  4. 上記で確認できない項目は null のまま、needs_review: true にする。
#
# 世田谷区の周辺（30分〜1時間圏）の施設も対象にする場合は region_code を実際の市区町村コードにして別ファイルに置く。

