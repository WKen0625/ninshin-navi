# 国（全国共通の骨格）  確認日: 2026-09-18
# 原則: 都府県・市区町村ファイルが overrides_step_id で上書きする。
# source_url が "TODO" の行は needs_review: true。seed は投入するが画面に「確認中」を表示する。

region:
  code: JP
  level: national
  name: 国（全国共通）
  status: in_progress
  verified_at: 2026-09-18

notes:
  - text: 分娩費用の新制度（改正健康保険法、2026-05-29成立）は2028年6月頃までに開始。準備できた医療機関から移行し、出産育児一時金50万円の仕組みも当面併存。
    source_url: https://kumanichi.com/articles/1985718
  - text: 法律の概要（分娩1件当たり基本単価の現物給付化＋全妊婦への定額現金給付）。
    source_url: https://www.mhlw.go.jp/content/12400000/001713111.pdf

documents:
  - id: jp.none_yet
    name: まだ紙がない（陽性判定のみ）
    phase: pre_notification
  - id: jp.heartbeat_confirmed
    name: 医療機関で胎児心拍を確認した（母子手帳はまだ）
    phase: pre_notification
    description: 多くの自治体で「妊娠」の定義。妊娠届と支援給付の前提。
    source_url: https://www.city.setagaya.lg.jp/02244/20413.html
    verified_at: 2026-09-18
  - id: jp.boshi_techo
    name: 母子健康手帳
    aliases: [親子健康手帳, 母子手帳]
    phase: notification
    issued_by: ward
    what_to_do: 健診・出産・予防接種のたびに持っていく。出生届にも必要（出生届済証明の欄に区が記入する）。
  - id: jp.kenshin_ticket
    name: 妊婦健康診査の受診票（補助券）
    aliases: [受診票, 補助券, 健診券, 健診券綴り]
    phase: notification
    issued_by: ward
    what_to_do: 健診のたびに1枚ずつ病院の受付に出す（出さないと自費）。東京都外や助産所では使えないことが多く、その分はあとで区に払い戻しを申請する。
  - id: jp.sanka_hosho
    name: 産科医療補償制度の登録証
    aliases: [産科医療補償制度, 登録証]
    phase: pregnancy
    issued_by: hospital
    description: 分娩時の事故で赤ちゃんに重い脳性まひが残った場合に補償する制度。分娩施設が妊婦ごとに登録し、登録証（またはシール）を渡す。
    what_to_do: 母子健康手帳に貼る（または一緒に保管）。出産後に万一のことがあったときの申請に必要。登録証をもらっていなければ、施設に「産科医療補償制度に登録しているか」を聞く。
    source_url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryou/i-anzen/sanka-iryou/index.html
    verified_at: 2026-10-01
  - id: jp.direct_payment_agreement
    name: 出産育児一時金「直接支払制度」の合意書（控え）
    aliases: [直接支払制度の合意文書, 直接支払制度 合意書]
    phase: pregnancy
    issued_by: hospital
    description: 出産育児一時金（原則50万円）を、健康保険から分娩施設に直接払ってもらうための書類。施設が用意し、本人が署名する。
    what_to_do: 署名して施設に出し、控えを保管する。退院時の請求から一時金が引かれる。費用が50万円より少なかったときは、控えを使って差額を健康保険に申請する。
    source_url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/shussan/index.html
    verified_at: 2026-10-01
  - id: jp.booking_form
    name: 分娩予約の申込書・予約金の案内
    aliases: [分娩予約申込書, 分娩予約金, 予約金の振込用紙]
    phase: pregnancy
    issued_by: hospital
    description: 分娩予約を確定させるための書類。予約金（施設により数万〜数十万円）の払い方と期限が書いてある。
    what_to_do: 期限までに出して、予約金を払う。領収書は退院まで保管する（退院時の精算で充当され、区の助成の申請で使う場合もある）。期限と金額は施設ごとに違うので、Naviの「病院と締切」で記録しておくと、同じ区の人の目安になる。
  - id: jp.admission_guide
    name: 入院のご案内（持ち物リスト・入院の決まり）
    aliases: [入院案内, 入院の手引き, 持ち物リスト]
    phase: pregnancy
    issued_by: hospital
    description: 入院中の持ち物、面会のルール、入院費の払い方、陣痛が来たときの連絡先が書いてある。
    what_to_do: 入院バッグはこのリストから作る（施設が用意する物は買わない）。陣痛時の連絡先は、家族にも共有しておく。
  - id: jp.consent_forms
    name: 同意書・問診票（検査・分娩・無痛分娩など）
    aliases: [同意書, 問診票, 説明書]
    phase: pregnancy
    issued_by: hospital
    description: 血液検査、超音波、分娩の方法、無痛分娩などについての説明と同意の書類。初回の受診でまとめて渡されることが多い。
    what_to_do: 家で読んで、署名して次の受診で出す。内容の疑問は医師・助産師に聞く（医療の内容はこのサイトでは扱わない）。控えをもらえる場合は保管する。
  - id: jp.kenshin_schedule
    name: 妊婦健診のスケジュール表
    aliases: [健診スケジュール, 受診予定表]
    phase: pregnancy
    issued_by: hospital
    description: 何週に何の検査をするかの予定表。区の受診票（1回目・2回目…）をどの回で使うかが書いてある施設もある。
    what_to_do: 受診票の綴りと一緒に保管し、毎回の受診で受診票を1枚出す。里帰りや転院の予定があれば、早めに施設に伝える。
  - id: jp.referral_letter
    name: 紹介状（診療情報提供書）
    aliases: [紹介状, 診療情報提供書]
    phase: pregnancy
    issued_by: hospital
    description: 里帰り出産や転院のときに、いまの施設が次の施設あてに書く書類。
    what_to_do: 封を開けずに、次の施設の初診で出す。里帰り先の施設には、紹介状を持って何週までに受診するかを先に電話で確かめる。
  - id: jp.birth_certificate
    name: 出生証明書（出生届の右半分。分娩施設が書く）
    aliases: [出生証明書]
    phase: birth
    issued_by: hospital
    description: 出生届の用紙の右側。出産に立ち会った医師か助産師が書く。左側（出生届）は親が書く。
    what_to_do: 退院までに施設から受け取り、親が左側を書いて、出生の日から14日以内に区役所の戸籍の窓口に出す（母子健康手帳と届出人の本人確認書類も持参）。
    source_url: https://laws.e-gov.go.jp/law/322AC0000000224
    verified_at: 2026-10-01
  - id: jp.hospital_receipt
    name: 分娩施設の領収書・明細書
    phase: birth
    issued_by: hospital
    what_to_do: 区・都の出産費用の助成、無痛分娩の助成、健康保険への差額請求、医療費控除に使う。原本を求める申請があるので、コピーも取って1年は保管する。
  - id: jp.other
    name: その他（一覧にない紙）
    phase: pre_notification
    description: 選択時は自由記述を document_suggestions に保存し、人がレビューしてマスタに追加する。

contacts:
  - id: jp.c_8000
    name: 子ども医療電話相談（#8000）
    topics: 夜間・休日に子どもの体調で迷ったとき。小児科医・看護師が受診の目安を教える
    phone: "#8000"
    hours: 東京都は 平日18時〜翌8時、土曜13時〜翌8時、日曜・祝日・年末年始 8時〜翌8時（都道府県で違う）
    url: https://www.mhlw.go.jp/topics/2006/10/tp1010-3.html
    source_url: https://www.mhlw.go.jp/topics/2006/10/tp1010-3.html
    verified_at: 2026-09-25
  - id: jp.c_loss
    name: 流産・死産の相談窓口（こども家庭庁の一覧）
    topics: 流産・死産を経験した人の心のケアと、使える制度。全国の相談窓口の一覧へ
    url: https://precon.cfa.go.jp/dictionary/spontaneous-abortion-stillbirth/
    source_url: https://precon.cfa.go.jp/dictionary/spontaneous-abortion-stillbirth/
    verified_at: 2026-10-01

steps:
  - id: jp.s01
    phase: pre_notification
    sort_order: 10
    title: 産婦人科を受診し、胎児心拍を確認してもらう
    trigger_document_id: jp.none_yet
    produces_document_id: jp.heartbeat_confirmed
    channel: 医療機関
    source_url: https://www.city.setagaya.lg.jp/02244/20413.html
    verified_at: 2026-09-18

  - id: jp.s02
    phase: pre_notification
    sort_order: 20
    title: 分娩施設を選び、電話で分娩予約する
    detail: 施設によって妊娠7〜10週前後で予約枠が埋まる例がある。締切は施設ごとに違うので「病院と締切」画面で確認する。無痛分娩を希望する場合は、都府県の助成対象施設かも確認する。
    trigger_document_id: null
    channel: 医療機関
    deadline_base: facility
    deadline_note: 締切は施設ごとに違う（「病院と締切」画面で確認する）
    survey_question_id: booking_result
    apply_from_note: "妊娠がわかったら、すぐ（施設によっては心拍確認後）"
    source_url: https://kawaguchiladys-clinic.net/faq/834/
    verified_at: 2026-09-18

  - id: jp.s03
    phase: notification
    sort_order: 30
    title: 市区町村に妊娠届を出し、母子健康手帳と受診票を受け取る
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: jp.boshi_techo
    channel: 窓口 または オンライン（自治体による）
    deadline_note: なるべく早く（受診票は届出後から使える）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら）"
    source_url: https://www.city.setagaya.lg.jp/02244/1189.html
    verified_at: 2026-09-18

  - id: jp.s04
    phase: pregnancy
    sort_order: 40
    title: 妊婦健診を受ける（受診票を毎回提出）
    detail: 国の目安は14回程度。妊娠23週までは4週に1回、24〜35週は2週に1回、36週以降は毎週。
    trigger_document_id: jp.kenshin_ticket
    channel: 医療機関
    deadline_base: gestational_week
    deadline_note: 週数に応じた頻度
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.mhlw.go.jp/file/05-Shingikai-12601000-Seisakutoukatsukan-Sanjikanshitsu_Shakaihoshoutantou/0000035240.pdf
    verified_at: 2026-09-18

  - id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目）を申請する
    detail: 国の制度で、5万円。医療機関で胎児心拍が確認された後から、住民票のある市区町村に申請できる。流産・死産等の場合も対象。申請窓口と方法は市区町村ごと（市区町村ファイルで上書きする）。
    trigger_document_id: jp.boshi_techo
    channel: 市区町村
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接のあと）"
    source_url: https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/be80930d-51d1-4084-aa3e-b80930646538/42e36027/20250325_policies_shussan-kosodate_52.pdf
    verified_at: 2026-09-19

  - id: jp.s06
    phase: pregnancy
    sort_order: 60
    title: 出産育児一時金の「直接支払制度」の書類を分娩施設で書く
    detail: 原則50万円が施設に直接支払われ、窓口で払うのは差額のみ。手続きの時期は施設ごと（例：36週頃の分娩入院予約時）。
    trigger_document_id: jp.boshi_techo
    channel: 医療機関
    deadline_base: facility
    apply_from_note: "分娩予約のあと、施設が案内する時期に"
    source_url: https://birth-navi.mhlw.go.jp/assets/leaflet-CWn72mWw.pdf
    verified_at: 2026-09-18

  - id: jp.s06b
    phase: pregnancy
    sort_order: 62
    title: （会社員など）産休中の健康保険・厚生年金の保険料免除を勤務先に確認する
    detail: 手続きをするのは勤務先（事業主）。事業主が「産前産後休業取得者申出書」を日本年金機構に出すと、本人負担分と事業主負担分の両方が免除される。対象は、出産予定日の42日前（多胎は98日前）から出産後56日までのうち仕事を休んだ期間。産休を開始した月から、終了日の翌日が属する月の前月まで。給与が出ていても対象。免除された期間も、年金額の計算では保険料を納めた期間として扱われる。
    trigger_document_id: null
    channel: 勤務先
    deadline_note: 事業主が、産休中または産休終了後1か月以内に提出する
    apply_from_note: "産休に入ってから（勤務先が手続きする）"
    source_url: https://www.nenkin.go.jp/service/kounen/hokenryo/menjo/sankyu-menjo/20140509-02.html
    verified_at: 2026-09-19

  - id: jp.s06c
    phase: pregnancy
    sort_order: 64
    title: （自営業・フリーランスなど国民年金の人）産前産後期間の国民年金保険料の免除を届け出る
    detail: 対象は国民年金第1号被保険者。出産予定日（または出産日）の月の前月から4か月間（多胎は3か月前から6か月間）の保険料が免除される。免除された期間も、保険料を納めたものとして老齢基礎年金の額に反映される。出産前の届出には母子健康手帳などが必要。郵送もできる。
    trigger_document_id: jp.boshi_techo
    channel: 市区町村の国民年金担当窓口（郵送可）
    deadline_note: 出産予定日の6か月前から届け出できる。出産後も届け出できる
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
    source_url: https://www.nenkin.go.jp/service/kokunen/menjo/20180810.html
    verified_at: 2026-09-19

  - id: jp.s07
    phase: birth
    sort_order: 70
    title: 出生届を出す
    trigger_document_id: null
    channel: 市区町村（窓口）
    deadline_base: birth_date
    detail: 届出先は、子の出生地・本籍地または届出人の所在地の市区町村。出生証明書と一体の届書を提出する（法務省「出生届」 https://www.moj.go.jp/ONLINE/FAMILYREGISTER/5-1.html）。
    deadline_offset_days: 13
    deadline_note: 出生の日から14日以内（戸籍法第49条）。第43条により出生日を1日目として数えるため、期限は出生日＋13日。
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    source_url: https://laws.e-gov.go.jp/law/322AC0000000224
    verified_at: 2026-09-19

  - id: jp.s08
    phase: postpartum
    sort_order: 80
    title: 妊婦のための支援給付（2回目）を申請する
    detail: 国の制度で、妊娠しているこどもの人数×5万円。出産予定日の8週間前の日から、住民票のある市区町村に届け出できる。申請窓口と方法は市区町村ごと（市区町村ファイルで上書きする）。
    trigger_document_id: null
    channel: 市区町村
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（区の案内・訪問のあと）"
    source_url: https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/be80930d-51d1-4084-aa3e-b80930646538/42e36027/20250325_policies_shussan-kosodate_52.pdf
    verified_at: 2026-09-19

  - id: jp.s09
    phase: postpartum
    sort_order: 90
    title: 児童手当を申請する
    detail: 3歳未満は月15,000円（第3子以降は30,000円）。現住所の市区町村に申請する。公務員は勤務先に申請する。
    trigger_document_id: null
    channel: 市区町村（公務員は勤務先）
    deadline_base: birth_date
    deadline_offset_days: 15
    deadline_note: 出生の日の翌日から15日以内
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    source_url: https://www.cfa.go.jp/policies/kokoseido/jidouteate/annai
    verified_at: 2026-09-19

  - id: jp.s09b
    phase: postpartum
    sort_order: 91
    title: 子どもを健康保険に加入させる
    trigger_document_id: null
    channel: 勤務先の健康保険 または 市区町村（国民健康保険）
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    source_url: "TODO: 一次資料を確認（協会けんぽ・市区町村の国保ページ）"
    verified_at: 2026-09-19
    needs_review: true

  - id: jp.s09c
    phase: postpartum
    sort_order: 92
    title: （会社員など）育児休業中の健康保険・厚生年金の保険料免除を勤務先に確認する
    detail: 手続きをするのは勤務先（事業主）。事業主が「育児休業等取得者申出書」を日本年金機構に出すと、本人負担分と事業主負担分の両方が免除される。育休を開始した月から、終了日の翌日が属する月の前月まで。同じ月の中で14日以上取得した場合もその月は免除。賞与の保険料は、育休が1か月を超える場合だけ免除。
    trigger_document_id: null
    channel: 勤務先
    deadline_note: 事業主が、育児休業中または終了後1か月以内に提出する
    apply_from_note: "育児休業に入ってから（勤務先が手続きする）"
    source_url: https://www.nenkin.go.jp/service/kounen/hokenryo/menjo/ikuji-menjo/20140327-05.html
    verified_at: 2026-09-19

  - id: jp.s06e
    phase: pregnancy
    sort_order: 65
    title: （双子以上）産前休業を出産予定日の14週間前から請求できることを、勤務先に伝える
    detail: 多胎妊娠の産前休業は、出産予定日の6週間前ではなく14週間前から請求できる（労働基準法第65条第1項）。産休の開始日と、出産手当金の対象期間（多胎は98日前から）が変わるので、勤務先の担当者に早めに伝える。
    channel: 勤務先
    requires: multiple
    apply_from_base: due_date
    apply_from_offset_days: -98
    apply_from_note: "出産予定日の14週間前から（本人が請求したとき）"
    deadline_note: 産前休業を始めたい日の前に、勤務先へ
    source_url: https://laws.e-gov.go.jp/law/322AC0000000049
    verified_at: 2026-09-25

  - id: jp.s10
    phase: postpartum
    sort_order: 78
    title: （子が日本国籍にならない場合）子の在留資格取得許可申請を、出入国在留管理局に出す
    detail: 両親とも外国籍などで、生まれた子が日本国籍を取らないときは、出生の日から60日を超えて日本にいるために、出生の日から30日以内に「在留資格取得許可申請」を出す（入管法第22条の2）。出生届と住民票の手続きのあとに、子のパスポート（または出生届受理証明書など）・親の在留カード・住民票などを持って、住んでいる地域の出入国在留管理局へ。手数料はかからない。必要書類は出入国在留管理庁のページで確認する。
    trigger_document_id: null
    channel: 出入国在留管理局（住所地を管轄する地方出入国在留管理局）
    action_url: https://www.moj.go.jp/isa/applications/procedures/16-10.html
    requires: foreign_parent
    deadline_base: birth_date
    deadline_offset_days: 30
    deadline_note: 出生の日から30日以内（入管法第22条の2）。60日を超えて在留するには申請が必要
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（出生届のあと）"
    source_url: https://www.moj.go.jp/isa/applications/procedures/16-10.html
    verified_at: 2026-09-25

  - id: jp.s10b
    phase: postpartum
    sort_order: 79
    title: （外国籍の親）母国の大使館・領事館に出生を届け出て、子のパスポートを申請する
    detail: 親の国籍の国にも子の出生を登録する。手続きと必要書類は国ごとに違うので、大使館・領事館のページで確認する。子の在留資格取得許可申請には子のパスポートがあると進めやすい（無い場合の扱いは入管に相談）。
    channel: 母国の大使館・領事館
    requires: foreign_parent
    deadline_note: 期限は国ごとに違う（大使館・領事館で確認）
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（出生届のあと）"
    source_url: https://www.kifjp.org/child/threeprocedure
    verified_at: 2026-09-25
    needs_review: true

  # ---- 流産・死産で妊娠を終えた家族のための手続き（requires: loss）。該当する家族にはこれだけを出す。確認日: 2026-10-01 ----
  - id: jp.l01
    phase: postpartum
    sort_order: 90
    title: 死産届を出す（妊娠4か月＝12週以後の死産）
    detail: 妊娠4か月（12週）以後の死産は、医師か助産師の「死産証書（死胎検案書）」を添えて、死産のあった日から7日以内に、住んでいる市区町村か死産のあった場所の市区町村へ届け出る（死産の届出に関する規程 第2条・第4条）。届け出るのは父、父ができないときは母（第7条）。病院が書類を用意してくれることが多いので、まず病院に聞く。妊娠12週より前の流産は届け出は要らない。
    channel: 区役所（戸籍の窓口）
    requires: loss
    deadline_base: birth_date
    deadline_offset_days: 7
    deadline_note: 死産のあった日から7日以内（死産の届出に関する規程 第4条）
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "死産証書を受け取ったら"
    source_url: https://www.mhlw.go.jp/web/t_doc?dataId=08023000&dataType=0&pageNo=1
    verified_at: 2026-10-01

  - id: jp.l02
    phase: postpartum
    sort_order: 91
    title: 出産育児一時金を請求する（妊娠85日＝12週以後の流産・死産も対象）
    detail: 健康保険の出産育児一時金は、妊娠85日（4か月）以後なら流産・死産・人工妊娠中絶も対象（1児につき50万円。産科医療補償制度の対象外なら48.8万円）。病院で「直接支払制度」を使えば施設への支払いに充てられ、使わなければあとから加入している健康保険に請求する。国民健康保険の人は区役所の窓口へ。
    channel: 加入している健康保険（勤務先の健康保険組合・協会けんぽ）か、国民健康保険なら区役所
    requires: loss
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "妊娠が終わった日から"
    deadline_note: 請求できる日の翌日から2年以内（健康保険の時効）
    source_url: https://www.kyoukaikenpo.or.jp/benefit/childbirth/002/index.html
    verified_at: 2026-10-01

  - id: jp.l03
    phase: postpartum
    sort_order: 92
    title: （働いている人）妊娠4か月以後の流産・死産は産後休業の対象。勤務先に休業を伝える
    detail: 妊娠4か月以後に流産・死産した女性労働者は、出産と同じく産後休業の対象で、原則8週間は就業させてはいけない（本人が請求し医師が認めた業務なら6週間後から可）。勤務先の担当者に伝え、必要なら出産手当金（健康保険）の手続きも聞く。
    channel: 勤務先
    requires: loss
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "妊娠が終わった日から（原則8週間の休業）"
    source_url: https://www.bosei-navi.mhlw.go.jp/ninshin/ryuzan.html
    verified_at: 2026-10-01

  - id: jp.l04
    phase: postpartum
    sort_order: 93
    title: （働いている人）流産・死産後1年以内は、通院の時間の確保や医師の指導にそった休業を勤務先に求められる
    detail: 妊娠の週数を問わず、流産・死産後1年以内の女性労働者には「母性健康管理措置」が適用される。健康診査などを受けるための時間の確保や、医師の指導（出血や下腹部痛への対応として一定期間の休業など）を守れるようにすることが、事業主の義務。医師の指導は「母性健康管理指導事項連絡カード」で勤務先に伝えられる。
    channel: 勤務先
    requires: loss
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "流産・死産の日から1年以内"
    deadline_base: birth_date
    deadline_offset_days: 365
    deadline_note: 流産・死産後1年以内
    source_url: https://www.bosei-navi.mhlw.go.jp/ninshin/ryuzan.html
    verified_at: 2026-10-01

  - id: jp.l05
    phase: postpartum
    sort_order: 94
    title: 妊婦のための支援給付（妊娠届のあとの給付）は、流産・死産のあとも対象。区の窓口に確認する
    detail: 妊娠届を出したあとに受け取る「妊婦のための支援給付」は、流産・死産などをした人も対象になる（胎児心拍を確認したあとの妊娠が前提）。すでに1回目を受け取っていれば2回目の扱い、まだなら申請できるかを、区の母子保健の窓口に聞く。
    channel: 区役所（母子保健の窓口）
    requires: loss
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "妊娠が終わった日から"
    source_url: https://www.bosei-navi.mhlw.go.jp/ninshin/ryuzan.html
    verified_at: 2026-10-01
    needs_review: true

subsidies:
  - id: jp.lumpsum
    name: 出産育児一時金
    kind: at_counter
    amount_formula: "500000 * children"
    amount_note: 子ども1人につき原則50万円。直接支払制度を使うと施設に直接支払われ、窓口で払うのは残りの額だけになる。費用の総額が一時金より少ないときは、差額を加入している医療保険から受け取れる。
    apply_via: 分娩施設（直接支払制度）または健康保険
    scheme_applicable: [lumpsum]
    apply_from_note: "出産のとき（直接支払制度なら分娩施設で手続き）"
    source_url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/shussan/index.html
    verified_at: 2026-09-19

  - id: jp.new_scheme
    name: 新しい制度（分娩費用を保険から施設に直接支給＋定額の現金給付）
    kind: conditional
    amount_note: 金額はまだ決まっていない。保険診療以外の分娩の基本単価を国が決め、保険者から施設に直接支給して妊婦に負担が生じないようにする（給付水準は告示で定める）。これとは別に、すべての妊婦に定額の現金給付を行う（金額は政令で定める）。
    conditions: 新しい制度に移行した施設で出産する場合。当分の間、施設ごとに今の制度（出産育児一時金）を選ぶこともできる。
    scheme_applicable: [new_scheme]
    source_url: https://www.mhlw.go.jp/content/12400000/001713111.pdf
    verified_at: 2026-09-19
