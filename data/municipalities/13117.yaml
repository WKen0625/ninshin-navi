    title: （北区の国民健康保険の人）産前産後期間の国民健康保険料の軽減を届け出る
    detail: 出産した人の保険料（所得割額と均等割額）が、出産（予定）月の前月から翌々月までの4か月分（多胎は3か月前からの6か月分）免除される。妊娠85日以上の分娩が対象で、死産・流産（人工妊娠中絶を含む）・早産を含む。届出は、電子申請（マイナンバーカードを持っている人）、窓口、郵送。届出先は国保資格係（北区役所第一庁舎2階23番、03-3908-1131）で、区民事務所ではできない。郵送のときは、先に国保資格係へ連絡して届出書を送ってもらう。窓口では、軽減届、母子健康手帳など、顔写真つきの身分証明書、資格確認書か資格情報のお知らせが必要。北区の国民健康保険の出産育児一時金を申請している人などは、届出がいらない場合がある。保険料が限度額に達している世帯は、金額が変わらないことがある。赤ちゃんの国民健康保険への加入も、同じ国保資格係で手続きする（北区子育てガイドブック）。
    trigger_document_id: kita.hoken_bag
    channel: オンライン（マイナポータル） / 窓口 / 郵送
    action_url: https://www.city.kita.lg.jp/living/insurance-pension/1001703/1001723/1001733/1001737.html
    deadline_note: 出産予定日の6か月前から届け出できる
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
