      - kita.ikkagetsuji_kenshin_ticket    # 同上
    phase: notification
    description: 妊娠届を出すと、母子健康手帳と一緒に受け取る。いろいろな保健サービスのお知らせと、各種の受診票が入っている。電子申請で届け出た場合は、母子健康手帳と受診票などの一式が郵送される。
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018244/1002779.html
    verified_at: 2026-09-20
  - id: kita.kenshin_ticket
    name: 妊婦健康診査受診票・妊婦超音波検査受診票・妊婦子宮頸がん検診受診票（北区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回分（令和8年度の公費負担の上限は、1回目11,670円、2〜14回目は各5,460円）、超音波検査4回分（各5,300円）、子宮頸がん検診1回分（3,400円）。「母と子の保健バッグ」に入っている。都内の委託医療機関などで、健診のときに出して使う。上限を超えた分は自己負担。
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018245/1002781.html
    verified_at: 2026-09-20
  - id: kita.shinseiji_choukaku_ticket
    name: 新生児聴覚検査受診票（北区）
    phase: birth
    description: 1回分。令和8年度の公費負担の上限は3,000円。「母と子の保健バッグ」に入っている。
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018245/1002781.html
    verified_at: 2026-09-20
  - id: kita.shika_kenshin_ticket
    name: 妊産婦歯科健康診査受診票（北区）
    phase: pregnancy
    description: 母子健康手帳を受け取るときに渡される「母と子の保健バッグ」に同封されている。実施医療機関でだけ使える。北区の外へ転出すると使えない。
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018245/1002782.html
    verified_at: 2026-09-20
  - id: kita.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（北区）
    phase: postpartum
    description: 2回分。令和8年度の公費負担の上限は1回5,000円。令和8年10月1日以降の受診から使える。令和8年4月1日以降に妊娠届を出した人は妊娠届のとき（母子健康手帳の交付のとき）に受け取る。それより前に届け出た人で、出産予定日が令和8年8月1日以降の人には、令和8年夏ごろまでに郵送の予定。
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018245/1002781.html
    verified_at: 2026-09-20
  - id: kita.ikkagetsuji_kenshin_ticket
    name: 1か月児健康診査受診票（北区）
    phase: postpartum
    description: 1回分。令和8年度の公費負担の上限は6,000円。令和8年10月1日以降の受診から使える。令和8年4月1日以降に妊娠届を出した人は妊娠届のとき（母子健康手帳の交付のとき）に受け取る。それより前に届け出た人で、出産予定日が令和8年8月1日以降の人には、令和8年夏ごろまでに郵送の予定。
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018245/1002781.html
    verified_at: 2026-09-20
