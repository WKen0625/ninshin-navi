  - id: kita.s08d
    phase: postpartum
    sort_order: 83
    title: 1か月児健康診査を受ける
    detail: 令和8年10月1日から、公費助成の1か月児健康診査が始まる。都内の委託医療機関などで受診票を出して受ける。内容は発育・栄養の状態、病気や異常がないかの確認、ビタミンK2の投与の確認など。令和8年度の公費負担の上限は6,000円（1回）。上限を超えた分は自己負担。令和8年10月1日より前に受けた分は対象外。
