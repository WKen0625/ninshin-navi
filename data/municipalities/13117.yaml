    deadline_offset_days: 674
    deadline_note: 出産予定日の8週間前の日から2年間（予定日より前に出産した場合は、その日から2年間）。日数は「予定日−56日 から 730日間」で計算している
    apply_from_base: due_date
    apply_from_offset_days: -56
    apply_from_note: "出産予定日の8週間前から（それより前に出産した場合はその日から）"
    contact_id: kita.c_oji_center
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1002777/1002795.html
