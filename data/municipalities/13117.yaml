  - id: kita.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成（北区）
    kind: conditional
    amount_note: 認定基準を満たす病気で、医療保険を使って入院治療したときの自己負担額を助成（認定期間内のものだけ。食事療養費は対象外）。認定期間は入院見込み期間で、手続きが遅れると助成を受けられないことがある。
    conditions: 北区に住所があり、妊娠高血圧症候群とその関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患（とその続発症）で認定基準を満たし、入院治療が必要な人。さらに、前年分の総所得税額が30,000円以下の世帯の人、または入院見込み期間が26日以上の人。生活保護を受けている人と、ほかの法令などの給付で自己負担が出ない人は対象外。
    apply_via: 住んでいる地域を担当する健康支援センター（王子 03-3919-7588／赤羽 03-3903-6481／滝野川 03-3915-0184。午前8時30分〜午後5時）。入院前か入院中に申請する。退院後の場合は、退院日から3か月以内（過ぎると申請できない）
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1002764/1002772.html
    verified_at: 2026-09-20
