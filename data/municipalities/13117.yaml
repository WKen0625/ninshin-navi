  - id: kita.s08b
    phase: postpartum
    sort_order: 82
    title: 産婦健康診査を受ける（2回まで）
    detail: 令和8年10月1日から、公費助成の産婦健康診査が始まる。都内の委託医療機関などで受診票を出して受ける。内容は問診、診察、体重・血圧測定、尿検査、アンケートを使った産後うつなどの評価。令和8年度の公費負担の上限は1回5,000円（2回）。上限を超えた分は自己負担。令和8年10月1日より前に受けた分は対象外。
