  - id: kita.s08
    overrides_step_id: jp.s08
    phase: postpartum
    sort_order: 80
    title: 妊婦のための支援給付（2回目・子ども1人につき現金5万円）を申請する
    detail: 出産後の「赤ちゃん訪問」（保健師や助産師が自宅に来る。対象は3〜4か月児健診の前までの赤ちゃん）のときに渡される二次元コードから電子申請をする。訪問を受けるには、「出生通知票」を電子申請か、保健バッグに入っているはがきで出す（戸籍の出生届とは別のもの）。産婦本人名義の口座に振り込まれる（旧姓の口座、パートナーの口座は不可）。申請から振込まで1か月〜1か月半ほど。北区以外で1回目を受けた人も、2回目は北区で受けられる。出生通知票を出すと、担当地区の健康支援センターから訪問の日程調整の電話が来る。里帰り先への訪問を希望するときは、担当の健康支援センターに電話で相談する（区の公式ページ）。
    trigger_document_id: kita.akachan_homon_annai
    channel: オンライン（訪問で渡される二次元コードから）
