documents:
  - id: kita.hoken_bag
    name: 母と子の保健バッグ（北区。母子健康手帳と一緒に受け取る袋）
    aliases: [保健バッグ, 母子手帳のセット]
    # この袋を持っていれば、中の紙も持っている扱いにする
    includes:
      - jp.boshi_techo
      - jp.kenshin_ticket
      - kita.kenshin_ticket
      - kita.shinseiji_choukaku_ticket
