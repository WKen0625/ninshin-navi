steps:
  - id: kita.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 医療機関で妊娠が確定したと診断を受けてから届け出る。窓口は、健康支援センター（王子 03-3919-7588／赤羽 03-3903-6481／滝野川 03-3915-0184。平日 午前8時30分〜午後5時）、保健サービス課保健サービス係（北区役所第一庁舎1階6番）、各区民事務所。健康支援センターに妊婦本人が届け出ると、原則その場で「はぴママたまご面接」も受けられる（その場合は午前9時〜午後4時30分）。区民事務所で届け出ると、面接は後日になる。持ち物は妊婦本人のマイナンバーカード。無いときは、マイナンバーが確認できる書類（通知カード、番号入りの住民票など）と本人確認書類（写真つきは1点、写真なしは2点）。代理人は代理人の本人確認書類も必要で、別世帯の人は委任状もいる。マイナポータルで電子申請もでき、その場合は母子健康手帳と受診票などの一式が郵送される（申請から2週間ほどかかることがある）。ほかの自治体で母子健康手帳をもらってから北区に転入した人も、「母と子の保健バッグ」（転入用）を渡すので必ず届け出る（北区子育てガイドブック）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: kita.hoken_bag
    channel: 健康支援センター / 保健サービス課保健サービス係 / 区民事務所 / オンライン（マイナポータル。一式は郵送）
    action_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018244/1002779.html
    deadline_note: 医療機関で妊娠の診断を受けたら届け出る（期限は区のページに記載なし）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: kita.c_hoken_service
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018244/1002779.html
    verified_at: 2026-09-20

  - id: kita.s03b
    phase: pregnancy
    sort_order: 35
    title: はぴママたまご面接（妊婦面接）を受ける
    detail: 妊婦全員が対象の面接。はぴママ相談員や地区担当の保健師などと話し、自分に合った「セルフプラン」を作る。対象は、北区に住民登録があり妊娠届を出した妊婦と、ほかの自治体で妊娠届を出したあと北区に転入した妊婦。場所は住所を担当する健康支援センター（王子・赤羽・滝野川。平日9時〜16時30分。先に電話で予約するとスムーズ）。保健サービス課保健サービス係（03-3908-7050）と子ども家庭支援センター（03-6903-0511）でも受けられるが、電話での予約が必要。健康支援センターに来るのがむずかしい人は、Zoom のオンライン面接（30分ほど）もできる（担当の健康支援センターに電話で申し込む）。面接のとき、妊婦のための支援給付（1回目）の電子申請用二次元コードを受け取る。出産前までに面接を終えた人には、「はぴママグッズ」（現金ではない）が後日送られる。出産後には保育士などによる「はぴママひよこ面接」（子ども家庭支援センター）もある（北区子育てガイドブック）。
    trigger_document_id: kita.hoken_bag
    produces_document_id: kita.shien_kyufu_annai_1
    channel: 健康支援センター / 保健サービス課保健サービス係 / 子ども家庭支援センター（オンラインも可）
    action_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018244/1002780.html
    deadline_note: 面接そのものの期限は区のページに記載なし。「はぴママグッズ」は、出産前までに面接を終えた人が対象
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: kita.c_oji_center
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1018244/1002780.html
    verified_at: 2026-09-20

  - id: kita.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目・現金5万円）を申請する
    detail: 対象は、申請のときに北区に住民登録があり、2025年4月1日以降に妊婦で、医療機関で胎児の心拍を確認されている人。はぴママたまご面接で渡される二次元コードから電子申請をする。妊婦本人名義の口座に振り込まれる（旧姓の口座、パートナーの口座は不可）。申請から振込まで1か月〜1か月半ほど。現金ではなく東京都のギフトカード5万ポイントを希望する人は、保健サービス課保健サービス係（03-3908-7050）に連絡する。流産・死産をした人も対象で、申請のしかたが別にある（区のページを確認）。
    trigger_document_id: kita.shien_kyufu_annai_1
    channel: オンライン（面接で渡される二次元コードから）
    action_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1002777/1002795.html
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 医療機関で胎児心拍が確認された日から2年間
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    contact_id: kita.c_hoken_service
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1002777/1002795.html
    verified_at: 2026-09-20

  - id: kita.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊産婦歯科健康診査を受ける（1回・無料）
    detail: 妊娠中から出産後1年未満の間に1回、無料で受けられる（治療や口の中の清掃は対象外）。実施医療機関に直接予約し、母子健康手帳、マイナ保険証か資格確認書、妊産婦歯科健康診査受診票を持っていく。実施医療機関でないところでは使えない。
    trigger_document_id: kita.shika_kenshin_ticket
    channel: 医療機関（実施歯科）
