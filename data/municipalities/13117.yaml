  - id: kita.s08e
    phase: postpartum
    sort_order: 84
    title: （里帰りなど都外で健診を受けた人）妊婦健康診査費用の助成金を申請する
    detail: 契約医療機関以外の国内の医療機関（都外など。海外は対象外）で、受診票が使えず自費で受けた妊婦健康診査・超音波検査・子宮頸がん検診について、実費に応じて助成される。回数の上限は妊婦健康診査14回・超音波検査4回・子宮頸がん検診1回で、受診票を使った分も数に入る。令和8年4月1日以降の受診の上限は、1回目11,670円、2回目以降5,460円、超音波検査5,300円、子宮頸がん検査3,400円。出産後（出産前に転出した人は転出後）に、北区役所の申請窓口で申請する。持ち物は母子健康手帳、領収書・診療明細書（原本）、未使用の受診票、「受診記録一覧表兼費用記入書」（保健バッグに同封）、振込口座がわかるもの（旧姓の口座は不可）。新生児聴覚検査・産婦健康診査・1か月児健康診査の助成金は、それぞれ別のページに案内がある。問い合わせは保健サービス課保健サービス係 03-3908-7050。
    trigger_document_id: kita.kenshin_ticket
    channel: 窓口（北区役所。転出した人は郵送も可）
    action_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1002764/1002773.html
    deadline_base: birth_date
    deadline_offset_days: 364
    deadline_note: 出産日から1年以内（出産前に北区から転出した場合は、転出日から1年以内）。1年を過ぎると申請できない
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    contact_id: kita.c_hoken_service
    source_url: https://www.city.kita.lg.jp/children-edu/pregnancy/1002764/1002773.html
