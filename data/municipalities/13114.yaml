    conditions: 令和7年4月1日以降に妊娠届と認定の申請をし、医療機関で胎児の心拍が確認された妊婦。流産・死産・人工妊娠中絶などを経験した人も対象。
    apply_via: 妊娠届のとき、またはかんがるー面接のときに案内される二次元コードから電子申請。問い合わせ すこやか福祉センター企画調整係 03-3228-8809（平日8時30分〜17時）
    source_url: https://www.city.tokyo-nakano.lg.jp/kosodate/kosodatesite_ohirune/nenreibetsu/ninshin/teate_zyosei/ninpu.html
