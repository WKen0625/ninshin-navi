    needs_review: true

  - id: nakano.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成（中野区）
    kind: conditional
    amount_note: 健康保険がきく分の自己負担額を助成（入院中の食事代は自己負担）。
    conditions: 妊娠高血圧症候群とその関連疾患、糖尿病、貧血、産科出血、心疾患で入院治療が必要な人。総所得税額が30,000円以下の世帯の人、または入院予定期間が26日以上の人。
    apply_via: 区役所3階子ども総合窓口、または各すこやか福祉センター（中部・北部・鷺宮・南部）。入院前か入院中に申請する。やむを得ず退院後になるときは退院後3か月以内。問い合わせ 子育て支援課 03-3228-3253
