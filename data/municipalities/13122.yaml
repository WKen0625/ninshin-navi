    apply_from_note: "生まれた日から（原則は出産で入院しているあいだ）"
    source_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1037959.html
    verified_at: 2026-09-20

  - id: katsushika.s07b
    phase: postpartum
    sort_order: 72
    title: かつしか出産応援給付金（子ども1人につき5万円）を申請する
    detail: 区内に住み、1歳未満の子どもを育てている人が対象。所得制限なし。児童手当の認定請求か、乳幼児医療証の交付申請のときに、一緒に申請する。本人確認書類と、申請する人の名義の普通預金の通帳かキャッシュカードが必要。申請の1〜2か月後に口座に振り込まれる。問い合わせ 子育て応援課子育て応援係 03-5654-6357。
    trigger_document_id: jp.hospital_receipt
    channel: 児童手当・乳幼児医療証の申請と同時に申請
    action_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1031538.html
    deadline_base: birth_date
    deadline_offset_days: 365
