    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    contact_id: katsushika.c_hoken_center
    source_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1037742.html
    verified_at: 2026-09-20

  - id: katsushika.s05c
    phase: pregnancy
