steps:
  - id: katsushika.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、親子健康手帳（母子健康手帳）と受診票を受け取る
    detail: 窓口は、保健センター（青戸・金町・新小岩・水元）、葛飾区役所の子育て支援窓口、基幹型児童館（小菅・南新宿・白鳥・新水元）、子ども未来プラザ（鎌倉・西新小岩・東四つ木）、えきにこわ。えきにこわはオンラインで4日前までの予約が必須。基幹型児童館と子ども未来プラザは、毎月第3土曜・第3日曜は予約した人だけ。ほかの窓口も事前の予約がすすめられている（ゆりかご面接の予約フォームから）。持ち物は、個人番号（マイナンバー）がわかる書類と、本人確認書類（顔写真つきの公的な書類なら1点、無ければ2点）。妊娠届そのもののオンライン提出は、区のページに記載なし。問い合わせ 母子保健係 03-3602-1387。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: katsushika.hoken_bag
    channel: 保健センター / 区役所子育て支援窓口 / 基幹型児童館 / 子ども未来プラザ / えきにこわ
    action_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1002071.html
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    source_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1002071.html
    verified_at: 2026-09-20

  - id: katsushika.s03b
    phase: pregnancy
    sort_order: 35
    title: ゆりかご面接（妊婦面接）を受ける
    detail: 葛飾区に住民登録があり、親子健康手帳（母子健康手帳）の交付を受けた妊婦が対象。保健師や助産師などと面接し、サポートプランを作る。妊娠届・手帳の交付と同じときに受けられる。場所は、青戸・金町・水元の各保健センター、にこわ新小岩、えきにこわ、区役所子育て支援窓口、子ども未来プラザ（鎌倉・東四つ木）、児童館（小菅・南新宿・白鳥・新水元）の12か所。各施設の予約フォームからオンラインで予約する（予約なしだと対応できないことがある）。面接を受けると、妊娠子育て応援券（1万円分。多胎は胎児1人当たり1万円）をその場で申請でき、妊婦支援給付金（1回目）の申請案内を受け取る。問い合わせ 青戸保健センター保健サービス係 03-3602-1284。
    trigger_document_id: katsushika.hoken_bag
    produces_document_id: katsushika.shien_kyufu_annai_1
    channel: 保健センターなど区内12か所（オンライン予約）
    action_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1014924.html
    deadline_note: いつまでに受けるかは区のページに記載なし
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1014924.html
    verified_at: 2026-09-20

  - id: katsushika.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 葛飾区妊婦支援給付金（1回目・5万円）を申請する
    detail: 妊娠の届出をした妊婦が対象。ゆりかご面接のあとに渡される案内に沿って申請する。妊婦1人当たり現金5万円（現金の代わりにクーポンも選べる）。妊婦本人の名義の口座に振り込まれ、申請から振込まで2か月ほどかかる。問い合わせ 葛飾区妊婦支援給付金給付事業コールセンター 0120-914-946（月〜金の午前9時〜午後5時30分。祝日・年末年始を除く）。
    trigger_document_id: katsushika.shien_kyufu_annai_1
    channel: ゆりかご面接のあとの案内に沿って申請
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 医療機関で胎児心拍が確認された日（受診日）から2年間
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    source_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1037742.html
    verified_at: 2026-09-20

  - id: katsushika.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健康診査を受ける（妊娠中に1回・無料）
    detail: 葛飾区に住所のある妊婦が対象。区の「葛飾区妊婦歯科健康診査実施歯科医療機関一覧」にある歯科に、事前に電話で予約し、「葛飾区妊婦歯科健康診査を希望」と伝える。持ち物は、妊婦歯科健康診査受診券、母子健康手帳、現住所・氏名・生年月日がわかる書類。内容は問診・口の中の診査・結果の説明と指導で、治療は含まれない。問い合わせ 健康推進課歯科保健担当係 03-3602-1268。
    trigger_document_id: katsushika.shika_kenshin_ticket
    channel: 区内の実施歯科医療機関
    action_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1002079.html
    deadline_note: 妊娠期間中に1回
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.city.katsushika.lg.jp/kenkou/1000050/1001803/1002079.html
    verified_at: 2026-09-20

  - id: katsushika.s06d
    phase: pregnancy
    sort_order: 66
    title: （葛飾区の国民健康保険の人）産前産後期間の国民健康保険料の免除を届け出る
    detail: 出産予定月の前月から翌々月までの4か月相当分（多胎は3か月前から翌々月までの6か月相当分）の保険料が免除される。妊娠85日（4か月）以上の出産が対象で、死産・流産・早産なども含む。窓口は国保年金課資格係（区役所3階315番）で、郵送でも出せる。届出書、親子健康手帳（母子健康手帳）など、届け出る人の本人確認資料が必要。郵送のときは手帳の表紙と、出生証明か出産予定日のページのコピーを付ける。問い合わせ 03-5654-8210。
    trigger_document_id: katsushika.hoken_bag
    channel: 窓口 / 郵送
    deadline_note: 出産予定日の6か月前から届け出できる。出産後でも届け出できるが、対象の年度の最初の保険料の納期の翌日から2年を過ぎると、免除できなくなることがある
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
    source_url: https://www.city.katsushika.lg.jp/kurashi/1000049/1001690/1033959.html
    verified_at: 2026-09-20

