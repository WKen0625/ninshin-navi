    detail: 生後4か月になるまでの赤ちゃんがいる家庭が対象。赤ちゃんが生まれてから、区のオンラインフォームで申し込む（令和7年度までの白いハガキ「出生通知票」で申し込み済みの人は不要）。申し込みが生後3か月を過ぎたときは相談する。訪問や面談のあとに、妊婦支援給付金（2回目）の申請・届出の案内がある。問い合わせ 青戸保健センター母子保健係 03-3602-1387（月〜金の午前8時30分〜午後5時。祝日を除く）。申し込みから訪問までは最短でも3週間程度かかる。訪問ではなく窓口での相談を希望するときは母子保健係か保健センターに連絡する（産婦と赤ちゃんが一緒に行く。体重測定はしない）（区のページ）。
