    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: koto.c_hoken
    source_url: https://www.city.koto.lg.jp/260501/kodomo/ninshinshussan/ninshin/6878.html
    verified_at: 2026-09-20

  - id: koto.s06d
    phase: pregnancy
    sort_order: 66
    title: （江東区の国民健康保険の人）産前産後期間の国民健康保険料の免除を届け出る
    detail: 出産予定日（出産日）の月の前月から翌々月までの4か月間（双子など多胎は3か月前から6か月間）の保険料（所得割額と均等割額）が減額される。妊娠85日以上の出産が対象で、死産・流産も含む。窓口は江東区役所 医療保険課 資格賦課係（2階7番）。郵送、マイナポータル（マイナンバーカードが必要）でも届け出できる。出産前は母子健康手帳か妊娠届出書、出産後は出生証明書など親子関係がわかる書類と、マイナンバーがわかるもの、本人確認書類が必要。問い合わせ 03-3647-3167。
