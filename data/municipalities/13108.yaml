steps:
  - id: koto.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、「母と子の保健バッグ」を受け取る
    detail: 届出先は、各保健相談所、江東区保健所保健予防課、区役所区民課・特別出張所・各出張所。持ち物は、個人番号（マイナンバー）が確認できる書類と本人確認ができる書類。代理人のときは、妊婦の個人番号確認書類、代理人の本人確認書類、委任状。マイナポータルでも妊娠届を出せる。問い合わせは保健予防課保健係 03-3647-5906。保健相談所で届け出ると、母子健康手帳の交付と併せて、その場でゆりかご面接を受けられる。区役所区民課・出張所は混雑のため待つことがある（区の妊娠届ページ）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: koto.hoken_bag
    channel: 窓口（保健相談所・保健所・区民課・出張所）または オンライン（マイナポータル）
    action_url: https://www.city.koto.lg.jp/261201/kodomo/ninshinshussan/ninshin/6875.html
    deadline_note: 期限は区のページに記載なし
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: koto.c_hoken
    source_url: https://www.city.koto.lg.jp/261201/kodomo/ninshinshussan/ninshin/6875.html
    verified_at: 2026-09-20

  - id: koto.s03b
    phase: pregnancy
    sort_order: 35
    title: 「ゆりかご面接」（妊婦面接）を受ける
    detail: 保健師などの専門職との面接。対象は江東区に住む妊婦本人。場所は、住んでいる地域を担当する保健相談所か、豊洲特別出張所。月〜金の9時〜16時30分で、保健相談所は予約不要（豊洲特別出張所は予約優先）。江東区に住民票がある人は、その場で「こども商品券1万円分」を受け取れる。面接のあと、出産応援給付金（支援給付1回目）の申請案内を受け取る。妊娠届を保健相談所以外で出した人は、妊娠届の控えと母子健康手帳を持っていく。問い合わせは保健予防課保健係 03-3647-5906。
    trigger_document_id: koto.hoken_bag
    produces_document_id: koto.shien_kyufu_annai_1
    channel: 保健相談所 または 豊洲特別出張所
    action_url: https://www.city.koto.lg.jp/260501/kodomo/ninshinshussan/ninshin/97550.html
    deadline_base: due_date
    deadline_offset_days: 0
    deadline_note: 妊婦本人が出産前に受ける（くわしい期限は区のページに記載なし）
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: koto.c_hokensodan
    source_url: https://www.city.koto.lg.jp/260501/kodomo/ninshinshussan/ninshin/97550.html
    verified_at: 2026-09-20

  - id: koto.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 出産応援給付金（妊婦のための支援給付1回目・5万円）を申請する
    detail: ゆりかご面接のあとに受け取る案内に沿って申請する。現金（口座振込）かギフトカードを選ぶ。対象は、医療機関で胎児の心拍を確認し、申請のときに江東区に住民登録がある人。妊娠届のあとに流産・死産・人工妊娠中絶などをした人も、同じ流れで申請できる。問い合わせ 0120-501-627。
    trigger_document_id: koto.shien_kyufu_annai_1
    channel: 面接のあとの案内に沿って申請
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 医療機関で胎児の心拍が確認された日から2年間
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    contact_id: koto.c_hoken
    source_url: https://www.city.koto.lg.jp/260501/kodomo/ninshinshussan/ninshin/97552.html
    verified_at: 2026-09-20

