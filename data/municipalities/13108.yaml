  - id: koto.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成（江東区で申請）
    kind: conditional
    amount_note: 医療保険を使って入院治療したときの自己負担額を助成。入院中の食事代（入院時食事療養費の標準負担額）は自己負担。
    conditions: 妊娠高血圧症候群とその関連疾患・糖尿病・貧血・産科出血・心疾患で入院治療が必要な人。前年分の所得税額が30,000円以下の世帯の人、またはそれ以外で入院期間が26日以上の人。
    apply_via: 住んでいる地区を担当する保健相談所に申請。手続きが遅れると助成を受けられないことがある（くわしい期限は区のページに記載なし）。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.koto.lg.jp/260501/kodomo/ninshinshussan/ninshin/6886.html
