    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健康診査を受ける
    detail: 妊娠した人が対象。江東区内の契約歯科医療機関で、「母と子の保健バッグ」に入っている受診票を出して受ける。受けられる歯科は区の「妊婦歯科健康診査実施医療機関名簿」で確認する。回数・費用・期限は区のページに記載なし。問い合わせは保健予防課保健係 03-3647-5906。
