    name: 妊婦健康診査受診票（目黒区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回、妊婦超音波検査4回、子宮頸がん検診1回を公費で一部助成。都内の契約医療機関などで使える。令和6年10月1日以降に妊娠届を出した人は、都内の一部の助産所でも使える（助産所は原則7回が上限）。受診票を受け取る前に受けた健診には、区からの助成や返金はない。
    source_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/ninpukensa.html
    verified_at: 2026-09-20
  - id: meguro.shika_kenshin_ticket
    name: 妊婦・産婦歯科健康診査受診票（目黒区）
    phase: notification
    description: 「母と子の保健バッグ」に同封されている。目黒区内の指定医療機関（歯科）で使う。
    source_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/ninpusika.html
    verified_at: 2026-09-20
  - id: meguro.shinseiji_choukaku_ticket
    name: 新生児聴覚検査受診票（目黒区）
    phase: birth
    description: 妊娠届を出したときに、赤ちゃん1人につき1枚受け取る。
    source_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/sinnseiji_tyoukakukensa.html
    verified_at: 2026-09-20
  - id: meguro.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（目黒区）
    phase: postpartum
    description: 令和8年4月1日以降に母子健康手帳を受け取った人は、「母と子の保健バッグ」に入っている。有効期間は出産後2か月以内。
