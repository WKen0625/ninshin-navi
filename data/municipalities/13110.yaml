steps:
  - id: meguro.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 窓口は地域保健課保健相談係と、こども家庭センター（こども家庭センターは新規の手続きだけ）。持ち物は、妊婦の個人番号カードなどと、届け出る人の本人確認ができるもの（個人番号カード、運転免許証、パスポートなど）。代理人のときは委任状も。窓口に行くときはエコバッグなどを持っていく。マイナンバーカードを使って、電子（ぴったりサービス）でも届け出できる。その場合は、1週間ほどで母子健康手帳と「母と子の保健バッグ」などが郵送（配達員による手渡し）で届く。問い合わせは地域保健課地域保健サービス係 03-5722-9503。母子健康手帳の内容についての問い合わせは地域保健課 03-5722-9504。冊子ではマイナポータルからのオンライン提出も案内されている。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: meguro.hoken_bag
    channel: 窓口（地域保健課・こども家庭センター）または オンライン（ぴったりサービスのあと郵送）
    action_url: https://www.city.meguro.tokyo.jp/smph/kurashi/shussan/ninshintodoke_mynumber.html
    deadline_note: 期限は区のページに記載なし
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: meguro.c_chiiki_hoken
    source_url: https://www.city.meguro.tokyo.jp/smph/kurashi/shussan/ninshintodoke_mynumber.html
    verified_at: 2026-09-20

  - id: meguro.s03b
    phase: pregnancy
    sort_order: 35
    title: 「ゆりかご・めぐろ」（妊婦面接）を受ける
    detail: ゆりかご相談員（助産師・保健師・看護師）との面接。対象は、面接の日に目黒区に住民登録がある妊婦本人（転入した人も対象）。場所は地域保健課（目黒区総合庁舎3階）か、こども家庭センター（鷹番2-16-15）。電子申請で予約する（5日後から1か月先まで）。近い日を希望するときは電話 03-5722-9383 で相談できる。来所がむずかしいときはオンライン相談もある。持ち物は本人確認できるもの、母子健康手帳、黄色の妊娠面接券／受領券。目黒区で初めて面接を受けた人は、育児パッケージ（ギフトカード1万円分）と、妊婦支援給付金（1回目）の申請の案内を受け取る。提出した妊娠届出書をもとに、保健師等から連絡がくることもある。
    trigger_document_id: meguro.hoken_bag
    produces_document_id: meguro.shien_kyufu_annai_1
    channel: 地域保健課 または こども家庭センター（予約制。オンライン相談もあり）
    action_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/syussannkosodate.html
    deadline_note: いつまでに受けるかは区のページに記載なし（対象は妊婦）
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: meguro.c_yurikago
    source_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/syussannkosodate.html
    verified_at: 2026-09-20

  - id: meguro.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦支援給付金（1回目・5万円分）を申請する
    detail: 令和7年4月1日以降に妊娠届を出し、妊婦給付認定の申請をして、助産師・保健師などの面談を受けた、目黒区に住民登録のある妊婦が対象。「ゆりかご・めぐろ（妊婦面接）」で申請書を書く。ギフトカードならその場で受け取り、現金なら申請から3か月ほどで妊婦名義の銀行口座に振り込まれる。流産・死産・人工妊娠中絶などを経験した人も申請できる。異所性妊娠（子宮外妊娠）などは対象にならない。問い合わせ 03-5722-9503。
    trigger_document_id: meguro.shien_kyufu_annai_1
    channel: 妊婦面接の場で申請
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 医療機関で胎児心拍が確認された日（受診日）から2年間
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    contact_id: meguro.c_chiiki_hoken
    source_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/ninpunotameno_sienkyuhu.html
    verified_at: 2026-09-20

  - id: meguro.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健康診査を受ける（妊娠中に1回・無料）
    detail: 目黒区内に住む妊娠中の人と、出産後12か月未満（子どもの1歳の誕生日の前日まで）の産婦が対象で、妊婦・産婦とも1回ずつ。健診の費用は無料（健診以外の検査や治療は実費）。目黒区内の指定医療機関（歯科）で、「母と子の保健バッグ」に同封の受診票を出して受ける。問い合わせは地域保健課地域保健サービス係 03-5722-7057。
    trigger_document_id: meguro.shika_kenshin_ticket
    channel: 医療機関（区内の指定歯科）
    action_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/ninpusika.html
    deadline_note: 妊婦の分は妊娠中に。産婦の分は子どもの1歳の誕生日の前日まで
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: meguro.c_chiiki_hoken
    source_url: https://www.city.meguro.tokyo.jp/chiikihoken/kosodatekyouiku/ninshin/ninpusika.html
    verified_at: 2026-09-20

  - id: meguro.s06d
    phase: pregnancy
    sort_order: 66
    title: （目黒区の国民健康保険の人）産前産後期間の国民健康保険料の免除を届け出る
    detail: 出産月の前月から翌々月までの4か月間（双子など多胎は3か月前から6か月間）の保険料が免除される。妊娠85日以上の出産が対象で、死産・流産・早産・人工妊娠中絶も含む。窓口は国保年金課資格賦課係（目黒区総合庁舎1階）と各地区サービス事務所。郵送、オンライン申請でも届け出できる。母子健康手帳など出産予定日と単胎・多胎の別がわかる書類、本人確認書類、個人番号確認書類、申請書が必要。問い合わせ 03-5722-9810。冊子によると、保険料が最高限度額の世帯は申請しても減額にならないことがある。
