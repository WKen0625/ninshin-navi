    title: 新生児訪問を申し込む（出生連絡票）
    detail: 出生届を出し、生後4か月を迎えるまでの赤ちゃんがいる家庭が対象。助産師や保健師が自宅を訪問する。申し込みは、子育て応援アプリ「ぴよナビえどがわ」か、電子申請サービスから。母子健康手帳の交付日・手帳の番号・お母さんの認証番号などが必要。申請から原則10日前後で、日程の連絡がある。この訪問のときに「妊婦のための支援給付金（2回目）」の案内がある。問い合わせ 健康サービス課母子保健係 03-5661-2466。冊子では、対象は生後4か月未満の赤ちゃんがいる家庭で、申し込みは子育て応援アプリ「ぴよナビえどがわ」からの電子申請（令和8年度えどがわ子育てガイド）。
