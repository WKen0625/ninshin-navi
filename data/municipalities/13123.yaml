  - id: edogawa.kouketsuatsu
    name: 妊娠時の医療費助成（妊娠高血圧症候群等・江戸川区）
    kind: conditional
    amount_note: 入院治療にかかった費用のうち、健康保険がきいたあとの自己負担額を助成。入院中の食事代（食事療養費の標準負担額）は自己負担。切迫流産・前置胎盤・帝王切開・分娩など、対象の病気以外での入院は対象外。
    conditions: 区内に住所があり、妊娠高血圧症候群と関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患で入院治療が必要な人。前年分の所得税額（税額控除前）が3万円以下の世帯、または入院見込み期間か入院実績が26日以上の人。生活保護世帯は対象外。
    apply_via: 各健康サポートセンターの窓口、またはぴったりサービスで電子申請。原則として事前（入院前か入院中）に申請。事前に書類がそろわないときは、退院日から3か月以内。問い合わせ 健康サービス課 03-5661-2473
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninshin.html
    verified_at: 2026-09-20
