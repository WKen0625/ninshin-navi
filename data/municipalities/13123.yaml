documents:
  - id: edogawa.hoken_bag
    name: 母と子の保健バッグ（江戸川区。親子健康手帳と一緒に受け取る袋）
    aliases: [保健バッグ, 親子健康手帳, 母子手帳のセット]
    # この袋を持っていれば、中の紙も持っている扱いにする
    includes:
      - jp.boshi_techo
      - jp.kenshin_ticket
      - edogawa.kenshin_ticket
      - edogawa.shika_kenshin_ticket
      - edogawa.shinseiji_choukaku_ticket
