  - id: edogawa.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（江戸川区）
    phase: postpartum
    description: 令和8年4月1日以降の妊娠届のときに配付（郵送を含む）。それ以外の人は、電子申請か窓口で交付を申請する。令和8年10月1日以降に、都内の契約医療機関・助産所でだけ使える。
