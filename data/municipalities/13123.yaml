    description: 妊娠届を出すと、親子健康手帳（母子健康手帳）と一緒に受け取る。妊婦健康診査受診票、妊婦歯科健診受診票、新生児聴覚検査受診票、パンフレット、マタニティマークなどが入っている。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/boshitecho.html
    verified_at: 2026-09-20
  - id: edogawa.kenshin_ticket
