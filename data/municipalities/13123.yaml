    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回分（1回目は上限11,670円、2回目以降は上限5,460円）、超音波検査（経腹法）4回分（上限5,300円）、子宮頸がん検診1回分（上限3,400円）。都内の契約医療機関以外で受けたときは、最後の受診日または出産日から1年以内に申請すると、費用の一部が最大14回まで助成される。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpukenshin.html
    verified_at: 2026-09-20
