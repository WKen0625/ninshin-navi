documents:
  - id: edogawa.hoken_bag
    name: 母と子の保健バッグ（江戸川区。親子健康手帳と一緒に受け取る袋）
    aliases: [保健バッグ, 親子健康手帳, 母子手帳のセット]
    # この袋を持っていれば、中の紙も持っている扱いにする
    includes:
      - jp.boshi_techo
      - jp.kenshin_ticket
      - edogawa.kenshin_ticket
      - edogawa.shika_kenshin_ticket
      - edogawa.shinseiji_choukaku_ticket
      - edogawa.sanpu_kenshin_ticket           # 令和8年4月1日以降の妊娠届のときに配付。それより前の人は交付申請
      - edogawa.ikkagetsuji_kenshin_ticket     # 出産予定日が令和8年9月1日以降の人に妊娠届のとき配布。ほかの人は交付申請
    phase: notification
    description: 妊娠届を出すと、親子健康手帳（母子健康手帳）と一緒に受け取る。妊婦健康診査受診票、妊婦歯科健診受診票、新生児聴覚検査受診票、パンフレット、マタニティマークなどが入っている。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/boshitecho.html
    verified_at: 2026-09-20
  - id: edogawa.kenshin_ticket
    name: 妊婦健康診査受診票（江戸川区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回分（1回目は上限11,670円、2回目以降は上限5,460円）、超音波検査（経腹法）4回分（上限5,300円）、子宮頸がん検診1回分（上限3,400円）。都内の契約医療機関以外で受けたときは、最後の受診日または出産日から1年以内に申請すると、費用の一部が最大14回まで助成される。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpukenshin.html
    verified_at: 2026-09-20
  - id: edogawa.shika_kenshin_ticket
    name: 妊婦歯科健診受診票（江戸川区）
    aliases: [妊婦歯科健診のクーポン券]
    phase: notification
    description: 妊婦歯科健診の受診票またはクーポン券。母子健康手帳の交付のときに受け取る。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpushikakenshin.html
    verified_at: 2026-09-20
  - id: edogawa.shinseiji_choukaku_ticket
    name: 新生児聴覚検査受診票（江戸川区）
    phase: birth
    description: 妊娠届のときに配られる。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/shinseijichoukaku.html
    verified_at: 2026-09-20
  - id: edogawa.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（江戸川区）
    phase: postpartum
    description: 令和8年4月1日以降の妊娠届のときに配付（郵送を含む）。それ以外の人は、電子申請か窓口で交付を申請する。令和8年10月1日以降に、都内の契約医療機関・助産所でだけ使える。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/sampukenkoshinsa.html
    verified_at: 2026-09-20
  - id: edogawa.ikkagetsuji_kenshin_ticket
    name: 1か月児健康診査受診票（江戸川区）
    phase: postpartum
    description: 出産予定日が令和8年9月1日以降の人には、妊娠届のときに配られる。それ以外の人は、電子申請か各地域の健康サポートセンターの窓口で交付を申請する。令和8年10月1日以降に、都内の契約医療機関でだけ使える。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/kenshin/1kagetsujikenkoshinsa.html
    verified_at: 2026-09-20
  - id: edogawa.shien_kyufu_annai_1
    name: 「妊婦のための支援給付」の申請案内（江戸川区・1回目）
    phase: pregnancy
    description: ぴよママ相談のときに受け取る。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kosodateouennjigyou.html
    verified_at: 2026-09-20
  - id: edogawa.akachan_homon_annai
    name: 「妊婦のための支援給付金（2回目）」の案内（江戸川区）
    phase: postpartum
    description: 新生児訪問のときに案内される。
    source_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/homon.html
    verified_at: 2026-09-20

steps:
  - id: edogawa.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、親子健康手帳（母子健康手帳）と「母と子の保健バッグ」を受け取る
    detail: 窓口は、住んでいる地域の健康サポートセンター（月〜金の8時30分〜16時30分。祝日・年末年始を除く）。妊婦本人が行くときの持ち物は、身元確認書類（写真つきなら1点、写真なしなら2点）と、マイナンバーカードか通知カード。マイナポータルの「ぴったりサービス」で電子申請もできる（本人だけ）。その場合は、申請のあと母子保健係（03-5661-2466）に連絡し、持ち物を持って健康サポートセンターへ行く。問い合わせ 健康サービス課母子保健係 03-5661-2466。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: edogawa.hoken_bag
    channel: 住んでいる地域の健康サポートセンター（電子申請のあと来所）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/boshitecho.html
    deadline_note: 医療機関で妊娠を確認されたら出す
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/boshitecho.html
    verified_at: 2026-09-20

  - id: edogawa.s03b
    phase: pregnancy
    sort_order: 35
    title: ぴよママ相談（妊婦全数面接）を受ける
    detail: 江戸川区に住所のある妊婦（ほかの自治体で妊娠届を出してから転入した妊婦も含む）が対象。保健師などの専門職が、妊婦全員と面談する。場所は住んでいる地域の健康サポートセンター。予約の方法は区のページに記載なし。相談のときに、「ぴよママギフト」（ぎふとかーど。登録期限内に専用ウェブサイトから申し込むと、1万円相当の育児用品や子育て支援サービスなどを受けられる）と、「妊婦のための支援給付」の申請案内を受け取る。
    trigger_document_id: edogawa.hoken_bag
    produces_document_id: edogawa.shien_kyufu_annai_1
    channel: 住んでいる地域の健康サポートセンター
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kosodateouennjigyou.html
    deadline_note: いつまでに受けるかは区のページに記載なし
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kosodateouennjigyou.html
    verified_at: 2026-09-20

  - id: edogawa.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目・5万円）を申請する
    detail: 令和7年4月1日以降にぴよママ相談を受けた人などが対象。給付には、医師による胎児の心拍の確認が必要。「ママページ」（申請用の専用ページ）を作って申請する。現金かギフトカードを選ぶ（決めたあとは変えられない）。現金は妊婦の口座に振り込まれる（旧姓の口座は不可）。死産・流産などを経験した人も申請できる。問い合わせ コールセンター 03-4446-4327（平日の午前9時〜午後5時）。
    trigger_document_id: edogawa.shien_kyufu_annai_1
    channel: オンライン（ママページを作って申請）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    deadline_note: 申請期限は区のページに記載なし（ぴよママ相談のときに確認する）
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    verified_at: 2026-09-20

  - id: edogawa.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健診を受ける（妊娠中に1回・無料）
    detail: 受診日に江戸川区に住民登録がある妊婦が対象。区内の指定医療機関で受ける。健診は無料だが、結果を受けて治療をするときは有料。妊娠中に受けられなかったときは、出産日から数えて1年を過ぎる日までの間に受けられる。
    trigger_document_id: edogawa.shika_kenshin_ticket
    channel: 区内の指定医療機関（歯科）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpushikakenshin.html
    deadline_note: 妊娠中に1回。受けられなかったときは、出産日から数えて1年を過ぎる日まで
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpushikakenshin.html
    verified_at: 2026-09-20

  - id: edogawa.s06d
    phase: pregnancy
    sort_order: 66
    title: （江戸川区の国民健康保険の人）産前産後期間の国民健康保険料の免除を届け出る
    detail: 出産予定日（または出産日）のある月の前月から4か月分（多胎は3か月前から6か月分）の、均等割と所得割の保険料が免除される。妊娠85日以上の出産が対象で、死産・流産・早産なども含む。届け出は、電子申請（ぴったりサービス）、窓口（区役所区民課、各事務所）、郵送のどれでもできる。本人確認書類、マイナンバーがわかる書類、出産予定日か出産日がわかるもの（母子健康手帳など）、単胎か多胎かがわかる書類が必要。問い合わせ 国民健康保険資格係 03-5662-0560。
    trigger_document_id: edogawa.hoken_bag
    channel: 電子申請 / 窓口 / 郵送
    action_url: https://www.city.edogawa.tokyo.jp/e053/kurashi/iryohoken/kokuho/sanzensango.html
    deadline_note: 出産予定日の6か月前から申請できる
    source_url: https://www.city.edogawa.tokyo.jp/e053/kurashi/iryohoken/kokuho/sanzensango.html
    verified_at: 2026-09-20

  - id: edogawa.s08c
    phase: birth
    sort_order: 71
    title: 新生児聴覚検査を受ける（受診票を出す）
    detail: 検査費用の一部（上限3,000円）を助成。契約医療機関以外で自費で受けて受診票を使えなかったとき（海外を除く）は、1歳の誕生日の前日までに申請すると、1人につき上限3,000円が助成される。窓口か電子申請（ぴったりサービス）。電子申請のときは、1か月以内に使っていない受診票の原本を郵送か持参する。問い合わせ 健康サービス課庶務係 03-5661-2473。
    trigger_document_id: edogawa.shinseiji_choukaku_ticket
    channel: 医療機関
    deadline_base: birth_date
    deadline_offset_days: 50
    deadline_note: 受診票は生後50日に達する日までに使う
    source_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/shinseijichoukaku.html
    verified_at: 2026-09-20

  - id: edogawa.s07c
    phase: postpartum
    sort_order: 75
    title: 新生児訪問を申し込む（出生連絡票）
    detail: 出生届を出し、生後4か月を迎えるまでの赤ちゃんがいる家庭が対象。助産師や保健師が自宅を訪問する。申し込みは、子育て応援アプリ「ぴよナビえどがわ」か、電子申請サービスから。母子健康手帳の交付日・手帳の番号・お母さんの認証番号などが必要。申請から原則10日前後で、日程の連絡がある。この訪問のときに「妊婦のための支援給付金（2回目）」の案内がある。問い合わせ 健康サービス課母子保健係 03-5661-2466。
    trigger_document_id: edogawa.hoken_bag
    produces_document_id: edogawa.akachan_homon_annai
    channel: アプリ「ぴよナビえどがわ」/ 電子申請
    action_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/homon.html
    deadline_note: 訪問は生後4か月を迎えるまで
    source_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/homon.html
    verified_at: 2026-09-20

  - id: edogawa.s08
    overrides_step_id: jp.s08
    phase: postpartum
    sort_order: 80
    title: 妊婦のための支援給付（2回目・5万円）を申請する
    detail: 令和7年4月1日以降に出産し、新生児訪問を受けた人が対象。「ママページ」から申請する。現金かギフトカードを選ぶ。現金は妊婦の口座に振り込まれる（旧姓の口座は不可）。双子など多胎のときの金額は、区のページに記載なし。問い合わせ コールセンター 03-4446-4327（平日の午前9時〜午後5時）。
    trigger_document_id: edogawa.akachan_homon_annai
    channel: オンライン（ママページから申請）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    deadline_note: 申請期限は区のページに記載なし（新生児訪問のときに確認する）
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    verified_at: 2026-09-20

  - id: edogawa.s08b
    phase: postpartum
    sort_order: 82
    title: 産婦健康診査を受ける（2回まで）
    detail: 江戸川区に住民登録のある、産後2か月未満の人が対象（死産・流産も対象）。1回の出産につき2回、各回上限5,000円を助成。目安は1回目が産後2週間ごろ、2回目が産後1か月ごろ。受診票は令和8年10月1日以降に、都内の契約医療機関・助産所でだけ使える。受診票を使えなかった分は、出産日から1年以内に申請すると払い戻される（電子申請か窓口）。問い合わせ 健康サービス課庶務係 03-5661-2473。
    trigger_document_id: edogawa.sanpu_kenshin_ticket
    channel: 医療機関 / 助産所
    deadline_base: birth_date
    deadline_offset_days: 58
    deadline_note: 産後2か月未満
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/sampukenkoshinsa.html
    verified_at: 2026-09-20

  - id: edogawa.s08d
    phase: postpartum
    sort_order: 83
    title: 1か月児健康診査を受ける
    detail: 江戸川区に住民登録がある、生後28日〜41日の赤ちゃんが対象。1回につき上限6,000円を助成。受診票は令和8年10月1日以降に、都内の契約医療機関でだけ使える。受診票を使えなかった分の払い戻しは、1歳の誕生日の前日までに申請する。問い合わせ 健康サービス課 03-5661-2473。
    trigger_document_id: edogawa.ikkagetsuji_kenshin_ticket
    channel: 指定医療機関
    deadline_base: birth_date
    deadline_offset_days: 41
    deadline_note: 生後28日から生後41日まで（出生日を0日とする）
    source_url: https://www.city.edogawa.tokyo.jp/e052/kenko/kenko/kodomo/kenshin/1kagetsujikenkoshinsa.html
    verified_at: 2026-09-20

subsidies:
  - id: edogawa.shien_kyufu_1
    name: 妊婦のための支援給付（1回目・妊娠時）
    kind: cash_later
    amount_yen: 50000
    amount_note: 5万円。現金またはギフトカードを選ぶ（決めたあとは変えられない）。現金は妊婦の口座に振込（旧姓の口座は不可）。
    conditions: 令和7年4月1日以降にぴよママ相談を受けた人、または同年3月31日までに受けて出産応援ギフトをまだ受け取っていない人。医師による胎児の心拍の確認が必要。令和7年4月1日以降に死産・流産・人工妊娠中絶などを経験した人も申請できる。
    apply_via: ママページ（申請用の専用ページ）を作って申請。問い合わせ コールセンター 03-4446-4327（平日の午前9時〜午後5時）
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    verified_at: 2026-09-20

  - id: edogawa.shien_kyufu_2
    name: 妊婦のための支援給付（2回目・出産後）
    kind: cash_later
    amount_formula: "50000 * children"
    amount_note: 区のページには「2回目出産後5万円（現金またはギフトカード）」とある。多胎のときの金額は区のページに記載がないため、国の制度（妊娠している子どもの人数×5万円）に合わせて計算している。
    conditions: 令和7年4月1日以降に出産し、新生児訪問を受けた人。
    apply_via: ママページから申請。問い合わせ コールセンター 03-4446-4327（平日の午前9時〜午後5時）
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    verified_at: 2026-09-20

  - id: edogawa.kouketsuatsu
    name: 妊娠時の医療費助成（妊娠高血圧症候群等・江戸川区）
    kind: conditional
    amount_note: 入院治療にかかった費用のうち、健康保険がきいたあとの自己負担額を助成。入院中の食事代（食事療養費の標準負担額）は自己負担。切迫流産・前置胎盤・帝王切開・分娩など、対象の病気以外での入院は対象外。
    conditions: 区内に住所があり、妊娠高血圧症候群と関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患で入院治療が必要な人。前年分の所得税額（税額控除前）が3万円以下の世帯、または入院見込み期間か入院実績が26日以上の人。生活保護世帯は対象外。
    apply_via: 各健康サポートセンターの窓口、またはぴったりサービスで電子申請。原則として事前（入院前か入院中）に申請。事前に書類がそろわないときは、退院日から3か月以内。問い合わせ 健康サービス課 03-5661-2473
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninshin.html
    verified_at: 2026-09-20
