steps:
  - id: edogawa.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、親子健康手帳（母子健康手帳）と「母と子の保健バッグ」を受け取る
    detail: 窓口は、住んでいる地域の健康サポートセンター（月〜金の8時30分〜16時30分。祝日・年末年始を除く）。妊婦本人が行くときの持ち物は、身元確認書類（写真つきなら1点、写真なしなら2点）と、マイナンバーカードか通知カード。マイナポータルの「ぴったりサービス」で電子申請もできる（本人だけ）。その場合は、申請のあと母子保健係（03-5661-2466）に連絡し、持ち物を持って健康サポートセンターへ行く。問い合わせ 健康サービス課母子保健係 03-5661-2466。郵送でも届け出できる（妊娠届出書、本人確認書類の写し、返送用のレターパックライトを健康サービス課母子保健係へ。手帳が届くまで10日〜2週間）。郵送や電子申請だけではぴよママギフトは渡されないので、出産前に健康サポートセンターでぴよママ相談を受ける（令和8年度えどがわ子育てガイド・区のページ）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: edogawa.hoken_bag
    channel: 住んでいる地域の健康サポートセンター（電子申請のあと来所）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/boshitecho.html
    deadline_note: 医療機関で妊娠を確認されたら出す
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: edogawa.c_support_center
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/boshitecho.html
    verified_at: 2026-09-20

  - id: edogawa.s03b
    phase: pregnancy
    sort_order: 35
    title: ぴよママ相談（妊婦全数面接）を受ける
    detail: 江戸川区に住所のある妊婦（ほかの自治体で妊娠届を出してから転入した妊婦も含む）が対象。保健師などの専門職が、妊婦全員と面談する。場所は住んでいる地域の健康サポートセンター。予約の方法は区のページに記載なし。相談のときに、「ぴよママギフト」（ぎふとかーど。登録期限内に専用ウェブサイトから申し込むと、1万円相当の育児用品や子育て支援サービスなどを受けられる）と、「妊婦のための支援給付」の申請案内を受け取る。
    trigger_document_id: edogawa.hoken_bag
    produces_document_id: edogawa.shien_kyufu_annai_1
    channel: 住んでいる地域の健康サポートセンター
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kosodateouennjigyou.html
    deadline_note: いつまでに受けるかは区のページに記載なし
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: edogawa.c_support_center
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kosodateouennjigyou.html
    verified_at: 2026-09-20

  - id: edogawa.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目・5万円）を申請する
    detail: 令和7年4月1日以降にぴよママ相談を受けた人などが対象。給付には、医師による胎児の心拍の確認が必要。「ママページ」（申請用の専用ページ）を作って申請する。現金かギフトカードを選ぶ（決めたあとは変えられない）。現金は妊婦の口座に振り込まれる（旧姓の口座は不可）。死産・流産などを経験した人も申請できる。問い合わせ コールセンター 03-4446-4327（平日の午前9時〜午後5時）。
    trigger_document_id: edogawa.shien_kyufu_annai_1
    channel: オンライン（ママページを作って申請）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    deadline_note: 申請期限は区のページに記載なし（ぴよママ相談のときに確認する）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "区の妊婦面接・面談のあと"
    contact_id: edogawa.c_kyufu_call
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/kohukin/ninpunokyuhu.html
    verified_at: 2026-09-20

  - id: edogawa.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健診を受ける（妊娠中に1回・無料）
    detail: 受診日に江戸川区に住民登録がある妊婦が対象。区内の指定医療機関で受ける。健診は無料だが、結果を受けて治療をするときは有料。妊娠中に受けられなかったときは、出産日から数えて1年を過ぎる日までの間に受けられる。
    trigger_document_id: edogawa.shika_kenshin_ticket
    channel: 区内の指定医療機関（歯科）
    action_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpushikakenshin.html
    deadline_note: 妊娠中に1回。受けられなかったときは、出産日から数えて1年を過ぎる日まで
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.city.edogawa.tokyo.jp/e052/kosodate/ninshin/ninpushikakenshin.html
    verified_at: 2026-09-20

  - id: edogawa.s06d
    phase: pregnancy
    sort_order: 66
