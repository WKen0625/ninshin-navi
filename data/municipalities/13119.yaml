    phase: birth
    sort_order: 71
    title: 新生児聴覚検査を受ける（受診票を出す）
    detail: 検査の日に保護者が板橋区に住民登録をしていることが条件。検査は1人1回で、公費負担額は3,000円。受診票は東京都内の契約医療機関と、区が個別に契約している国立埼玉病院で使える。それ以外（都外の医療機関や助産所など）で受けた人には、あとから費用の一部を助成する制度がある。
