  - id: itabashi.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成
    kind: conditional
    amount_note: 医療保険を使って入院治療をしたときの自己負担額が助成される。ただし、健康保険組合などから支給された高額療養費の分は差し引かれ、入院中の食事代（標準負担額）は自己負担。
    conditions: 板橋区に住所があり、妊娠高血圧症候群とその関連疾患・糖尿病・貧血・産科出血・心疾患で、認定基準を満たし、入院して治療を受ける必要がある人。そのうえで、前年の世帯の所得税が合計30,000円以下の人、または入院見込み期間が26日以上の人。生活保護を受けている世帯は対象外。
    apply_via: 各健康福祉センターに申請。退院後に申請する場合は、退院日から3か月以内（遅延理由書が必要）。問い合わせ 健康推進課母子保健係 03-3579-2313
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.itabashi.tokyo.jp/_res/projects/default_project/_page_/001/033/138/r7ninshinkouketsuatsuoshirase.pdf
    verified_at: 2026-09-20
