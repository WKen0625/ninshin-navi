    detail: 出産（予定）月の前月から4か月分（多胎は3か月前から6か月分）の保険料が減額される。妊娠85日（4か月）以上の出産が対象（死産・流産・早産・人工妊娠中絶を含む）。窓口は国保年金課（南館2階22番窓口）と各区民事務所。郵送でも手続きできる。必要なものは、減額届出書、出産（予定）日と出産する人がわかる書類（おやこ健康手帳など）、本人確認書類、世帯主と出産する人のマイナンバーがわかる書類。届出が遅れると、保険料を変更できないことがある。冊子の問い合わせ先は国保年金課国保資格係 03-3579-2406［自動音声応答］（令和8年版いたばし子育て情報ブック）。
