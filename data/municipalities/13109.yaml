    deadline_note: 赤ちゃんが生まれたら早めに。訪問は生後4か月になる前まで
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（なるべく早く）"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-umaretara/hpg000022461.html
    verified_at: 2026-09-20

