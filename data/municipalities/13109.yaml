  - id: shinagawa.s08e
    phase: postpartum
    sort_order: 84
    title: （里帰り出産などで受診票を使えなかった人）健診・検査の費用の払い戻しを申請する
    detail: 受診日に品川区に住民登録があり、都外で受けた人、または都内でも契約していない医療機関で受けた人が対象。上限額（令和8年度）は、妊婦健診1回目11,670円、2回目以降は1回5,460円（13回まで）、超音波検査5,300円、子宮頸がん検診3,400円、新生児聴覚検査3,000円、産婦健康診査5,000円（2回まで）、1か月児健康診査6,000円。産婦健診と1か月児健診は令和8年4月以降に出産した人が対象。申請書、使わなかった受診票、親子健康手帳、領収書・診療明細書をそろえて、窓口に持っていくか郵送する。
