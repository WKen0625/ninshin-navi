    phase: postpartum
    sort_order: 75
    title: 出生通知票を送り、「すくすく赤ちゃん訪問」を受ける
    detail: 助産師・保健師・児童センター職員などが家に来る。対象は赤ちゃんと産後のお母さんで、生後4か月になる前まで。「親と子の保健バッグ」の中のハガキ（出生通知票）に切手を貼って健康課へ送る。この訪問のときに妊婦支援給付金（出産後）の案内があるので、赤ちゃんが生まれたら早めに申し込む。
