    conditions: 品川区内に住所があり、妊娠高血圧症候群とその関連疾患・産科出血・糖尿病と妊娠糖尿病・心疾患・貧血（それぞれの続発症を含む）で入院治療が必要な人。病気が認定基準にあてはまり、前年の総所得税額が30,000円以下の世帯の人、またはそれ以外で入院見込み期間が26日以上の人。
