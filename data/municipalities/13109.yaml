steps:
  - id: shinagawa.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、親子健康手帳（母子健康手帳）と受診票を受け取る
    detail: 届出先は、品川・大井・荏原の各保健センター、区役所健康課、地域センター（品川第一・大崎第一・大井第一・荏原第一・荏原第四・八潮）。持ち物は、妊婦の個人番号（マイナンバー）を確認できるものと、届け出る人の本人確認ができるもの（顔写真つきは1点、それ以外は2点）。代理人のときは委任状も。電子申請もでき、その場合は翌開庁日に区が確認して、親子健康手帳と受診票などをゆうメールで送る（郵便の事情で2〜3日以上かかることがある）。健康課・保健センターでは、妊娠届と一緒に面談（妊婦相談）を受けられる。問い合わせは健康課保健衛生担当 03-5742-6745。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: shinagawa.hoken_bag
    channel: 窓口（保健センター・健康課・地域センター）または オンライン（電子申請のあと郵送）
    action_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000000783.html
    deadline_note: 期限は区のページに記載なし
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000000783.html
    verified_at: 2026-09-20

  - id: shinagawa.s03b
    phase: pregnancy
    sort_order: 35
    title: 妊婦相談（初回面談）を受ける
    detail: 妊産婦ネウボラ相談員（助産師）や保健師との面談。対象は、品川区に住民登録があり、妊娠届を出した妊娠中の人。保健センター（品川 03-3474-2903／大井 03-3772-2666／荏原 03-3788-7016）は予約制で、住所地を管轄するセンターに電話で予約する。初回面談のあと、お祝い品（育児用品カタログギフト）を受け取り、妊婦支援給付金（妊娠時）の申請の案内を受ける。来所がむずかしい人（22週以降の切迫早産で安静が必要、里帰り中など）はオンライン（ZOOM）の面談もある。
    trigger_document_id: shinagawa.hoken_bag
    produces_document_id: shinagawa.shien_kyufu_annai_1
    channel: 保健センター（予約制。オンライン面談もあり）
    action_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000026799.html
    deadline_note: いつまでに受けるかは区のページに記載なし（対象は「妊娠中の方」）
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000026799.html
    verified_at: 2026-09-20

  - id: shinagawa.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦支援給付金（妊娠時・5万円）を申請する
    detail: 令和7年4月1日以降に妊娠届を出し、妊婦給付認定の申請をして、助産師・保健師などの面談を受けた妊婦が対象。面談のときの案内にある二次元コードから申請する。妊産婦名義の銀行口座に振り込まれる。胎児の心拍を確認したあとに流産・人工妊娠中絶・死産となった人は、面談の前でも対象。問い合わせは品川区妊婦のための支援給付事業コールセンター 03-6731-6732（祝日を除く月〜金 8時30分〜17時15分）。
    trigger_document_id: shinagawa.shien_kyufu_annai_1
    channel: オンライン（二次元コードから申請）
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 胎児の心拍が確認されてから2年間
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/20230120091157.html
    verified_at: 2026-09-20

  - id: shinagawa.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健康診査を受ける
    detail: 妊娠中の人が対象で、妊娠中いつでも使える。区内の契約歯科医院で、受診票を出して受ける（受けられる歯科は区の実施医療機関一覧で確認）。産後には別に「産婦歯科健康診査」があり、出産後1年以内に受ける（受診票は妊娠届などの手続きのとき、または子どもの4か月健診のときに保健センターで受け取る）。
    trigger_document_id: shinagawa.shika_kenshin_ticket
    channel: 医療機関（区内の契約歯科医院）
    action_url: https://www.city.shinagawa.tokyo.jp/PC/kenkou/kenkou-dukuri/kenkou-dukuri-hatokuchi/20221219162441.html
    deadline_note: 妊婦歯科は妊娠中いつでも。産婦歯科は出産後1年以内
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kenkou/kenkou-dukuri/kenkou-dukuri-hatokuchi/20221219162441.html
    verified_at: 2026-09-20

  - id: shinagawa.s06d
    phase: pregnancy
    sort_order: 66
    title: （品川区の国民健康保険の人）産前産後期間の国民健康保険料の軽減を届け出る
    detail: 出産予定日（出産日）の月の前月から翌々月までの4か月分（双子など多胎は6か月分）の保険料が軽くなる。妊娠85日以降の出産が対象。窓口は品川区役所本庁舎4階6番窓口（国保医療年金課資格係）。郵送でも届け出できる。「産前産後期間に係る保険料軽減届出書」、マイナンバーカードか国民健康保険資格確認書、親子健康手帳（出産予定日か出産日の確認用）、出産する人のマイナンバーがわかるものが必要。問い合わせは国保医療年金課 03-5742-6676。
    trigger_document_id: shinagawa.hoken_bag
    channel: 窓口 / 郵送
    action_url: https://www.city.shinagawa.tokyo.jp/PC/procedure/procedure-kenkouhoken/procedure-kenkouhoken-hokenryo/20231122101648.html
    deadline_note: 出産予定日の6か月前から届け出できる
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/procedure/procedure-kenkouhoken/procedure-kenkouhoken-hokenryo/20231122101648.html
    verified_at: 2026-09-20

  - id: shinagawa.s08c
    phase: birth
    sort_order: 71
    title: 新生児聴覚検査を受ける
    detail: 赤ちゃんの聞こえの検査。受診票を都内の契約医療機関に出して受ける。都外での里帰り出産のときは、別に助成の申請制度がある（里帰り等健診・検査費助成）。助成額は、このページには記載なし。
    trigger_document_id: shinagawa.shinseiji_choukaku_ticket
    channel: 医療機関
    deadline_note: 区のページでは、生後1週間までに行うことがすすめられている
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "生まれた日から（原則は出産で入院しているあいだ）"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/hpg000029337.html
    verified_at: 2026-09-20

