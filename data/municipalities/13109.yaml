  - id: shinagawa.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成（品川区で申請）
    kind: conditional
    amount_note: 医療保険を使って治療したときの自己負担額（高額療養費・付加給付を除いた額）を助成。入院中の食事代（入院時食事療養費の標準負担額）は自己負担。
    conditions: 品川区内に住所があり、妊娠高血圧症候群とその関連疾患・産科出血・糖尿病と妊娠糖尿病・心疾患・貧血（それぞれの続発症を含む）で入院治療が必要な人。病気が認定基準にあてはまり、前年の総所得税額が30,000円以下の世帯の人、またはそれ以外で入院見込み期間が26日以上の人。
    apply_via: 品川・大井・荏原の各保健センター。原則、入院前（入院見込み期間が決まってから）か入院中に申請。退院後に申請するときは、退院の日から3か月以内。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000000785.html
    verified_at: 2026-09-20
