steps:
  - id: shinagawa.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、親子健康手帳（母子健康手帳）と受診票を受け取る
    detail: 届出先は、品川・大井・荏原の各保健センター、区役所健康課、地域センター（品川第一・大崎第一・大井第一・荏原第一・荏原第四・八潮）。持ち物は、妊婦の個人番号（マイナンバー）を確認できるものと、届け出る人の本人確認ができるもの（顔写真つきは1点、それ以外は2点）。代理人のときは委任状も。電子申請もでき、その場合は翌開庁日に区が確認して、親子健康手帳と受診票などをゆうメールで送る（郵便の事情で2〜3日以上かかることがある）。健康課・保健センターでは、妊娠届と一緒に面談（妊婦相談）を受けられる。問い合わせは健康課保健衛生担当 03-5742-6745。健康課で面談を希望する人は午後4時までに来庁する（混み具合によっては当日面談できないことがある）。荏原第一地域センターは火曜延長窓口と第2・4日曜の日曜開庁でも受け付ける。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: shinagawa.hoken_bag
    channel: 窓口（保健センター・健康課・地域センター）または オンライン（電子申請のあと郵送）
    action_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000000783.html
    deadline_note: 期限は区のページに記載なし
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: shinagawa.c_kenko
    source_url: https://www.city.shinagawa.tokyo.jp/PC/kodomo/kodomo-ninnshinn/kodomo-ninnshinn-service/hpg000000783.html
    verified_at: 2026-09-20

  - id: shinagawa.s03b
    phase: pregnancy
    sort_order: 35
    title: 妊婦相談（初回面談）を受ける
    detail: 妊産婦ネウボラ相談員（助産師）や保健師との面談。対象は、品川区に住民登録があり、妊娠届を出した妊娠中の人。保健センター（品川 03-3474-2903／大井 03-3772-2666／荏原 03-3788-7016）は予約制で、住所地を管轄するセンターに電話で予約する。初回面談のあと、お祝い品（育児用品カタログギフト）を受け取り、妊婦支援給付金（妊娠時）の申請の案内を受ける。来所がむずかしい人（22週以降の切迫早産で安静が必要、里帰り中など）はオンライン（ZOOM）の面談もある。健康課では妊娠届出時に限り予約なしで面談できる。初回面談のあと、妊娠8か月頃にアンケートが届き、希望すれば出産準備の個別相談（8か月面談）も受けられる。
