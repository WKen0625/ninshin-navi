    apply_from_offset_days: -56
    apply_from_note: "出産予定日の8週間前から（それより前に出産した場合はその日から）"
    source_url: https://www.city.setagaya.lg.jp/02244/20413.html
    verified_at: 2026-09-18

  - id: setagaya.s08b
    phase: postpartum
    sort_order: 82
    title: 産婦健康診査を受ける（産後2週間頃と1か月頃）
    detail: 令和8年10月1日以降の受診が対象。産婦1人につき2回、1回あたり上限5,000円を助成。受診日に世田谷区に住民登録があること。
    trigger_document_id: setagaya.sanpu_kenshin_ticket
    channel: 医療機関
    deadline_note: 産後2週間頃（1回目）と産後1か月頃（2回目）
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（1回目は産後2週間ごろ）"
    source_url: https://www.city.setagaya.lg.jp/02244/29565.html
    verified_at: 2026-09-19

  - id: setagaya.s08c
    phase: birth
    sort_order: 71
    title: 新生児聴覚検査を受ける
    detail: 初回検査の費用を上限3,000円まで助成。超えた分は自己負担。
