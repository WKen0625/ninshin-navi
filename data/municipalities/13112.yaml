  - id: setagaya.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成
    kind: conditional
    amount_note: 入院医療費の自己負担分を助成（高額療養費制度に該当する場合はその限度額まで）。入院時の食事代は対象外。
    conditions: 妊娠高血圧症候群とその関連疾患・糖尿病・貧血・産科出血・心疾患で入院が必要な妊産婦。前年分の世帯の総所得税額が30,000円以下、または入院見込み期間が26日以上。
    apply_via: お住まいの地域の総合支所健康づくり課。原則、入院前（入院見込み期間が決まってから）か入院中に申請。退院後は、退院日から3か月以内に限り遅延理由書を添えて申請できる。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.setagaya.lg.jp/02244/1194.html
    verified_at: 2026-09-19
