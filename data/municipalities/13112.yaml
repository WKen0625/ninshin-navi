    title: 1か月児健康診査を受ける
    detail: 令和8年10月1日以降の受診が対象。乳児1人につき1回、上限6,000円を助成。受診日に世田谷区に住民登録があること。
    trigger_document_id: setagaya.ikkagetsuji_kenshin_ticket
    channel: 医療機関
    deadline_base: birth_date
