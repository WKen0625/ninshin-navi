  - id: setagaya.shussanhi
    name: 世田谷区出産費助成
    kind: cash_later
    amount_yen: 50000
    amount_note: 出産児1人につき5万円。妊娠85日以上の流産・死産を含む。
    conditions: 出産日時点で世田谷区内に住所がある。
    apply_via: 郵送 / 窓口 / マイナポータル電子申請。問い合わせ 03-5432-2309
    deadline_base: birth_date
    deadline_offset_days: 365
