subsidies:
  - id: setagaya.shien_kyufu_1
    name: 妊婦支援給付（1回目）
    kind: cash_later
    amount_yen: 50000
    conditions: 申請日時点で世田谷区に住民登録のある妊産婦。医療機関で胎児心拍が確認できたことをもって「妊娠」と定義。
    apply_via: ネウボラ面接時の案内に沿って電子申請
    deadline_base: confirmation_date
    deadline_offset_days: 730
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    source_url: https://www.city.setagaya.lg.jp/02244/20413.html
    verified_at: 2026-09-18

  - id: setagaya.shien_kyufu_2
    name: 妊婦支援給付（2回目）
    kind: cash_later
    amount_formula: "50000 * children"
    conditions: 申請日時点で世田谷区に住民登録のある妊産婦。
    apply_via: 赤ちゃん訪問時の案内に沿って電子申請
    deadline_base: due_date
    deadline_offset_days: 674
    apply_from_base: due_date
    apply_from_offset_days: -56
