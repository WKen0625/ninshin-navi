    kind: cash_later
    amount_formula: "50000 * children"
    amount_note: 妊娠している子どもの数に応じて5万円。産婦本人名義の口座に振り込まれる。
    conditions: 妊婦給付認定を受けた人。流産・死産の場合も対象。
    apply_via: すこやか赤ちゃん訪問で渡される案内の2次元コードから、子どもの数の届出をする
