  - id: suginami.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成（杉並区）
    kind: conditional
    amount_note: 認定された病気の入院医療費のうち、医療保険を使ったあとの自己負担額を助成（高額療養費制度にあたるときは、その限度額まで）。入院中の食事代と、差額ベッド代など保険がきかない費用は対象外。
    conditions: 入院が始まる日より前から杉並区に住所がある妊産婦で、妊娠高血圧症候群とその関連疾患・糖尿病・貧血・産科出血・心疾患（とその続発症）で入院が必要で、一定の基準を満たす人。さらに、前年の世帯の総所得税額が30,000円以下、または入院見込み期間が26日以上であること。
    apply_via: 担当地域の保健センターに申請する。退院の日から3か月を過ぎると申請できない。申請書・診断書・世帯調書・同意書の用紙は保健センターにある
