    apply_via: ゆりかご面接で渡される案内の2次元コードから、妊婦給付認定の申請をする。問い合わせは地域子育て支援課子育て支援係 03-5307-0786（午前8時30分〜午後5時、土日祝日を除く）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "1回目は心拍確認後の面接・面談のあと、2回目は出産後の訪問・案内のあと"
