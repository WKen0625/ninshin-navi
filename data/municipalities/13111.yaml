  - id: ota.akachan_homon_annai
    name: 妊婦のための支援給付（2回目）の申請案内（大田区。すこやか赤ちゃん訪問で受け取る）
    phase: postpartum
    description: すこやか赤ちゃん訪問を受けた人に渡される案内。書いてある2次元コードから申請する。
