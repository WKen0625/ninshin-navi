    name: 妊婦歯科健康診査の受診票（大田区）
    phase: pregnancy
    description: 「母と子の保健バッグ」の「受診セット」に入っている。
    source_url: https://www.city.ota.tokyo.jp/seikatsu/hoken/shussan/sika/ninpushikakenkoushinsa.html
    verified_at: 2026-09-20
  - id: ota.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（大田区）
    phase: postpartum
    description: 2回分。「母と子の保健バッグ」に入っている。
    source_url: https://www.city.ota.tokyo.jp/seikatsu/hoken/shussan/12154545.html
    verified_at: 2026-09-20
  - id: ota.ikkagetsuji_kenshin_ticket
    name: 1か月児健康診査受診票（大田区）
    phase: postpartum
    description: 「母と子の保健バッグ」に入っている。令和8年10月1日の受診分から、原則として都内共通の受診票で受ける。
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/ninsin.html
    verified_at: 2026-09-20
  - id: ota.shien_kyufu_annai_1
    name: 妊婦のための支援給付（1回目）の申請案内（大田区）
    phase: pregnancy
    description: 妊婦面接を受けた人に渡される案内。書いてある2次元コードから申請する。
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/ninpunotamenosienkyuhu.html
