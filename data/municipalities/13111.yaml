steps:
  - id: ota.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 窓口は、平日（8時30分〜17時）は大森・調布・蒲田・糀谷羽田の各地域健康課、健康づくり課、各特別出張所。夜間（月曜・木曜の17〜19時）と休日（日曜の9〜17時）は、大田区役所本庁舎1階の「母子健康手帳受付（夜間・休日）窓口」。持ち物は、マイナンバーがわかるもの、本人確認書類、妊娠の診断を受けた医療機関の診察券。本人が行けないときは家族が代理で届け出できる（委任状が必要）。オンラインでの届出は区のページに記載なし。健康づくり課の窓口は区役所本庁舎6階。夜間・休日の受付は、月曜・木曜が祝日のときと年末年始は休み。冊子によると、母子保健・子育て支援アプリ「大田区おやこ手帳」も案内している。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: ota.hoken_bag
    channel: 各地域健康課・健康づくり課・各特別出張所（夜間・休日は本庁舎1階）
    deadline_note: 期限は区のページに記載なし
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: ota.c_kenko
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/ninsin.html
    verified_at: 2026-09-20

  - id: ota.s03b
    phase: pregnancy
    sort_order: 35
    title: 妊婦面接を受ける
    detail: 保健師または助産師との面接。対象は、面接の日に大田区に住民登録のある妊婦と、大田区へ転入した妊婦。場所は住んでいる地域を受け持つ地域健康課（大森・調布・蒲田・糀谷羽田）。「妊婦面接予約システム」で、希望日の60日前から前日12時までに予約する（電話予約もできる）。面接を受けると「大田区子育て応援ギフト1万円相当」と、妊婦のための支援給付（1回目）の申請案内を受け取る。面接は40分程度。平日に妊娠届と同時に面接を受けるときは、面接を予約したうえで予約時間の10分ほど前に行く。
    trigger_document_id: ota.hoken_bag
    produces_document_id: ota.shien_kyufu_annai_1
    channel: 住んでいる地域の地域健康課（予約制）
    action_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/karugamo.html
    deadline_note: いつまでに受けるかは区のページに記載なし
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: ota.c_chiiki_kenko
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/karugamo.html
    verified_at: 2026-09-20

  - id: ota.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目・5万円）を申請する
    detail: 妊婦面接で受け取った案内の2次元コードから申請する。対象は、令和7年4月1日以降に妊婦給付認定の申請をした人で、申請の日に大田区に住民票があり、医師が胎児の心拍を確認していること。流産・死産・人工妊娠中絶の場合も対象（妊娠届を出していないときは医療機関の診断書などが必要）。妊産婦本人の名義の口座に振り込まれる。振込は申請した日の2か月後の月末ごろ。問い合わせは健康づくり課 管理担当 03-5744-1661。
    trigger_document_id: ota.shien_kyufu_annai_1
    channel: オンライン（案内の2次元コードから）
    deadline_note: 申請期限は区のページに記載なし（面接のときに確認する）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "区の妊婦面接・面談のあと"
    contact_id: ota.c_kenko
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/ninpunotamenosienkyuhu.html
    verified_at: 2026-09-20

  - id: ota.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健康診査を受ける（妊娠中に1回・無料）
    detail: 区内の指定歯科医療機関で、妊娠中に1回受けられる。健診の費用は無料（治療は保険診療で有料）。医療機関に電話で予約し、受診票と母子健康手帳を持っていく。問い合わせは健康づくり課 03-5744-1661。
    trigger_document_id: ota.shika_kenshin_ticket
    channel: 区内の指定歯科医療機関
    deadline_note: 妊娠中に1回
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: ota.c_kenko
    source_url: https://www.city.ota.tokyo.jp/seikatsu/hoken/shussan/sika/ninpushikakenkoushinsa.html
    verified_at: 2026-09-20

  - id: ota.s06d
    phase: pregnancy
    sort_order: 66
    title: （大田区の国民健康保険の人）産前産後期間の国民健康保険料の減免を届け出る
    detail: 出産予定日（または出産日）の月の前月から4か月間（双子以上は3か月前から6か月間）の、所得割と均等割の保険料が減免される。大田区役所本庁舎の国民健康保険窓口、または郵送で届け出る。減免届出書、母子健康手帳、届け出る人の本人確認書類が必要。問い合わせは国保年金課 国保資格係 03-5744-1210。産前産後期間の国民年金保険料の免除は、国保年金課 国民年金係（03-5744-1214）へ。
    trigger_document_id: ota.hoken_bag
    channel: 窓口（大田区役所本庁舎）/ 郵送
    deadline_note: 出産予定日の6か月前から届け出できる
    apply_from_base: due_date
    apply_from_offset_days: -182
