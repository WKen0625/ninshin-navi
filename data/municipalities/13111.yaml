    detail: 生後120日までのすべての赤ちゃんの家庭を、助産師や保健師が訪問する。赤ちゃんが生まれたら、区のページのフォームから「出生通知書」（すこやか赤ちゃん訪問依頼書）を電子申請する。訪問を受けると、妊婦のための支援給付（2回目）の申請案内を受け取る。出生通知書（すこやか赤ちゃん訪問依頼書）の案内と二次元コードは「受診票セット」の中に入っている。訪問は無料。
