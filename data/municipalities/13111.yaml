    detail: 東京都外の医療機関では区の受診票が使えないので、払った費用をあとから助成してもらう。対象は妊婦健康診査（14回まで。多胎は19回まで）、産婦健康診査（2回分。令和8年4月1日の受診分から）、1か月児健康診査、新生児聴覚検査。領収書（あれば明細書も）を保管しておく。申請書セットは区のページからダウンロードするか、母子健康手帳の交付窓口でもらう。申請の受付は大田区役所6階の健康づくり課だけ。助成の上限額はこのページに記載なし。問い合わせは健康づくり課 03-5744-1661。
