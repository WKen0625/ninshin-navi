documents:
  - id: ota.hoken_bag
    name: 母と子の保健バッグ（大田区。母子健康手帳と一緒に受け取る袋）
    aliases: [保健バッグ, 母子手帳のセット]
    # この袋を持っていれば、中の紙も持っている扱いにする
    includes:
      - jp.boshi_techo
      - jp.kenshin_ticket
      - ota.kenshin_ticket
      - ota.shika_kenshin_ticket
      - ota.sanpu_kenshin_ticket
      - ota.ikkagetsuji_kenshin_ticket
    phase: notification
    description: 妊娠届を出すと、母子健康手帳と一緒に受け取る。妊婦健康診査受診票、妊婦超音波検査受診票、妊婦子宮頸がん検診受診票、産婦健康診査受診票、1か月児健康診査受診票、出生通知書の二次元コードなどが入っている。
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/ninsin.html
    verified_at: 2026-09-20
  - id: ota.kenshin_ticket
    name: 妊婦健康診査受診票（大田区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14枚（1回目用の水色1枚、2回目以降用の黄色13枚）、妊婦超音波検査（白色4枚）、妊婦子宮頸がん検診（桃色1枚）。一定の金額を上限に助成される（金額は区のページに記載なし）。東京都外の医療機関では使えない。令和6年10月1日以降に妊娠届を出した人は、都内の助産所でも使える。
    source_url: https://www.city.ota.tokyo.jp/seikatsu/kodomo/shussan/ninsin.html
    verified_at: 2026-09-20
