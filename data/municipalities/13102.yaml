  - id: chuo.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成
    kind: conditional
    amount_note: 健康保険を使って入院治療したときの自己負担額を助成。
    conditions: 妊娠高血圧症候群・糖尿病・貧血・産科出血・心疾患とその続発症で入院が必要な妊産婦。前年分の総所得税額が30,000円以下の世帯の人、または入院見込み期間が26日以上の人。
