    detail: 出産後のお母さんの体と心の健康を確かめる健診。令和8年10月以降の受診から、都内の契約医療機関に受診票を出すと、1回5,000円まで、2回まで助成される（令和8年9月以前の受診は対象外）。目安は1回目が産後2週間ごろ、2回目が産後1か月ごろ。検査の内容によっては自己負担が出ることがある。
