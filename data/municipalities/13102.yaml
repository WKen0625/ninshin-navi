    detail: 2回目は、出産後、原則として新生児訪問を受けていることが条件。訪問でもらった「案内通知」から、1回目と同じように専用の申請サイトで申請する。双子なら2回目は10万円。本人名義の口座に振り込まれる。申請日に中央区に住民登録があれば、そのあと転出しても中央区から支給される（転出したあとに申請した場合は、転出先の自治体から受け取る）。出産後に子どもが亡くなった人も対象。電子申請の問い合わせは専用コールセンター 050-3821-1200（平日9〜17時）。
