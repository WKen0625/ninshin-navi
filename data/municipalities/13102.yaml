  - id: chuo.s07e
    phase: postpartum
    sort_order: 78
    title: 出生通知書（はがき）か電子申請で、新生児訪問（赤ちゃん訪問）を申し込む
    detail: 保健師・助産師などが家に来て、赤ちゃんの体重測定や健康状態の確認、育児やお母さんの体調の相談、子育てサービスの紹介をしてくれる。対象は、生後4か月までの赤ちゃんがいるすべての家庭（里帰り出産の人も相談できる）。「母と子の保健バッグ」に入っている出生通知書（赤ちゃん訪問連絡はがき）を郵送するか、電子申請で申し込む。申し込みから日程の連絡まで10日〜2週間ほどかかる。妊婦支援給付金（2回目）の「案内通知」は、この訪問のときに受け取る。
