documents:
  - id: chuo.hoken_bag
    name: 母と子の保健バッグ（中央区。母子健康手帳が入った袋）
    aliases: [保健バッグ, 母子手帳のセット]
    # この袋を持っていれば、中の紙も持っている扱いにする
    includes:
      - jp.boshi_techo
      - jp.kenshin_ticket
      - chuo.kenshin_ticket
      - chuo.shika_kenshin_ticket
      - chuo.shussei_tsuchisho
      - chuo.shinseiji_choukaku_ticket
      - chuo.sanpu_kenshin_ticket            # 令和8年4月以降に妊娠届を出した人
      - chuo.ikkagetsuji_kenshin_ticket      # 令和8年4月以降に妊娠届を出した人
    phase: notification
    description: 妊娠届を出すと受け取る。中身は、母子健康手帳、妊婦健康診査・産前歯科健康診査の受診票、出生通知書（赤ちゃん訪問連絡はがき）、プレママ教室・パパママ教室のお知らせなど。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/tetyokohu.html
    verified_at: 2026-09-20
  - id: chuo.kenshin_ticket
    name: 妊婦健康診査受診票（中央区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回分（1回目は水色、2〜14回目は黄色）、妊婦超音波検査4回分（白色）、妊婦子宮頸がん検診1回分（桃色）。都内の契約医療機関の受付に、受診の前に出す。令和6年10月1日以降に妊娠届を出した人は、都内の助産所でも使える（1回目の健診、超音波検査、子宮頸がん検診などは医療機関で受ける）。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/kenshin/ninpukenshin.html
    verified_at: 2026-09-20
  - id: chuo.shika_kenshin_ticket
    name: 産前歯科健康診査受診票（中央区）
    phase: pregnancy
    description: 「母と子の保健バッグ」に入っている。産後の受診票は、3〜4か月児健康診査のお知らせ（郵送）に同封される。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/kenshin/sanzensango.html
    verified_at: 2026-09-20
  - id: chuo.shussei_tsuchisho
    name: 出生通知書（赤ちゃん訪問連絡はがき）（中央区）
    aliases: [赤ちゃん訪問のはがき]
    phase: postpartum
    description: 「母と子の保健バッグ」に入っている。出産後に郵送すると、新生児訪問（赤ちゃん訪問）を申し込める。電子申請でも申し込める。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/shussanshien/homonsido.html
    verified_at: 2026-09-20
  - id: chuo.shinseiji_choukaku_ticket
    name: 新生児聴覚検査受診票（中央区）
    phase: birth
    description: 「母と子の保健バッグ」に入っている。上限3,000円（1人につき検査1回）。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/kodomonokenkou/kenshin/sinseijichokaku.html
    verified_at: 2026-09-20
  - id: chuo.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（中央区）
    phase: postpartum
    description: 令和8年4月以降に妊娠届を出す人は「母と子の保健バッグ」に同封。令和8年3月以前に届け出た人で、出産予定日が令和8年8月15日以降の人には、妊娠7か月ごろに「妊娠8か月アンケート」と一緒に郵送される。1回5,000円まで、2回まで。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/kenshin/sanpukenshin.html
    verified_at: 2026-09-20
  - id: chuo.ikkagetsuji_kenshin_ticket
    name: 1か月児健康診査受診票（中央区）
    phase: postpartum
    description: 令和8年4月以降に妊娠届を出す人は「母と子の保健バッグ」に同封。令和8年3月以前に届け出た人で、出産予定日が令和8年8月15日以降の人には、妊娠7か月ごろに郵送される。1回6,000円まで。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/kodomonokenkou/kenshin/01kagetu.html
    verified_at: 2026-09-20
  - id: chuo.shien_kyufu_annai_1
    name: 妊婦支援給付金（1回目）の案内通知（中央区）
    phase: pregnancy
    description: 妊婦面談のときに受け取る。申請サイトの二次元コードとURLが書いてある。他人に渡したり、SNSなどに載せたりしてはいけない。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/shussanshien/ninpunotamenoshienkyufu.html
    verified_at: 2026-09-20
  - id: chuo.shien_kyufu_annai_2
    name: 妊婦支援給付金（2回目）の案内通知（中央区）
    phase: postpartum
    description: 新生児訪問（赤ちゃん訪問）のときに受け取る。1回目と同じく、専用の申請サイトから申請する。
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/shussanshien/ninpunotamenoshienkyufu.html
    verified_at: 2026-09-20

