steps:
  - id: chuo.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、「母と子の保健バッグ」（母子健康手帳入り）を受け取る
    detail: 窓口は、保健所・保健センター（中央区保健所、日本橋・月島・晴海の各保健センター）、区役所、特別出張所。医師か助産師の診察を受けてから届け出る。持ち物は、本人確認書類、マイナンバーカードまたは通知カード。診察券など（病院名、妊娠週数、出産予定日などを書くので、あるとスムーズ。必須ではない）。代理人のときは委任状などもいる。マイナポータルで電子申請もできるが、その場合は中央区役所と日本橋・月島の特別出張所では受け取れず、申請から3日後以降に、住所を担当する保健所・保健センターへ行く。問い合わせ 03-3541-5930（中央区保健所健康推進課健康係）。妊娠して不安なことは、住所地を担当する保健所・保健センターの母子保健コーディネーター（助産師など）と保健師に相談できる（子育てガイドブック）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: chuo.hoken_bag
    channel: 保健所・保健センター / 区役所 / 特別出張所（電子申請のあとは保健所・保健センターへ来所）
    action_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/tetyokohu.html
    deadline_note: 期限は区のページに記載なし（医師か助産師の診察を受けたあとに届け出る）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: chuo.c_hoken
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/tetyokohu.html
    verified_at: 2026-09-20

  - id: chuo.s03b
    phase: pregnancy
    sort_order: 35
    title: 妊婦面談（母子保健コーディネーターとの面談）を受ける
    detail: 専門職（母子保健コーディネーター）との面談で、予約制。「ちゅうおう子育てナビアプリ」の中の妊婦面談予約システムで日時を予約する。区役所・特別出張所で妊娠届を出した人は、届出から3日後以降に予約する。オンライン面談を希望する人は、予約の前に、住所を担当する保健所・保健センターに電話する。面談のときに、妊婦支援給付金（1回目）の「案内通知」を受け取る。面談でもらえる品物があるかどうかは、区のページに記載なし。
    trigger_document_id: chuo.hoken_bag
    produces_document_id: chuo.shien_kyufu_annai_1
    channel: 保健所・保健センター（オンライン面談は事前に電話）
    action_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/tetyokohu.html
    deadline_note: 期限は区のページに記載なし。区は、体調が安定する妊娠15週以降に受けることをすすめている
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: chuo.c_hoken
    source_url: https://www.city.chuo.lg.jp/a0031/kosodate/shussan/tetyokohu.html
    verified_at: 2026-09-20

  - id: chuo.s03c
    phase: pregnancy
    sort_order: 36
    title: 出産支援祝品（タクシー利用券1万2千円分）を申請する
    detail: 産婦人科への通院などの負担を軽くするための、タクシー利用券1万2千円分（多胎児を妊娠している人は2万4千円分）。申請日に中央区に住所があり、母子健康手帳などで妊娠が確認できる人が対象。本人か同居の親族が、窓口・オンライン（ぴったりサービス）・郵送のどれかで申請する。窓口は区役所6階の子育て給付係、日本橋・月島・晴海の特別出張所、中央区保健所健康推進課、日本橋・月島・晴海の保健センター。持ち物は、妊娠がわかるもの（母子健康手帳など。多胎は手帳を複数冊）と本人確認書類。窓口なら原則その日に受け取れる。利用券の有効期限は発行から約1年。
    trigger_document_id: chuo.hoken_bag
    channel: 窓口 / オンライン（ぴったりサービス） / 郵送
    action_url: https://www.city.chuo.lg.jp/a0020/kosodate/shussan/shussanshien/taxi.html
    deadline_note: 出産日の前日まで
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
