  - id: bunkyo.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成
    kind: conditional
    amount_note: 認定基準を満たす病気の入院治療の自己負担額を助成（医療券の有効期限内のものに限る）。入院時の食事療養費は対象外。
    conditions: 文京区に住所登録のある妊産婦で、妊娠高血圧症候群とその関連疾病・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患のいずれかで入院治療が必要な人。前年分の世帯の総所得税額が30,000円以下、または入院見込み期間が26日以上。
    apply_via: 健康推進課健康増進係（03-5803-1961）へ郵送または窓口。原則、入院前か入院中に申請。やむを得ず退院後になる場合は、退院日から3か月以内（遅延理由書が必要）。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.bunkyo.lg.jp/b027/p001529.html
