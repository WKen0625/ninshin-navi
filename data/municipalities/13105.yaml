steps:
  - id: bunkyo.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 窓口は保健サービスセンター（文京シビックセンター8階）と保健サービスセンター本郷支所（月〜金の8時30分〜17時）。予約は不要。区民サービスコーナーでは平日の夜や土日祝日も受け取れるが、保健師はいない。持ち物は、届け出る人の本人確認書類と、妊婦本人の個人番号（マイナンバー）確認書類。同じ世帯でない人が行くときは委任状も必要。LoGoフォーム（区の電子申請）で先に妊娠届を出せるが、その場合も、住んでいる地区を受け持つ保健サービスセンターへ母子健康手帳を受け取りに行く。母子健康手帳を受け取る前の健診費用は助成されない。「母と子の保健バッグ」には、妊婦健康診査・妊婦超音波検査・妊婦子宮頸がん検診・妊婦歯周疾患検診・新生児聴覚検査・産婦健康診査・1か月児健康診査の受診票や案内、出生通知票、母子健康手帳副読本、マタニティマークストラップが入っている（子育てガイド2026）。担当の保健サービスセンターは住所で分かれる（本郷支所の担当地区は白山1・5丁目、本郷3・7丁目、湯島、西片2丁目、向丘、弥生、根津、千駄木、本駒込）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: bunkyo.hoken_bag
    channel: 保健サービスセンター / 本郷支所 / 区民サービスコーナー（電子申請のあと来所）
    action_url: https://www.city.bunkyo.lg.jp/b027/p001524.html
    deadline_note: 妊娠の診断を受けたら早めに（区のページに日付の期限は記載なし）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: bunkyo.c_hoken
    source_url: https://www.city.bunkyo.lg.jp/b027/p001524.html
    verified_at: 2026-09-20

  - id: bunkyo.s03b
    phase: pregnancy
    sort_order: 35
    title: ネウボラ面接（妊婦面接）を受ける
    detail: 母子保健コーディネーター（保健師）との面接。保健サービスセンターか本郷支所で妊婦本人が妊娠届を出したときは、その場で受けられる（予約不要）。区民サービスコーナーで届け出た人、本人以外が届け出た人、転入した人は、妊娠中に母子健康手帳を持って、8時30分〜17時に受け持ちの保健サービスセンターへ行く（予約不要）。面接を受けた妊婦は「育児パッケージ（子ども商品券）」を受け取れる（金額は区のページ本文に記載なし）。問い合わせは保健サービスセンター 03-5803-1807、本郷支所 03-3821-5106。子育てガイド2026では、保健師・助産師が妊婦全員と面接し、終了後に育児パッケージを渡すとしている。窓口の場所はシビックセンター（保健サービスセンター）と千駄木5-20-18（本郷支所）。
    trigger_document_id: bunkyo.hoken_bag
    channel: 保健サービスセンター / 本郷支所
    action_url: https://www.city.bunkyo.lg.jp/b029/p001562.html
    deadline_base: due_date
    deadline_offset_days: 0
    deadline_note: 妊娠中に受ける。産後の人は対象外
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: bunkyo.c_hoken
    source_url: https://www.city.bunkyo.lg.jp/b029/p001562.html
    verified_at: 2026-09-20

  - id: bunkyo.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目・5万円）を申請する
    detail: 文京区に住民登録があり、令和7年4月1日以降に妊娠している人が対象（妊娠とは、医療機関で胎児の心拍が確認されていること）。妊娠が確定したあとから、LoGoフォームで電子申請する。フォームは「母と子の保健バッグ」に入っている案内チラシにのっている。申請した月の翌々月の月末ごろに、申請者（妊婦）名義の口座に振り込まれる。ほかの市区町村で受け取っている場合は対象外。流産・死産などの場合も対象になるので、健康推進課健康増進係（03-5803-1961）に問い合わせる。
    trigger_document_id: bunkyo.shien_kyufu_annai
    channel: オンライン（LoGoフォーム）
    action_url: https://www.city.bunkyo.lg.jp/b027/p007561.html
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 妊娠確定日から2年以内
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から"
    contact_id: bunkyo.c_kenko
    source_url: https://www.city.bunkyo.lg.jp/b027/p007561.html
    verified_at: 2026-09-20

  - id: bunkyo.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯周疾患検診（妊娠中の歯ぐきの検診）を受ける
    detail: 文京区に住んでいる妊婦が対象。「母と子の保健バッグ」に入っている受診票を使い、区の名簿にある区内の指定歯科医療機関で受ける。内容は歯周組織検査（歯ぐきの検査）、口腔内検査、保健指導。区外では使えず、払い戻しの制度もない。問い合わせは健康推進課保健係 03-5803-1229。
    trigger_document_id: bunkyo.shika_kenshin_ticket
    channel: 区内の指定歯科医療機関
    action_url: https://www.city.bunkyo.lg.jp/b027/p001531.html
    contact_id: bunkyo.c_kenko
    source_url: https://www.city.bunkyo.lg.jp/b027/p001531.html
    verified_at: 2026-09-20

  - id: bunkyo.s06d
    phase: pregnancy
    sort_order: 66
    title: （文京区の国民健康保険の人）産前産後期間の国民健康保険料の軽減を確認する
    detail: 出産予定日または出産日の月の前月から4か月間（多胎は3か月前から6か月間）の所得割額と均等割額が免除される。妊娠85日以上の出産が対象。文京区に出産育児一時金を申請した人は自動で軽減され、届け出は要らない。文京区に出産育児一時金を申請していない人は別に申請が必要なので、国保年金課国保資格係（050-1725-5006・自動応答）に問い合わせる。子育てガイド2026では、国保年金課（シビックセンター11階南側）の電話は自動応答で、赤ちゃんの国保加入の手続きも同じ窓口としている。
    trigger_document_id: bunkyo.hoken_bag
    channel: 国保年金課国保資格係（文京シビックセンター11階）
    deadline_note: 期限は区のページに記載なし
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
    contact_id: bunkyo.c_kokuho
    source_url: https://www.city.bunkyo.lg.jp/b021/p000425.html
    verified_at: 2026-09-20

  - id: bunkyo.s08c
    phase: birth
    sort_order: 71
    title: 新生児聴覚検査を受ける
    detail: 赤ちゃんの耳のきこえの検査。初回検査の費用を上限3,000円まで助成。受けるときは新生児聴覚検査受診票、母子健康手帳、マイナ保険証を持っていく。都外や契約していない医療機関で受けたときは、あとから払い戻しを申請できる。
    trigger_document_id: bunkyo.shinseiji_choukaku_ticket
    channel: 医療機関
    deadline_note: 生後50日に達する日までに受けた初回検査が対象
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "生まれた日から（原則は出産で入院しているあいだ）"
    contact_id: bunkyo.c_kenko
    source_url: https://www.city.bunkyo.lg.jp/b027/p001532.html
    verified_at: 2026-09-20

  - id: bunkyo.s07c
    phase: postpartum
    sort_order: 75
    title: 出生通知票を郵送し、こんにちは赤ちゃん訪問（新生児訪問）を受ける
    detail: 赤ちゃんが生まれたすべての家庭を、助産師か保健師が訪問する（無料）。対象は区内在住で生後4か月までの赤ちゃんと保護者。生まれたらすぐに「出生通知票」を郵送すると、日程調整の電話が来る。体重測定、育児や産後の体調の相談ができる。令和7年3月31日以前に妊娠届を出した人は、この訪問のときに支援給付2回目の案内チラシを受け取る。子育てガイド2026では、母子健康手帳の二次元コードから出生通知票を出すか、電話で申し込むとしている。訪問のときに沐浴指導・相談や母乳相談（助産師の訪問型・外来型）も案内される。
