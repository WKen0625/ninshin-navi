  - id: sumida.s07c
    phase: postpartum
    sort_order: 75
    title: 出生通知票を郵送し、こんにちは赤ちゃん事業（新生児訪問）を受ける
    detail: 生後120日になるまでのすべての赤ちゃんを、保健師・助産師が訪問する。赤ちゃんが生まれたら、親子健康手帳に綴じこまれている「出生通知票（赤ちゃん訪問連絡票）」を書いて、できるだけ早く郵送する（名前が決まっていなければ空欄でよい。出生届とは別のもの）。届くと健康推進課から日程調整の電話が来る。里帰り先で受けたいときは「訪問してほしい場所」の欄に書く。訪問を受けると、支援給付（2回目）の申請案内が郵送で届く。問い合わせは健康推進課 03-3622-9152。出生通知票は電話でも受け付けている。里帰り先での訪問を希望する人は早めに健康推進課へ連絡する（2025・2026 すみだいきいき子育てガイドブック）。
