    description: 2回分。令和8年10月1日以降の受診に使える。令和8年4月から、親子健康手帳を受け取るときに交付。令和8年3月以前に妊娠届を出した人で手元に無い場合は、健康推進課母子健康づくり担当（03-3622-9139）に連絡すると郵送される。
    source_url: https://www.city.sumida.lg.jp/kenko_fukushi/kenko/oyako_kenko/ninshin/ninpu.html
    verified_at: 2026-09-20
