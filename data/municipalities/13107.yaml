    phase: birth
    description: 「母と子の保健バッグ」に入っている。原則として都内の委託医療機関で使える。
    source_url: https://www.city.sumida.lg.jp/kenko_fukushi/kenko/oyako_kenko/ninshin/akachan-mimikikoe.html
    verified_at: 2026-09-20
