      - sumida.ikkagetsuji_kenshin_ticket
      - sumida.shussei_tsuchihyo             # 親子健康手帳に綴じこまれている
    phase: notification
    description: 妊娠届を出すと、親子健康手帳（母子健康手帳）と一緒に受け取る。妊婦健康診査受診票、新生児聴覚検査受診票、妊産婦歯科健康診査受診票、マタニティマーク、産前産後に役立つ冊子などが入っている。電子申請で届け出た場合は、1週間ほどでレターパックで届く。
    source_url: https://www.city.sumida.lg.jp/kenko_fukushi/kenko/oyako_kenko/ninshin/ninsintodoke.html
    verified_at: 2026-09-20
  - id: sumida.kenshin_ticket
    name: 妊産婦健康診査等受診票（墨田区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 親子健康手帳を受け取るときに交付される都内共通の受診票。妊婦健康診査14回分、妊婦超音波検査4回分、妊婦子宮頸がん検診1回分、新生児聴覚検査1回分が1冊にまとまっている。令和8年4月からは、産婦健康診査2回分と1か月児健康診査1回分も交付される。原則として再発行できない。
    source_url: https://www.city.sumida.lg.jp/kenko_fukushi/kenko/oyako_kenko/ninshin/ninpu.html
    verified_at: 2026-09-20
