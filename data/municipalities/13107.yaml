    kind: conditional
    amount_note: 医療保険を使って入院治療した場合の自己負担額を助成。入院時の食事代（標準負担額）は自己負担。
    conditions: 墨田区内に住所があり、妊娠高血圧症候群とその関連疾患・糖尿病・貧血・産科出血・心疾患のいずれかで、認定基準を満たし入院治療が必要な人。前年（1〜6月の申請は前々年）の所得税額が30,000円以下の世帯、または入院見込み期間が26日以上。
    apply_via: 墨田区保健所 健康推進課 地域保健担当（横川5-7-4 すみだ保健子育て総合センター2階、03-3622-9130）。手続きが遅れると助成を受けられないことがある（日数の期限は区のページに記載なし）。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
