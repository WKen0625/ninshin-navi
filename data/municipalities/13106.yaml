  - id: taito.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成
    kind: conditional
    amount_note: 医療保険を使って入院治療した場合の自己負担額を、医療券（契約医療機関）か、あとからの払い戻しで助成。入院時の食事代（標準負担額）と文書料は対象外。
    conditions: 台東区に住民登録があり、妊娠高血圧症候群とその関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患のいずれかで、認定基準を満たし入院治療が必要な人。前年の所得税額が30,000円以下の世帯、または入院見込み期間が26日以上。
    apply_via: 台東保健所保健サービス課 母子成人保健担当（東上野4-22-8 台東保健所2階）の窓口か郵送。診断書の発行日から3か月以内に申請する。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
