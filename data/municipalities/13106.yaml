  - id: taito.s08e
    phase: postpartum
    sort_order: 84
    title: （都外や一部の助産所で健診を自費で受けた人）健診費用の助成を申請する
    detail: 里帰り出産などで受診票が使えず、妊婦健診・産婦健診・新生児聴覚検査・1か月児健診を自費で受けた人に、費用の一部が助成される（産婦健診と1か月児健診は令和8年10月の受診分から）。令和8年度の上限は、妊婦健診1回目11,670円、2〜14回目各5,460円、子宮頸がん検診3,400円、超音波検査各5,300円、新生児聴覚検査3,000円、産婦健診各5,000円、1か月児健診6,000円。助産所は妊婦健診2〜14回目と産婦健診2回だけが対象。申請は郵送で、まとめて1回だけ。送り先は浅草保健相談センター庶務担当（〒111-0033 花川戸2-11-10）。申請書、未使用の受診票、領収書と明細書、母子健康手帳の写しが必要。審査のうえ、申請月の翌々月末ごろに振り込まれる。
