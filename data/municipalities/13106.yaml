    detail: 出産日当日に台東区に住民票がある産婦に、一律5万円が助成される（妊娠12週（85日）以降の流産・死産も対象）。病院での自己負担が0円でも対象で、保健師などとの面談は要らない。Logoフォーム（区の電子申請）か「たいとうおやこ手帳アプリ」から、産婦本人が申請する。本人確認書類、振込先口座の通帳かキャッシュカード、出産したことがわかる書類（領収書、分娩・出産明細書、出産育児一時金の支給決定通知書など）の画像を付ける。申請した月の翌々月末ごろに振り込まれる。出産前には申請できない。
