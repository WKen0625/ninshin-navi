steps:
  - id: taito.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 医療機関で赤ちゃんの心拍の確認や妊娠の診断を受けたら届け出る。方法は2つ。(1) マイナポータル（ぴったりサービス）で妊婦本人が電子申請し、1週間ほどでレターパックプラス（対面で受け取り）で届く。個人番号カードが必要で、転入した人は使えない。(2) 窓口で届出書を書き、その場で受け取る（20分ほど）。窓口は浅草保健相談センター（花川戸2-11-10、03-3844-8171）、台東保健所保健サービス課（東上野4-22-8、03-3847-9447）、区役所1階 戸籍住民サービス課、各区民事務所・分室。持ち物は個人番号カード（無い人は本人確認書類）。代理の人は代理人の本人確認書類、別世帯なら委任状も必要。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: taito.hoken_bag
    channel: オンライン（マイナポータル・郵送で受け取り） / 窓口（保健所・保健相談センター・区役所・区民事務所）
    action_url: https://www.city.taito.lg.jp/kosodatekyouiku/kosodate/mokutei/kenkou_iryou/ninshin/todokede/boshikenkotecho.html
    deadline_note: なるべく早く（11週ごろまでに）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    source_url: https://www.city.taito.lg.jp/kosodatekyouiku/kosodate/mokutei/kenkou_iryou/ninshin/todokede/boshikenkotecho.html
    verified_at: 2026-09-20

  - id: taito.s03b
    phase: pregnancy
    sort_order: 35
    title: ゆりかご・たいとう面接を受ける
    detail: 保健師などとの面接（45分ほど。パートナーも同席できる）。面接日に台東区に住民登録がある妊婦本人が対象で、出産したあとは受けられない。場所は浅草保健相談センター（花川戸2-11-10 3階）か台東保健所保健サービス課（東上野4-22-8 2階）。月〜金の9時〜16時。予約は電子申請か電話（浅草 03-3844-8172、台東保健所 03-3847-9497）。予約なしでも受けられるが、予約の人が優先。持ち物は母子健康手帳とA4の書類が入る袋。面接のあと、育児パッケージ（1万円分）を受け取り、妊婦のための支援給付（1回目）の申請フォームを案内される。
    trigger_document_id: taito.hoken_bag
    produces_document_id: taito.shien_kyufu_annai_1
    channel: 浅草保健相談センター / 台東保健所
    action_url: https://www.city.taito.lg.jp/kosodatekyouiku/kosodate/nenrei/ninshinki/soudan_shien/yurikago.html
    deadline_base: due_date
    deadline_offset_days: 0
    deadline_note: 妊娠中に受ける。出産した人は対象にならない
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    source_url: https://www.city.taito.lg.jp/kosodatekyouiku/kosodate/nenrei/ninshinki/soudan_shien/yurikago.html
    verified_at: 2026-09-20

  - id: taito.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付（1回目・5万円）を申請する
    detail: 申請の時点で台東区に住民票のある妊婦が対象（令和7年4月1日以降のゆりかご・たいとう面接から）。ゆりかご・たいとう面接のあとに案内される申請フォームから申請する。現金給付で、本人名義の口座に振り込まれる。台東区やほかの自治体で、出産応援ギフトか支援給付1回目を受け取っていない人に限る。流産・死産の場合は別の申請方法がある（提出先は浅草保健相談センター庶務担当）。
    trigger_document_id: taito.shien_kyufu_annai_1
    channel: 面接のときの案内に沿って申請
    deadline_note: 申請期限は区のページに記載なし（面接のときに確認する）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "区の妊婦面接・面談のあと"
    source_url: https://www.city.taito.lg.jp/kosodatekyouiku/kosodate/mokutei/teate_josei/ninpusienkyufu.html
    verified_at: 2026-09-20

