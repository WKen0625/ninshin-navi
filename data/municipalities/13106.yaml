    detail: 赤ちゃんが生まれたすべての家庭を、保健師か助産師が訪問する（無料）。対象は区内在住で生後4か月を迎えるまでの赤ちゃんがいる家庭。生まれたあと、できれば2週間以内に「出生通知書（赤ちゃん訪問連絡票）」を電子申請で出す（難しければ電話でもよい）。体重測定、育児や産後の体調の相談、健診や予防接種の案内がある。里帰り先での訪問を希望するときは、出生通知書に書く。連絡先は台東保健所保健サービス課 03-3847-9497、浅草保健相談センター 03-3844-8172。
