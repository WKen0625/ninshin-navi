    verified_at: 2026-09-20

  - id: taito.s06d
    phase: pregnancy
    sort_order: 66
    title: （台東区の国民健康保険の人）産前産後の国民健康保険料の軽減を届け出る
    detail: 出産する人の均等割額と所得割額の全額が、単胎なら4か月（出産（予定）日の月の前月から翌々月まで）、多胎なら6か月（3か月前から翌々月まで）軽減される。妊娠85日（4か月）以上の出産が対象。窓口は区役所2階12番窓口の国民健康保険課資格係（03-5246-1252）。郵送でも届け出できる（電話すると届出一式と返信用封筒が送られてくる）。必要なものは、本人確認書類、マイナンバーが確認できる物、母子健康手帳など。
