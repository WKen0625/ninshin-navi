  - id: shibuya.kouketsuatsu
    name: 妊娠高血圧症候群医療費助成（渋谷区）
    kind: conditional
    amount_note: 入院治療にかかった医療費のうち、医療保険がきく診療の自己負担額を助成（食事療養費を除く）。
    conditions: 渋谷区に住民登録があり、妊娠高血圧症候群とその関連疾患、糖尿病・妊娠糖尿病、貧血、産科出血（1000cc以上）、心疾患で入院治療を受ける人。前年分の世帯の総所得税額が30,000円以下、または対象の病気での入院期間が26日以上。生活保護を受けている人は除く。
    apply_via: 前もって地域保健課地域医療係（03-3463-1211）に問い合わせ、入院（見込み）期間が決まったらすぐに窓口か郵送で申請する。退院後はなるべく早めに。
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-teate/ninshiniryo.html
    verified_at: 2026-09-20
    needs_review: true
