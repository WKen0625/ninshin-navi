    detail: 受診した日に渋谷区に住民登録がある、出産後2か月以内の産婦が対象（流産・死産も対象）。受診票に書かれた項目は公費で受けられる。受診票は令和8年10月1日以降の受診から使える（9月30日までの受診は対象にならない）。都内の委託医療機関以外で受けたときは、1回5,000円を上限に2回まで、あとから払い戻しを申請できる（手続きのページは9月下旬ごろ公開予定）。問い合わせは中央保健相談所母子保健係 03-3463-2409。都外の医療機関で産婦健康診査・1か月児健康診査を受ける人向けの案内が「母と子の保健バッグ」に入っている。
