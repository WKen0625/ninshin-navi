    detail: 受診した日に渋谷区に住民登録があり、受診票が使えない国内の機関（都内の一部の助産所、里帰りなどでの都外の医療機関・助産所）で受けた人が対象。令和8年4月1日以降の受診分の上限は、妊婦健康診査1回目11,670円、2〜14回目各5,460円、超音波検査5,300円（4回）、子宮頸がん検診3,400円、新生児聴覚検査3,000円（生後50日までの初回検査）。申請書兼請求書、使わなかった受診票、領収書と診療費明細書のコピー、母子健康手帳のコピーを、原則として郵送で出す。問い合わせは中央保健相談所母子保健係 03-3463-2409。区から転出した場合は、分娩前でも申請できる。指定の口座への振込までには時間がかかる（ハンドブックによる）。
