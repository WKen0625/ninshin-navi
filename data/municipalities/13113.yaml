steps:
  - id: shibuya.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 窓口は、各保健相談所（中央保健相談所母子保健係・恵比寿保健相談所・幡ヶ谷保健相談所）、区役所3階の住民戸籍課窓口、出張所、区民サービスセンター。持ち物は、妊婦の本人確認書類、個人番号（マイナンバー）確認書類、妊娠の診断を受けた医療機関の情報（診察券など）。代理人が届け出るときは、委任状、代理人の身元確認書類、妊婦本人の番号確認書類が必要。オンラインでの届出は区のページに記載なし。「母と子の保健バッグ」には、ネウボラ子育てハンドブックのほか、新生児聴覚検査受診票、RSウイルスワクチンの受診票、産婦健康診査と1か月児健康診査の受診票、都外の医療機関で受ける人向けの案内なども入っている（ハンドブックによる）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: shibuya.hoken_bag
    channel: 各保健相談所・区役所3階住民戸籍課・出張所・区民サービスセンター
    deadline_note: 医療機関で妊娠と診断されたら早めに
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: shibuya.c_boshi
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-todoke/ninshin_todoke.html
    verified_at: 2026-09-20

  - id: shibuya.s03b
    phase: pregnancy
    sort_order: 35
    title: 妊婦面接を受ける（妊娠16〜32週）
    detail: 保健師が、区内に住むすべての妊婦と会って話を聞く。場所は住所地を受け持つ保健相談所（中央・恵比寿・幡ヶ谷）。平日9〜17時、30分ほど。予約は渋谷区LINE公式アカウント（24時間受付）か電話で、希望日の30日前から。来所が難しいときはオンラインの相談もある。面接を受けると、育児パッケージ（肌着・ベビー服などの衣類、スタイ、体温計、ガーゼ、バスタオル、おもちゃ、爪切りなど）を受け取る。
    trigger_document_id: shibuya.hoken_bag
    channel: 住所地を受け持つ保健相談所（オンライン相談も可）
    action_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-sodan/ninpu.html
    deadline_base: gestational_week
    deadline_week: 32
    deadline_note: 妊娠16〜32週の間に受ける
    apply_from_base: gestational_week
    apply_from_week: 16
    apply_from_note: "妊娠16週から"
    contact_id: shibuya.c_hokensodan
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-sodan/ninpu.html
    verified_at: 2026-09-20

  - id: shibuya.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 渋谷区妊婦支援給付金（1回目・5万円）を申請する
    detail: 妊娠届を出した翌月の下旬ごろまでに、区から案内が送られてくる。届いたら早めに、原則としてLINEでオンライン申請する。現金（口座振込）か、同じ額のギフトを申請のときに選ぶ。対象は渋谷区に住所があり、妊婦給付認定を受けた妊婦。流産・死産の場合も対象。問い合わせは渋谷区妊婦支援給付金コールセンター 03-3463-3589。
    trigger_document_id: shibuya.shien_kyufu_annai_1
    channel: オンライン（LINE）
    deadline_base: confirmation_date
    deadline_offset_days: 730
    deadline_note: 医療機関で妊娠が確認された日から2年間
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から"
    contact_id: shibuya.c_callcenter
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-teate/ninpu_kyuhu.html
    verified_at: 2026-09-20

  - id: shibuya.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健診を受ける（妊娠中に1回）
    detail: 区内の契約歯科医療機関に前もって連絡し、「渋谷区妊婦歯科健康診査票」と母子健康手帳を持って受ける。費用は区のページに記載なし。問い合わせは中央保健相談所母子保健係 03-3463-2409。ハンドブックでは「区内協力歯科医院で無料歯科健診が受けられる」と書かれている。利用できる歯科医院の一覧は区ホームページにある。
    trigger_document_id: shibuya.shika_kenshin_ticket
    channel: 区内の契約歯科医療機関
    deadline_note: 妊娠中に1回
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: shibuya.c_boshi
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/nimpu-kenshin/ninpu_shika.html
    verified_at: 2026-09-20

  - id: shibuya.s06d
    phase: pregnancy
    sort_order: 66
    title: （渋谷区の国民健康保険の人）産前産後期間の国民健康保険料の免除を届け出る
    detail: 妊娠85日（4か月）以上で出産する（した）国民健康保険の加入者が対象。出産月の前月から4か月分（多胎は出産月の3か月前から6か月分）の保険料が免除される。届出は、区役所3階3番窓口（国民健康保険課資格賦課係）、オンライン申請、LINE申請、郵送のどれか。顔写真つきの本人確認書類と、出産予定日か出産日がわかる母子健康手帳が必要。出産後の届出もできる。問い合わせ 03-3463-1781。
    trigger_document_id: shibuya.hoken_bag
    channel: 窓口 / オンライン / LINE / 郵送
    action_url: https://www.city.shibuya.tokyo.jp/kurashi/kokuho/kenkohokenryo/sanzensangokokuho.html
    deadline_note: 出産予定日の6か月前から届け出できる
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
    contact_id: shibuya.c_kokuho_shikaku
    source_url: https://www.city.shibuya.tokyo.jp/kurashi/kokuho/kenkohokenryo/sanzensangokokuho.html
    verified_at: 2026-09-20

  - id: shibuya.s07b
    phase: postpartum
    sort_order: 72
    title: ハッピーマザー出産助成金（上限10万円）を申請する
    detail: 渋谷区が独自に出す助成金。1人の出産につき上限10万円で、加入している健康保険から付加給付（出産育児一時金への上乗せ）が出るときは、その額が引かれる。窓口（区役所6階国民健康保険課給付係・出張所・区民サービスセンター）、郵送、LINEで申請できる。出産の事実がわかるもの（母子健康手帳の「出生届出済証明」のページなど）、健康保険がわかる書類、付加給付の額がわかる書類（渋谷区の国保・全国健保の人は不要）が必要。助成金は所得税の課税対象（一時所得）。問い合わせは国民健康保険課給付係 03-3463-1776。LINEで申請する人だけ、セブン銀行ATMでの受け取りを申し込める（ハンドブックによる）。
    trigger_document_id: jp.hospital_receipt
    channel: 窓口 / 郵送 / オンライン（LINE）
    action_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-teate/happy_josei.html
    deadline_base: birth_date
    deadline_offset_days: 365
    deadline_note: 出産日から数えて1年以内
    survey_question_id: cost_paid
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    contact_id: shibuya.c_kokuho_kyufu
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/ninshin-teate/happy_josei.html
    verified_at: 2026-09-20

  - id: shibuya.s07c
    phase: postpartum
    sort_order: 75
    title: 「出生通知票」を出し、こんにちは赤ちゃん訪問を受ける
    detail: 子どもが生まれたら「出生通知票」を出す。渋谷区LINE公式アカウント、郵送、窓口（区役所3階住民戸籍課、出張所・区民サービスセンター、各保健相談所）で出せる。生後4か月までの赤ちゃんのいるすべての家庭を、保健師・助産師・看護師が訪問する（生後2か月に入ると訪問の手紙が届く）。生後28日までの新生児には、必要に応じて保健師か助産師の新生児訪問もある。問い合わせは中央保健相談所母子保健係 03-3463-2409。出生通知票は低体重児届を兼ねているので、赤ちゃんの体重が小さいときは速やかに出す。里帰り中などに区外で訪問を受けたいときは、滞在先の自治体に問い合わせる（ハンドブックによる）。
