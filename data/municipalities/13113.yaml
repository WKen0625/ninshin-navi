    description: 妊婦健康診査14回、妊婦超音波検査4回、妊婦子宮頸がん検診1回。「母と子の保健バッグ」に入っている。助産所や、里帰りなどで東京都外の医療機関で受けた人は、出産後に「里帰り等妊婦健康診査費用助成金」を申請する。
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/nimpu-kenshin/ninpu_kenshin.html
    verified_at: 2026-09-20
