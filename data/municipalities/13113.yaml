    name: 産婦健康診査受診票（渋谷区）
    phase: postpartum
    description: 令和8年10月1日以降の受診から使える（9月30日までの受診は、受診票を持っていても助成の対象にならない）。令和8年4月1日以降に妊娠届を出した人は母子健康手帳と一緒に受け取る。3月31日までに届け出た人には9月3日に発送。
    source_url: https://www.city.shibuya.tokyo.jp/kodomo/ninshin/nimpu-kenshin/sanpu_kenshin.html
    verified_at: 2026-09-20
