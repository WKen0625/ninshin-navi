    kind: cash_later
    # 出産費用の実費 − 出産育児一時金（付加給付なども引く）。1度の出産につき最大31万円（双子以上でも同じ）
    amount_formula: "min(cost - lumpsum, 310000)"
    amount_is_upper_limit: true
    amount_note: 出産費用の実費（入院料、分娩料、新生児管理費など）から出産育児一時金を引いた額で、1度の出産につき最大31万円（双子以上でも最大31万円）。健康保険の付加給付、高額療養費の返還、東京都の無痛分娩費用助成などを受けたときは、その額も実費から引く。ここでは出産なびの費用を実費の目安にして計算している。助成を受けた金額は医療費控除を受けられない。
    conditions: 令和7年4月1日以降に出産した人。出産日以前から区内に住所があり、申請日に引き続き1年以上区内に住所があること。国内の健康保険に入っていて、その出産で出産育児一時金を受け取っていること。出生日から赤ちゃんの住民登録が同じ住所にあること。妊娠85日以上の死産・流産（人工妊娠中絶を含む）も対象。生活保護を受けている人は対象外。区外へ転出したあとは申請できない。
    apply_via: 区役所2階 子育て推進課 / 千代田保健所6階 保健サービス課 / 各出張所（窓口）、郵送（子育て推進課あて）、千代田区ポータルサイト。問い合わせ 03-5211-4230
    deadline_base: birth_date
    deadline_offset_days: 730
    scheme_applicable: [lumpsum]
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    source_url: https://www.city.chiyoda.lg.jp/koho/kosodate/teate/shussanhiyojosei.html
    verified_at: 2026-09-20

  - id: chiyoda.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成
    kind: conditional
    amount_note: 対象の病気の治療にかかった入院医療費のうち、医療保険を使ったあとの自己負担額を助成。入院時の食事代、認定期間の外の医療費、保険がきかない費用（差額ベッド代など）は対象外。
    conditions: 千代田区に住所があり、妊娠高血圧症候群と関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患（認定基準あり）で入院する人。前年の総所得税額が30,000円以下の世帯の人、または入院見込み期間が26日以上の人。生活保護を受けている人は対象外。
    apply_via: 千代田保健所。入院前か入院中に申請する。退院後は、退院日から3か月以内に遅延理由書などを添えて申請する。問い合わせ 03-6256-8477
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.chiyoda.lg.jp/koho/kosodate/kosodate/ninshin/koketsuatsu.html
