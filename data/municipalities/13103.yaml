    detail: 出産する人の保険料（所得割額・均等割額）が、出産予定月（または出産月）の前の月から翌々月までの4か月分（多胎妊娠は3か月前からの6か月分）免除される。妊娠85日（4か月）以上の出産が対象で、死産・流産・早産・人工妊娠中絶も含む。届出先は各地区総合支所の区民課窓口サービス係（芝地区総合支所は相談担当）。持ち物は、資格確認書または資格情報通知書、マイナンバー確認書類（世帯主と本人の分）、本人確認書類、母子健康手帳など出産の事実がわかるもの（出産後は、出産日と親子関係がわかる書類）。保険料が限度額に達している世帯は、減額されない場合がある。問い合わせ 国保年金課資格保険料係 03-3578-2574〜2578。
