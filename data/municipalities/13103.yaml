  - id: minato.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成
    kind: conditional
    amount_note: 入院治療にかかった費用のうち、健康保険を使ったあとの自己負担額を助成（入院時の食事代と、保険がきかない費用は対象外）。
    conditions: 港区に住民登録があり、妊娠高血圧症候群とその関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患（とその続発症）で、医師が入院を必要と認めた妊婦。前年分の総所得税額が30,000円以下の世帯、またはそれ以外で入院見込み期間が26日以上の人。生活保護受給世帯などは除く。
    apply_via: みなと保健所健康推進課地域保健係（03-6400-0084。郵送も可）または各総合支所区民課保健福祉係。申請書・診断書・療養証明書・世帯調書・保険情報がわかるもの・領収書を、退院日から3か月以内に出す（3か月を超えると申請できない）。高額療養費支給決定通知書は、あとからでもよい。
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/ninshin/ninshin/koketsuatsu.html
    verified_at: 2026-09-20

