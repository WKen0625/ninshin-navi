documents:
  - id: minato.hoken_bag
    name: 母と子の保健バッグ（港区。母子健康手帳と一緒に受け取る袋）
    aliases: [保健バッグ, 母子手帳のセット]
    # この袋を持っていれば、中の紙も持っている扱いにする
    includes:
      - jp.boshi_techo
      - jp.kenshin_ticket
      - minato.kenshin_ticket
      - minato.shinseiji_choukaku_ticket
      - minato.sanpu_kenshin_ticket      # 令和8年4月1日以降に妊娠届を出した人。それより前の人は申請書が郵送される
      - minato.ikkagetsuji_kenshin_ticket   # 同上（2026-09-20 追記）
    phase: notification
    description: 妊娠届を出すと、母子健康手帳・港区妊娠・子育て情報のクリップファイルと一緒に受け取る。中身は港区子育てハンドブック、妊婦健康診査受診票、新生児聴覚検査受診票など。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/ninshin/ninshin/ninshin.html
    verified_at: 2026-09-19
  - id: minato.kenshin_ticket
    name: 妊婦健康診査受診票（港区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回分（1回目は11,670円、2〜14回目は各5,460円を助成）、超音波検査4回分（各5,300円）、子宮頸がん検診1回分（3,400円）。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/ninshin/ninshin/ninpukennshin.html
    verified_at: 2026-09-19
  - id: minato.shinseiji_choukaku_ticket
    name: 新生児聴覚検査受診票（港区）
    phase: birth
    description: 「母と子の保健バッグ」に入っている。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/ninshin/ninshin/ninshin.html
    verified_at: 2026-09-19
  - id: minato.sanpu_kenshin_ticket
    name: 産婦健康診査受診票（港区）
    phase: postpartum
    description: 2回まで、1回5,000円を助成（令和8年4月1日開始）。令和8年4月1日以降に妊娠届を出した人は「母と子の保健バッグ」に同封。それより前の人には、産後2か月ごろに区から申請書が郵送される。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/sanpu.html
    verified_at: 2026-09-19
  - id: minato.shien_kyufu_shinsei_1
    name: 妊婦支援給付金（1回目）の申請書（港区）
    phase: pregnancy
    description: みなとプレママ応援事業（妊婦全員面接）のときに受け取る。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/puremama.html
    verified_at: 2026-09-19
  - id: minato.akachan_homon_annai
    name: こんにちは赤ちゃん訪問の案内（港区）
    phase: postpartum
    description: 妊婦支援給付金2回目の申請は、この訪問のときに案内される。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kodomo/syusankosodate07.html
    verified_at: 2026-09-19
  # ---- ここから 2026-09-20 追記 ----
  - id: minato.ikkagetsuji_kenshin_ticket
    name: 1か月児健康診査受診票（港区）
    aliases: [1か月健診の受診票]
    phase: postpartum
    description: 1回、6,000円を助成（令和8年4月1日開始）。令和8年4月1日以降に受け取る「母と子の保健バッグ」に入っている。それより前に妊娠届を出した人には、産後2か月ごろに区から払い戻し用の申請書が郵送される。
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/1shinsa.html
    verified_at: 2026-09-20

