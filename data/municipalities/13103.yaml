steps:
  - id: minato.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 窓口は各総合支所（芝・麻布・赤坂・高輪・芝浦港南）の区民課保健福祉係。持ち物は本人確認書類、個人番号（マイナンバー）確認書類、医師または助産師の診察券など。マイナポータルで電子申請もできるが、その場合も母子健康手帳などを受け取りに窓口へ行く必要がある。台場分室の窓口でも届け出できる。母子健康手帳と一緒に「港区妊娠・子育て情報ファイル」も受け取る（子育てハンドブック「みんなとKIDS」）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: minato.hoken_bag
    channel: 各総合支所 区民課保健福祉係（電子申請のあと来庁）
    deadline_note: 医療機関で妊娠の診断を受けたら、なるべく早めに
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: minato.c_shisho_hoken
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/ninshin/ninshin/ninshin.html
    verified_at: 2026-09-19

  - id: minato.s03b
    phase: pregnancy
    sort_order: 35
    title: みなとプレママ応援事業（妊婦全員面接）を受ける
    detail: 助産師などとの面接。場所はみなと保健所（三田1-4-10）。来所が難しければオンライン面談もできる。予約は「みなと母子（親子）手帳アプリ」から。面接のあと、妊婦支援給付金（1回目）の申請書と、子ども商品券（1万円分）を受け取る。
    trigger_document_id: minato.hoken_bag
    produces_document_id: minato.shien_kyufu_shinsei_1
    channel: みなと保健所（オンライン面談も可）
    action_url: https://www.city.minato.tokyo.jp/chiikihoken/puremama.html
    deadline_base: due_date
    deadline_offset_days: 0
    deadline_note: 妊娠5か月（安定期）以降がおすすめ。出産後は受けられない
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: minato.c_hoken
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/puremama.html
    verified_at: 2026-09-19

  - id: minato.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦支援給付金（1回目・5万円）を申請する
    detail: 令和7年4月1日以降に妊娠届を出し、プレママ面談を受けた人が対象。現金（妊産婦名義の口座に振込）か電子クーポンを選ぶ。申請のしかたは面談のときに案内される。流産・死産の場合も対象。問い合わせ 03-6722-0310（平日9〜17時）。
    trigger_document_id: minato.shien_kyufu_shinsei_1
    channel: 面談のときの案内に沿って申請
    deadline_note: 申請期限は区のページに記載なし（面談のときに確認する）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "区の妊婦面接・面談のあと"
    contact_id: minato.c_hoken
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kodomo/syusankosodate07.html
    verified_at: 2026-09-19

  - id: minato.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊産婦歯科健診を受ける（妊娠中に1回）
    detail: 区内在住の妊娠中または産後1年未満の人が対象で、妊娠中と産後にそれぞれ1回。場所はみなと保健所3階。月1回・水曜の午後で、オンライン予約（港区mila-e予約、先着順）。
    trigger_document_id: minato.hoken_bag
    channel: みなと保健所
    action_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/kenko/shinsa/ninsanpushika.html
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: minato.c_hoken
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kenko/kenko/shinsa/ninsanpushika.html
    verified_at: 2026-09-19

  - id: minato.s07b
    phase: postpartum
    sort_order: 72
    title: 港区の出産費用の助成を申請する
    detail: 分娩費・入院費などの実費（上限は1人なら81万円）から、出産育児一時金などを引いた額が助成される（1人なら最大31万円）。窓口は各総合支所区民課保健福祉係。郵送（子ども若者支援課子ども給付係）とマイナポータルの電子申請もできる。申請書、領収書・明細書、母の保険情報、出産育児一時金の受給がわかる書類が必要。出産育児一時金付加金や高額療養費の支給決定通知書（写）が必要な場合もある（子育てハンドブック「みんなとKIDS」）。
    trigger_document_id: jp.hospital_receipt
    channel: 窓口 / 郵送 / オンライン（マイナポータル）
    action_url: https://www.city.minato.tokyo.jp/kodomokyufu/kenko/ninshin/shussan/jose.html
    deadline_base: birth_date
    deadline_offset_days: 365
    deadline_note: 出生日から1年以内
    survey_question_id: cost_paid
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    contact_id: minato.c_teate
    source_url: https://www.city.minato.tokyo.jp/kodomokyufu/kenko/ninshin/shussan/jose.html
    verified_at: 2026-09-19

  - id: minato.s08
    overrides_step_id: jp.s08
    phase: postpartum
    sort_order: 80
    title: 妊婦支援給付金（2回目・子ども1人につき5万円）を申請する
    detail: 令和7年4月1日以降に出産し、こんにちは赤ちゃん訪問を受けた人が対象。申請のしかたは訪問のときに案内される。現金か電子クーポンを選ぶ。
    trigger_document_id: minato.akachan_homon_annai
    channel: 訪問のときの案内に沿って申請
    deadline_note: 申請期限は区のページに記載なし（訪問のときに確認する）
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産後、区の訪問のあと"
    contact_id: minato.c_hoken
    source_url: https://www.city.minato.tokyo.jp/chiikihoken/kodomo/syusankosodate07.html
    verified_at: 2026-09-19

  - id: minato.s08b
    phase: postpartum
    sort_order: 82
    title: 産婦健康診査を受ける（2回まで）
    detail: 区民で生後2か月以内の産婦が対象。1回5,000円を2回まで助成。令和8年10月1日以降は、都内の契約医療機関で受診票を出して受ける（9月30日までの受診は、あとから払い戻し）。
