    kind: conditional
    amount_note: 双子など（多胎）の妊娠で、受診票14回分を超えて自費で受けた妊婦健康診査（15〜19回目）の費用を助成。1回につき上限5,460円（令和7年度の受診分は5,280円）、1人あたり5回まで。
    conditions: 受診日に、多胎児を妊娠していて、港区に住所がある人。海外での受診、保険診療の分、母子健康手帳を受け取る前の受診、健診を伴わない超音波検査・子宮頸がん検診などは対象外。
    apply_via: 郵送または窓口（みなと保健所健康推進課地域保健係 〒108-8315 港区三田1-4-10、03-6400-0084）。申請書、15回目以降の領収書・明細書の写し、子ども全員分の母子健康手帳の写しを出す。
    deadline_base: birth_date
    deadline_offset_days: 365
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
