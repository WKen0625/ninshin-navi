    detail: 受診票が使えるのは都内の契約医療機関だけなので、都外の医療機関で自費で受けた妊婦健康診査・超音波検査・子宮頸がん検診・新生児聴覚検査・産婦健康診査・1か月児健康診査は、申請すると費用の一部が助成される（上限は受診票と同じ額。実費が上限より少なければ実費）。受診票を受け取った日より後で、港区に住民登録がある間の受診が対象。海外での受診は対象外。助産院での受診は、妊婦健康診査の2〜14回目と産婦健康診査だけが対象。必要なものは、港区妊婦健康診査等費用助成金支給申請書、使っていない受診票、領収書のコピー、母子健康手帳の該当ページのコピー。提出先は、みなと保健所健康推進課（郵送か持参。〒108-8315 港区三田1-4-10）か、各地区総合支所区民課保健福祉係（持参のみ）。港区から転出したあとでも、出産前でも申請できる。問い合わせ 03-6400-0084。
