    detail: 区の独自事業。現金ではなく、育児支援品に引き換えられる電子クーポン50,000円相当。対象は、区内に住み、令和6年4月1日以降に生まれた子どもを育てている世帯。受け取るには「子育てエール」（子育て世帯見守り訪問事業）への登録が必要。届いた案内にそって専用WEBサイトから申請すると、翌日までにマイページにクーポンが届く。子ども1人につき1回だけで、多胎の場合は子どもごとに申請する。問い合わせは豊島区子育て世帯見守り訪問事業コールセンター 0570-033100（祝日を除く平日 午前9時〜午後5時）。
