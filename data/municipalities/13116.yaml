steps:
  - id: toshima.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 窓口は、健康推進課（豊島区保健所2階 総合窓口、南池袋2-1-1、03-3987-4173）、長崎健康相談所1階（長崎3-6-24、03-3957-1191）、東部区民事務所、西部区民事務所。平日の午前8時30分〜午後5時。持ち物は、マイナンバーカード（写真つき）か、マイナンバー入りの住民票と本人確認書類（写真つきでないものは2点以上）。妊娠の証明書などはいらない。代理の人は、代理人の本人確認書類・妊婦のマイナンバーを確認する書類・委任状が必要。同じ日に「ゆりかご面接」も受けたい人は、午後4時までに健康推進課か長崎健康相談所へ行く。マイナポータルで電子申請もできるが、それだけでは終わらず、母子健康手帳と保健バッグは、あとで健康推進課か長崎健康相談所へ受け取りに行く（郵送はできない。申請から7日以内（土日祝・年末年始を除く）に区から電話かメールで連絡が来る）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: toshima.hoken_bag
    channel: 健康推進課 / 長崎健康相談所 / 東部・西部区民事務所（電子申請のあと来所）
    action_url: https://www.city.toshima.lg.jp/219/kosodate/ninshin/shussanmade/001311.html
    deadline_note: 医療機関で妊娠の診断を受けたら届け出る（期限は区のページに記載なし）。母子健康手帳を受け取る前の健診は、助成の対象にならない
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: toshima.c_hoken
    source_url: https://www.city.toshima.lg.jp/219/kosodate/ninshin/shussanmade/001311.html
    verified_at: 2026-09-20

  - id: toshima.s03b
    phase: pregnancy
    sort_order: 35
    title: ゆりかご面接（妊婦面接）を受ける
    detail: 助産師か保健師との面接で、30〜60分ほど。対象は、豊島区で妊娠届（転入した人は転入者用の妊娠届）を出し、面接の日に豊島区に住民登録がある妊婦。パートナーも同席できる。場所は豊島区保健所 健康推進課（2階の総合窓口、03-6311-6842）か長崎健康相談所（03-3957-1191）で、住んでいる地域で分かれる。平日9時〜16時。予約が優先で、予約フォームから申し込む。予約なしでも16時までに受付すれば受けられるが、待つことがある。持ち物は母子健康手帳（必須）と、ゆりかご面接券（なくても受けられる）。面接のあと、妊婦のための支援給付金（1回目）の案内があり、区から「ゆりかご応援ギフト」（電子クーポン1万円分。現金ではない）が渡される（ギフトと案内については「ゆりかご・としま事業」のページ https://www.city.toshima.lg.jp/219/kosodate/ninshin/yurikago/1508100918.html に書かれている）。切迫早産で入院中か自宅安静の人と、里帰り出産で来所がむずかしい人は、オンライン面接もできる（長崎健康相談所に電話で相談）。面接の担当は住所で分かれる（健康推進課＝駒込・巣鴨・西巣鴨・北大塚・南大塚・池袋・上池袋・東池袋・西池袋・南池袋・池袋本町・雑司ヶ谷・高田・目白、長崎健康相談所＝長崎・南長崎・千早・要町・高松・千川）。長崎・南長崎などの人は長崎健康相談所へ（区の公式ページ）。
    trigger_document_id: toshima.hoken_bag
    produces_document_id: toshima.shien_kyufu_annai_1
    channel: 豊島区保健所 健康推進課 / 長崎健康相談所（条件つきでオンラインも可）
    action_url: https://www.city.toshima.lg.jp/219/kosodate/ninshin/yurikago/1507071003.html
    deadline_base: due_date
    deadline_offset_days: 0
    deadline_note: 出産までに受ける。つわりなどで体調がすぐれない時期は無理をしなくてよい
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: toshima.c_hoken
    source_url: https://www.city.toshima.lg.jp/219/kosodate/ninshin/yurikago/1507071003.html
    verified_at: 2026-09-20

  - id: toshima.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦のための支援給付金（1回目・5万円）を申請する
