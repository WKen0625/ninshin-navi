    phase: notification
    description: 妊娠届を出した人に渡される。中身は妊婦健康診査受診票（14回）、妊婦超音波検査受診票（4回）、子宮頸がん検診受診票、新生児聴覚検査受診票（子の数の分）、妊産婦歯科健康診査受診票、産婦健康診査受診票（2回）、1か月児健康診査受診票、先天性代謝異常検査のお知らせ、母親学級などのお知らせ、出生通知票（赤ちゃん訪問用のはがき）。郵送では受け取れない。
