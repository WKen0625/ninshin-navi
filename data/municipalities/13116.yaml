  - id: toshima.kouketsuatsu
    name: 妊娠高血圧症候群等医療費助成（豊島区）
    kind: conditional
    amount_note: 対象の病気での入院治療にかかる費用のうち、健康保険がきく分の自己負担額を助成。入院中の食事代（標準負担額）は自己負担。認定されると医療券が交付され、保険の資格がわかるものと一緒に医療機関の窓口で見せる。すでに払った分は、申請者に直接支払われる。
    conditions: 豊島区に住民登録があり、妊娠高血圧症候群とその関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患（とその続発症）で入院治療が必要な人（病気ごとに認定基準がある）。さらに、前年分の世帯の総所得税額が30,000円以下、または入院見込み期間が26日以上であること。生活保護を受けている世帯は対象外。
    apply_via: 健康推進課（豊島区保健所3階、03-3987-4173）か長崎健康相談所（03-3957-1191）。平日 午前8時30分〜午後5時。原則、入院前か入院中に申請する。退院後になった場合は退院後3か月以内（遅延理由書が必要で、実際の入院期間が26日以上の人だけが対象）
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
    source_url: https://www.city.toshima.lg.jp/219/kosodate/ninshin/shussanmade/001336.html
    verified_at: 2026-09-20
