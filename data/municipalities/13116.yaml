    detail: 出産する本人の分の保険料（所得割額と均等割額）から、出産予定月の前月から翌々月までの4か月分（多胎は3か月前からの6か月分）にあたる額が減る。妊娠85日（4か月）以上の出産が対象で、死産・流産・早産・人工妊娠中絶を含む。窓口は区役所3階9番の国民健康保険課（母子健康手帳、資格確認書か資格情報通知書、本人確認書類を持参）。郵送もできる（届出書と、母子健康手帳の表紙・出産予定日がわかるページのコピー）。豊島区の国民健康保険の出産育児一時金を使う場合は届出がいらず、出産後に自動で減額される。保険料が限度額に達していると、減額しても金額が変わらないことがある。
