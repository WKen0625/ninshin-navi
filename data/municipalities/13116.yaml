  - id: toshima.s08e
    phase: postpartum
    sort_order: 84
    title: （里帰りなど都外で健診を受けた人）妊婦健康診査・新生児聴覚検査などの助成金を申請する
    detail: 都外の医療機関などで受診票が使えず、自費で受けた分の一部が助成される（海外での受診は対象外）。令和8年4月1日以降の受診の上限は、妊婦健康診査1回目11,670円、2〜14回目5,460円、超音波検査1〜4回目5,300円、子宮頸がん検診3,400円、新生児聴覚検査3,000円（子1人につき1回）。令和8年10月1日以降の受診は、産婦健康診査（1回目・2回目 各5,000円）と1か月児健康診査（6,000円）も対象。上限に満たないときは実費。窓口は健康推進課（豊島区保健所2階）か長崎健康相談所。持ち物は母子健康手帳、領収書の原本（明細書があれば一緒に）、未使用の受診票、印鑑（朱肉を使うもの）、振込口座がわかるもの。代理の人も申請できる。妊産婦本人以外の名義の口座に振り込みを希望するときは、本人の委任状が必要（区の公式ページ）。
