steps:
  - id: nerima.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳セットを受け取る
    detail: 医療機関で妊娠の確定診断（胎児心拍の確認）を受けたら届け出る。妊娠・子育て相談員がいて、届出と同時に面談（40分程度）ができる窓口は、保健相談所（豊玉・北・光が丘・石神井・大泉・関。月〜金の8時30分〜17時）と、健康推進課（区役所東庁舎6階）、予約制の土曜日臨時交付窓口（第2・第4土曜）。地域子ども家庭支援センター（練馬・光が丘・大泉・関。月〜土の9時〜17時）でも届け出できるが、面談は後日、保健相談所で受ける。持ち物は、妊婦の個人番号（マイナンバー）がわかるもの1点と本人確認書類。妊婦本人がマイナンバーカードを持っていれば、ぴったりサービス（マイナポータル）で電子申請もできる。その場合は、母子健康手帳セットを送ってもらうためのレターパックプラス（未使用のもの）を母子保健係に送る。保健相談所で17時〜18時30分の受付を希望する場合は前日までに電話で予約する。地域子ども家庭支援センターには妊娠・子育て相談員がいないので、面談は保健相談所で受ける（ねりま子育て応援ハンドブック・区のページ）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: nerima.hoken_bag
    channel: 窓口（保健相談所など） または オンライン（ぴったりサービス）
    action_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/boshitecho.html
    deadline_note: 医療機関で妊娠の確定診断（胎児心拍の確認）を受けたら。いつまでにという日付は区のページに記載なし
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: nerima.c_hoken_sodan
    source_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/boshitecho.html
    verified_at: 2026-09-20

  - id: nerima.s03b
    phase: pregnancy
    sort_order: 35
    title: 妊娠・子育て相談員との面談（妊婦面談）を受ける
    detail: 保健相談所・健康推進課・土曜日臨時交付窓口で妊娠届を出した人は、届出と同時に面談を受ける。地域子ども家庭支援センターや代理・電子申請で届け出た人は、後日、母子健康手帳セット一式を持って、担当の保健相談所で面談を受ける。面談を受けた妊婦は、育児パッケージ（1万円相当の電子ギフト。受け取り期限は令和9年4月30日）と、ねりママ出産応援金〈妊婦支援給付金〉の案内を受け取る。ギフトは再発行できない。問い合わせ 健康推進課 出産・子育て応援担当係 03-5984-1336。
    trigger_document_id: nerima.hoken_bag
    produces_document_id: nerima.shien_kyufu_annai_1
    channel: 保健相談所 / 健康推進課（区役所東庁舎6階）
    action_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/ikupake.html
    deadline_base: due_date
    deadline_offset_days: 0
    deadline_note: 妊娠中に面談した人がギフトの対象（やむを得ない理由で面談できなかった人は、担当係に相談する）
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: nerima.c_hoken_sodan
    source_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/ikupake.html
    verified_at: 2026-09-20

