    description: 令和8年4月1日以降に母子健康手帳を受け取った人は「母と子の保健バッグ」に入っている。使えるのは令和8年10月1日以降。令和8年3月31日までに母子健康手帳を受け取った人で、10月1日以降に受診しそうな人には郵送される予定。届いていない人は母子保健係（03-5984-4621）に連絡する。
    source_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/sannpu10gatuikou.html
