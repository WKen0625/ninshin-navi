    phase: birth
    description: 妊婦健康診査受診票と一緒に渡される。検査費用のうち3,000円を上限に助成。
    source_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/sinseijicyoukaku.html
