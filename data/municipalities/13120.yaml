      - nerima.ikkagetsuji_kenshin_ticket    # 同上
    phase: notification
    description: 妊娠届を出すと受け取る。母子健康手帳、赤ちゃん訪問連絡票（出生通知票）、母と子の保健バッグ（妊婦健康診査受診票・妊婦超音波検査受診票・妊婦子宮頸がん検診受診票・新生児聴覚検査受診票・産婦健康診査受診票・1か月児健康診査受診票、赤ちゃん準備教室の案内、妊産婦歯科健診の案内、里帰り出産等妊婦健康診査費等助成の案内、ねりま子育て応援ハンドブック、マタニティストラップなど）。
    source_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/boshitecho.html
    verified_at: 2026-09-20
  - id: nerima.kenshin_ticket
    name: 妊婦健康診査受診票（練馬区）
    aliases: [受診票, 補助券]
    phase: notification
    description: 妊婦健康診査14回分（令和8年度の助成上限額は1回目11,670円、2〜14回目は各5,460円）、妊婦超音波検査4回分（各5,300円）、妊婦子宮頸がん検診1回分（3,400円）。都内の契約医療機関と、埼玉県の一部の医療機関（新座市の牧田産婦人科医院・大塚産婦人科小児科医院、和光市の国立病院機構埼玉病院、所沢市の瀬戸病院）で使える。令和6年10月1日以降に妊娠届を出した人は、都内の一部の助産所でも使える（原則7回まで）。
    source_url: https://www.city.nerima.tokyo.jp/hokenfukushi/hoken/sukoyaka/kenkoshinsa.html
    verified_at: 2026-09-20
