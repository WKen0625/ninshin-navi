  - id: nerima.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊産婦歯科健康診査を受ける（無料・1回）
    detail: 妊娠中から産後1年未満の間に、1回無料で受けられる。区のページにある健診実施会場（歯科医院）に、自分で直接電話して予約する。持ち物は母子健康手帳と、住所が確認できる書類（マイナンバーカード、運転免許証など）。内容は問診、口の中の診査、総合判定、歯みがき指導。
