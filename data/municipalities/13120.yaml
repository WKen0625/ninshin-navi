    detail: 妊婦面談のときに案内される二次元コードから電子申請する。申請日に練馬区に住民票がある妊婦が対象。現金（妊婦本人名義の口座に振込）か、ギフトカードを選ぶ。流産・死産などを経験した人も対象（出産・子育て応援担当係に連絡する）。問い合わせ 健康推進課 出産・子育て応援担当係 03-5984-1336。
