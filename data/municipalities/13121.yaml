  - id: adachi.kouketsuatsu
    name: 妊娠高血圧症候群等の医療費助成（足立区）
    kind: conditional
    amount_note: 対象の病気での入院医療費（保険がきく分）の自己負担額を助成。高額療養費制度にあたるときはその限度額まで。食事療養費や差額ベッド代は対象外。
    conditions: 区内に住民登録のある妊産婦で、妊娠高血圧症候群とその関連疾患・糖尿病と妊娠糖尿病・貧血・産科出血・心疾患で入院が必要な人。前年分の総所得税額が30,000円以下の世帯、または入院見込み期間が26日以上。生活保護世帯は対象外。
    apply_via: 保健予防課保健予防係、中央本町地域・保健総合支援課、各保健センター。原則として入院前か入院中に申請。入院中に申請できないときは、退院日から3か月以内に限り受け付ける。問い合わせ 03-3880-5892
