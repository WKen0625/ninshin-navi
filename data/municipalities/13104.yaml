    kind: conditional
    amount_note: 入院治療にかかる自己負担額を助成。対象の病気にはそれぞれ認定基準がある。
    conditions: 妊娠高血圧症候群とその関連疾患・糖尿病・貧血・産科出血・心疾患で入院治療が必要な妊産婦。世帯の前年分の総所得税額が30,000円以下の人、または入院見込み期間が26日以上の人。生活保護を受けている世帯の人は対象外。
    apply_via: 保健センターで医療費助成申請書と診断書などの書類を受け取り、住所を担当する保健センターへ申請する（牛込 03-3260-6231、四谷 03-3351-5161、東新宿 03-3200-1026、落合 03-3952-7161）。申請の期限は区のページに記載なし
    apply_from_note: "入院治療を受けたあと（区のページで手続きを確認）"
