steps:
  - id: shinjuku.s03
    overrides_step_id: jp.s03
    phase: notification
    sort_order: 30
    title: 妊娠届を出し、母子健康手帳と「母と子の保健バッグ」を受け取る
    detail: 届出先は、各保健センター（牛込・四谷・東新宿・落合）、健康づくり課健康づくり推進係、各特別出張所。持ち物は、妊婦の個人番号（マイナンバー）が確認できるもの1点と、届け出る人の本人確認ができるもの（マイナンバーカードなどは1点、ない場合は資格確認書など2点）。妊娠週数、分娩予定日、診断を受けた医療機関の名前と所在地がわかるものがあれば持っていく。妊娠届の用紙は窓口でもらえる。保健センターか健康づくり課で本人が届け出ると、手帳の交付と同時に看護職との面談（ゆりかご・しんじゅく）が受けられる（特別出張所では面談はできない）。マイナポータルで電子申請もできるが、手帳と袋は後日、保健センターか健康づくり課で受け取る（郵送はできない）。電子申請した人は、受け取りの日時と場所を決めるため、必ず健康づくり課 03-5273-3047 に連絡する。 母子健康手帳には出生通知票（すくすく赤ちゃん訪問連絡票）が添付されていて、母と子の保健バッグには妊婦健康診査受診票や母親学級のお知らせなどが入っている。窓口は保健センター、健康づくり課（新宿5-18-14 新宿北西ビル4階）、特別出張所（2026 はっぴー子育てガイド）。
    trigger_document_id: jp.heartbeat_confirmed
    produces_document_id: shinjuku.hoken_bag
    channel: 各保健センター / 健康づくり課 / 各特別出張所（電子申請のあとは保健センターか健康づくり課へ来庁）
    action_url: https://www.city.shinjuku.lg.jp/fukushi/file02_01_00001.html
    deadline_note: なるべく早めに（できれば妊娠11週までに）。母子健康手帳をもらう前に自費で受けた妊婦健診の費用は助成されない
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（医療機関で妊娠が確認されたら、なるべく早く）"
    contact_id: shinjuku.c_kenko
    source_url: https://www.city.shinjuku.lg.jp/fukushi/file02_01_00001.html
    verified_at: 2026-09-20

  - id: shinjuku.s03b
    phase: pregnancy
    sort_order: 35
    title: 「ゆりかご・しんじゅく」の面談（看護職との面談）を受ける
    detail: 新宿区に住民登録がある妊婦が対象。保健センターか健康づくり課で母子健康手帳を受け取った人は、そのとき同時に面談する。特別出張所やほかの自治体で受け取った人は、保健センター（牛込 03-3260-6231、四谷 03-3351-5161、東新宿 03-3200-1026、落合 03-3952-7161）か健康づくり課（03-5273-3047）に予約して受ける。持ち物は、母子健康手帳、妊娠届出書（本人控）、母と子の保健バッグ。受付は平日8時30分〜17時。手帳の交付も合わせると30〜60分ほどかかる。面談した人は、その日に妊婦支援給付金（1回目）の申請書を受け取り、1〜2か月後に「ゆりかご応援ギフト」（1万円相当）が簡易書留で届く。 妊娠中に新宿区に転入した人も面談の対象（2026 はっぴー子育てガイド）。
    trigger_document_id: shinjuku.hoken_bag
    produces_document_id: shinjuku.shien_kyufu_shinsei_1
    channel: 各保健センター / 健康づくり課（特別出張所ではできない）
    action_url: https://www.city.shinjuku.lg.jp/fukushi/file02_01_00001_2.html
    deadline_note: いつまでに受けるかは区のページに記載なし
    apply_from_base: notification_date
    apply_from_offset_days: 0
    apply_from_note: "母子健康手帳を受け取ってから（妊娠中）"
    contact_id: shinjuku.c_kenko
    source_url: https://www.city.shinjuku.lg.jp/fukushi/file02_01_00001_2.html
    verified_at: 2026-09-20

  - id: shinjuku.s05
    overrides_step_id: jp.s05
    phase: pregnancy
    sort_order: 50
    title: 妊婦支援給付金（1回目・5万円相当）を申請する
    detail: 令和7年4月1日以降に妊娠届を出した妊婦が対象。申請日に新宿区に住民登録があり、医師に胎児の心拍を確認してもらい、ほかの自治体で妊婦支援給付金（現金やクーポンなど）を受け取っていないことが条件。現金か電子ギフト（東京都が発行する、育児用品・家電・子育てサービスなどに使えるギフトカード）を選ぶ。申請のあと1〜2か月で入金または発送される予定。申請書は「ゆりかご・しんじゅく」面談のときに受け取る。流産・死産・人工妊娠中絶をした人も対象。問い合わせは新宿区妊婦支援給付金コールセンター 0120-002-274（無料、平日8時30分〜17時）。
    trigger_document_id: shinjuku.shien_kyufu_shinsei_1
    channel: 面談で受け取った申請書で申請
    deadline_note: 申請期限は区のページに記載なし（面談のときか、コールセンターに確認する）
    apply_from_base: confirmation_date
    apply_from_offset_days: 0
    apply_from_note: "心拍を確認した日から（区の面接・面談のあと）"
    contact_id: shinjuku.c_kenko
    source_url: https://www.city.shinjuku.lg.jp/fukushi/syussan_kosodate_gift.html
    verified_at: 2026-09-20

  - id: shinjuku.s05b
    phase: pregnancy
    sort_order: 55
    title: 妊娠7か月ごろに届くアンケートに回答する（必要な人は面談）
    detail: 妊娠7か月ごろになると、妊婦全員に区からアンケートが届く。出産や子育ての相談がある人、支援が必要な人には面談がある。
    trigger_document_id: shinjuku.hoken_bag
    channel: 区から届くアンケート
    deadline_note: 妊娠7か月ごろ（回答の期限は区のページに記載なし）
    apply_from_base: gestational_week
    apply_from_week: 24
    apply_from_note: "妊娠7か月ごろ（区からアンケートが届いてから）"
    contact_id: shinjuku.c_kenko
    source_url: https://www.city.shinjuku.lg.jp/fukushi/syussan_kosodate_gift.html
    verified_at: 2026-09-20

  - id: shinjuku.s05c
    phase: pregnancy
    sort_order: 57
    title: 妊婦歯科健康診査を受ける（自己負担なし・1回）
    detail: 区内に住民登録のある妊婦が対象（転入や里帰り出産などで妊娠中に受けられなかった産婦も対象）。受診票は、妊娠中から産後1年までの間に1回だけ、「お知らせ兼名簿」にのっている協力歯科医療機関で使える。内容は、口の中の診査（むし歯や歯周病がないかを見る）と歯科保健指導。自己負担はない（ほかの診査や治療を希望したときは自己負担）。区は、体調が落ち着く安定期の受診をすすめている。
