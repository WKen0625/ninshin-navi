  - id: shinjuku.s06d
    phase: pregnancy
    sort_order: 66
    title: （新宿区の国民健康保険の人）産前産後期間の国民健康保険料の軽減を届け出る
    detail: 出産予定月（または出産月）の前月から翌々月までの分（多胎は3か月前から6か月分）の、出産する本人の保険料（所得割と均等割）が減額される。妊娠85日（4か月）以上の出産が対象で、死産・流産・早産・人工妊娠中絶も含む。新宿区から出産育児一時金を受け取る人は、届出はいらない（区が出産を確認して軽減する）。窓口は区役所本庁舎4階8番の医療保険年金課国保資格係か、各特別出張所。郵送でもよい。必要なものは、「産前産後期間に係る保険料軽減届出書」、本人確認書類、世帯主と出産する人の個人番号確認書類（持っていなければ不要）、母子健康手帳など出産予定日がわかるもの。問い合わせ 医療保険年金課国保資格係 5273-4146（区のページの表記のまま。市外局番の記載なし）。
    trigger_document_id: shinjuku.hoken_bag
    channel: 窓口（区役所本庁舎4階8番 / 各特別出張所） / 郵送
    action_url: https://www.city.shinjuku.lg.jp/kenkou/hoken01_000001_00038.html
    deadline_note: 出産予定日の6か月前から届け出できる。出産後でもよいが、その年度の最初の保険料の納期の翌日から2年を過ぎると、その年度の保険料は変更できない
    apply_from_base: due_date
    apply_from_offset_days: -182
    apply_from_note: "出産予定日の6か月前から"
    contact_id: shinjuku.c_kokuho_shikaku
    source_url: https://www.city.shinjuku.lg.jp/kenkou/hoken01_000001_00038.html
    verified_at: 2026-09-20

  - id: shinjuku.s08c
    phase: birth
    sort_order: 71
    title: 新生児聴覚検査を受ける
    detail: 赤ちゃんの耳のきこえの検査。都内の委託医療機関で「新生児聴覚検査受診票」を使うと、3,000円が助成される（検査費用は医療機関によって違う）。里帰りなどで都外で自費で受けたときは、あとで費用の一部が助成される。申請は郵送か健康づくり課の窓口で、期限は出産（出生）日から1年間。
