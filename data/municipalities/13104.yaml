  - id: shinjuku.s07d
    phase: postpartum
    sort_order: 78
    title: 「すくすく赤ちゃん訪問連絡票（出生通知票）」を送り、すくすく赤ちゃん訪問を受ける
    detail: 訪問指導員（助産師・保健師など）が家に来て、赤ちゃんの身体測定や健康状態の確認、お母さんの健康や子育ての相談、区の子育て支援の案内をしてくれる（無料）。対象は、生後4か月以内の赤ちゃんがいる家庭。母子健康手帳についている「すくすく赤ちゃん訪問連絡票（出生通知票）」を、出産後すぐに健康づくり課へ送る。電話や、住所を担当する保健センターの電子申請フォームでも申し込める。妊婦支援給付金（2回目）の申請書は、この訪問のときに受け取る。 里帰り先などでの訪問についての問い合わせは健康づくり課健康づくり推進係、それ以外の問い合わせは住所を担当する保健センター（2026 はっぴー子育てガイド）。
    trigger_document_id: shinjuku.hoken_bag
    produces_document_id: shinjuku.shien_kyufu_shinsei_2
    channel: 郵送（連絡票） / 電話 / オンライン（電子申請）
    action_url: https://www.city.shinjuku.lg.jp/fukushi/file02_00026.html
    deadline_note: 連絡票は出産後すぐに送る。対象は生後4か月以内
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（なるべく早く）"
    contact_id: shinjuku.c_hoken_center
    source_url: https://www.city.shinjuku.lg.jp/fukushi/file02_00026.html
    verified_at: 2026-09-20

  - id: shinjuku.s08
    overrides_step_id: jp.s08
