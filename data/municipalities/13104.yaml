    title: 妊婦支援給付金（2回目・子ども1人につき5万円相当）を申請する
    detail: 令和7年4月1日以降に出産した人が対象。金額は、妊娠していた子どもの人数×5万円相当。現金か電子ギフトを選ぶ。申請のあと1〜2か月で入金または発送される予定。申請書は、出産後の「すくすく赤ちゃん訪問」のときに受け取る。流産・死産・人工妊娠中絶をした人で母子健康手帳を持っている人は、区の「妊婦支援給付金申請書請求フォーム」か健康づくり課への連絡で、申請書を送ってもらえる。問い合わせは新宿区妊婦支援給付金コールセンター 0120-002-274（無料、平日8時30分〜17時）。
    trigger_document_id: shinjuku.shien_kyufu_shinsei_2
