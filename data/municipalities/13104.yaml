  - id: shinjuku.s07c
    phase: postpartum
    sort_order: 74
    title: （里帰りなどで都外で自費で妊婦健診を受けた人）費用の助成を申請する
    detail: 出産のため都外に里帰りしたことなどで、都内共通の受診票が使えず、自費で妊婦健診を受けた人に、費用の一部が助成される（助成の上限額は区のページに記載なし）。必要なものは、里帰り等の妊婦健康診査費助成金申請書、母子健康手帳の表紙のコピー、母子健康手帳8〜9ページ「妊娠中の経過」のコピー、領収書の原本、使っていない受診票の原本（受診票をなくすと申請できない）。郵送か窓口（窓口は健康づくり課だけ）で出す。提出先は 〒160-0022 新宿区新宿5-18-14 新宿北西ビル4階 健康づくり課健康づくり推進係（03-5273-3047）。この助成金は、医療費控除では「保険金等で補てんされる金額」にあたる。 都外で受診するときは、受診の前に健康づくり課に連絡する（2026 はっぴー子育てガイド）。
