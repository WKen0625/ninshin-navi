  - id: shinjuku.s08b
    phase: postpartum
    sort_order: 82
    title: 産婦健康診査を受ける（最大2回）
    detail: 出産後のお母さんの健康を確かめる健診。令和8年10月1日以降、都内の契約医療機関（一部の助産所も対象）で受診票を出すと、1回5,000円まで、最大2回、助成される。流産・死産をした人も対象。受診票があっても令和8年9月30日までは使えない。受診票を使わずに自費で受けると助成されない（里帰りなどで都内の契約医療機関以外で受けた場合を除く。その場合は受診日から1年以内に申請する）。 都外で受診するときは健康づくり課に連絡する（2026 はっぴー子育てガイド）。
