  - id: tokyo.maruoya
    name: ひとり親家庭等医療費助成（マル親）
    kind: conditional
    requires: single_parent
    amount_note: ひとり親と子の、保険診療の自己負担分を助成。住民税課税世帯は自己負担1割（通院は月18,000円、入院は月57,600円が上限）、非課税世帯は自己負担なし。
    conditions: 都内に住所があり、児童を監護しているひとり親家庭の母または父など。所得が限度額以上の人、健康保険に入っていない人、生活保護を受けている人は対象外。
    apply_via: 区市役所の窓口に申請し、マル親医療証の交付を受ける
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（子の健康保険の加入のあと）"
    apply_guide:
      eligibility: [single_parent, insurance_any, income_under_limit]
      submit_to: 区役所（医療費助成の窓口）
      documents:
        - name: 申請書（区の窓口）
          from: ward
        - name: 親と子の健康保険の情報（マイナ保険証・資格確認書）
          from: self
        - name: 戸籍謄本・所得がわかる書類（区の案内による）
          from: self
      form:
        from: window
      how_to: 子を健康保険に入れたあとに申請する。子の医療証（マル乳など）とは重複して発行されないので、どちらになるかは窓口で決まる
    source_url: https://www.fukushi.metro.tokyo.lg.jp/seikatsu/josei/maruoya
    verified_at: 2026-10-02
