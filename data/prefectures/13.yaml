      how_to: 1. 018サポートの申請のときに同時申請する  2. ギフトカードが届いたら（申請からおおむね4か月）、カードの二次元コードから専用サイトに初回登録する  3. 商品の申込みは初回登録から6か月以内。問い合わせ 0120-001-047
    source_url: https://www.fukushi.metro.tokyo.lg.jp/kodomo/shussan/tokyo_shussankosodateouen
