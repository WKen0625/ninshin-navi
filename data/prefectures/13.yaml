subsidies:
  - id: tokyo.epidural
    name: 東京都 無痛分娩費用助成
    kind: cash_later
    requires: epidural
    amount_yen: 100000
    amount_is_upper_limit: true
    amount_note: 最大10万円。硬膜外麻酔等の手技・管理費・薬剤費が対象。室料差額・個室料・食事料・文書料・保険適用となった費用は対象外。1回の分娩につき1度のみ（多胎も同様）。
    conditions: 令和7年10月1日以降に都の対象医療機関で硬膜外麻酔または脊髄くも膜下硬膜外併用麻酔による無痛分娩で出産。都内で妊娠届を出し母子健康手帳の交付を受け、申請日まで継続して都内に住民登録。
    apply_via: 電子申請（本人）。コールセンター 0120-620-620（平日9〜17時）
    deadline_base: birth_date
    deadline_offset_days: 365
    taxable: null
    scheme_applicable: [lumpsum, new_scheme]
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から"
    apply_guide:
      eligibility: [epidural]
      submit_to: 東京都（電子申請だけ。郵送は受け付けない）
      online_url: https://www.fukushi.metro.tokyo.lg.jp/kodomo/shussan/mutsubunben/subsidy
      by_mail: false
      documents:
        - name: 住民票の写し（申請者本人と子の氏名が載ったもの。申請日から3か月以内に発行）
          from: self
        - name: 対象医療機関の領収書（「無痛分娩費用」の金額が明記されたもの）
          from: hospital
        - name: 診療明細書（無痛分娩の費用が載ったもの）
          from: hospital
        - name: 母子健康手帳の表紙と1ページ目
          from: self
        - name: 通帳のコピーなど（振込先の金融機関名・支店名・口座番号・名義）
          from: self
        - name: 戸籍全部事項証明書（母子手帳の交付時と氏名が違う場合だけ）
          from: self
      form:
        from: online
        url: https://www.fukushi.metro.tokyo.lg.jp/kodomo/shussan/mutsubunben/subsidy
      how_to: 1. 退院のとき、無痛分娩費用の金額が明記された領収書と明細書をもらう  2. 住民票の写しを取る  3. 都の申請フォームから出す（出産日の翌日から1年以内・厳守）。問い合わせはコールセンター 0120-620-620
    source_url: https://www.fukushi.metro.tokyo.lg.jp/kodomo/shussan/mutsubunben/subsidy
    verified_at: 2026-09-18

  - id: tokyo.018support
    name: 018サポート（東京都）
    kind: recurring
    amount_yen: 5000
    amount_note: 子ども1人あたり月額5,000円（年間最大60,000円）。令和8年度の支給は8月・12月・令和9年4月の予定。申請期限は支給分ごと（12月支給分は令和8年11月1日、令和9年4月支給分は令和9年3月1日）。
    conditions: 0歳から18歳に達する日以後の最初の3月31日までの子で、令和8年度中に都内に住所がある（または、あった）こと。
    apply_via: マイナンバーカード申請（親子のマイナンバーカードをスマホで読み取る）または書類郵送等。コールセンター 0120-056-018
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（子どもの住民登録のあと）"
    apply_guide:
      submit_to: 東京都（018サポートのサイト）
      online_url: https://018support.metro.tokyo.lg.jp/
      by_mail: true
      documents:
        - name: 親と子のマイナンバーカード（スマホで読み取る。どちらかが無い場合は「その他の方法」で申請）
          from: self
        - name: 公金受取口座（子または申請者の口座を登録しておく）
          from: self
      form:
        from: online
        url: https://018support.metro.tokyo.lg.jp/
        note: 郵送で申請する用紙もある（送付の受付期限あり）
      how_to: 子どもの住民登録が済んだら、018サポートのサイトから申請する。赤ちゃんファーストも同時に申請できる。問い合わせ 0120-056-018
    source_url: https://018support.metro.tokyo.lg.jp/
    verified_at: 2026-09-19

  - id: tokyo.babyfirst
    name: 東京都出産・子育て応援事業（赤ちゃんファースト）
    kind: conditional
    amount_note: 育児用品や子育て支援サービスを選べるギフト（現金ではない）。金額は都のページに明記されていないため、ここでは計算に入れていない。
    conditions: 子どもが令和8年4月1日以降に生まれ、出生時点の住所が都内にあること。
    apply_via: 018サポートと同時に申請。専用サイト https://tokyobabyfirst.metro.tokyo.lg.jp/ で初回登録。コールセンター 0120-001-047
    apply_from_base: birth_date
    apply_from_offset_days: 0
    apply_from_note: "出産した日から（018サポートと同時に）"
    apply_guide:
      submit_to: 東京都（018サポートのサイトで同時申請）
      online_url: https://018support.metro.tokyo.lg.jp/
      by_mail: false
      documents:
        - name: 018サポートと同時に申請（別の書類は要らない）
          from: self
        - name: 届いたギフトカードに書かれたIDとパスワード（専用サイトの初回登録に使う）
          from: mailed
