<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#1e1b4b; --indigo:#4f46e5; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; color:#1f2340; font-feature-settings:"palt"; }
  body { background:#f7f7fc;
    background-image: radial-gradient(60rem 32rem at 110% -10%, rgb(167 139 250 / .3), transparent 60%),
      radial-gradient(48rem 28rem at -20% 8%, rgb(125 211 252 / .32), transparent 60%),
      radial-gradient(40rem 30rem at 50% 120%, rgb(199 210 254 / .4), transparent 60%); }
  .scene { position:absolute; inset:0; padding:140px 88px; display:flex; flex-direction:column; justify-content:center; gap:44px; opacity:0; }
  .brand { position:absolute; top:96px; left:88px; display:flex; align-items:center; gap:18px; }
  .mark { width:80px; height:80px; border-radius:24px; background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#0ea5e9); display:grid; place-items:center; box-shadow:0 18px 40px -16px rgb(99 102 241 / .6); }
  .mark svg { width:48px; height:48px; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .brand b { font-size:44px; color:var(--ink); }
  .chip { align-self:flex-start; background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-weight:700; font-size:34px; padding:14px 30px; border-radius:999px; }
  h1 { font-size:104px; line-height:1.18; font-weight:800; color:var(--ink); letter-spacing:-.01em; }
  h1 .g { background:linear-gradient(90deg,#4f46e5,#7c3aed,#0ea5e9); -webkit-background-clip:text; color:transparent; }
  .q { font-size:84px; font-weight:800; color:var(--ink); line-height:1.3; }
  .q small { display:block; font-size:44px; color:#64748b; font-weight:500; margin-top:12px; }
  .card { background:#fff; border:4px solid #e2e8f0; border-radius:44px; padding:52px; box-shadow:0 8px 24px -12px rgb(30 27 75 / .15); display:flex; flex-direction:column; gap:30px; }
  .hero { border:4px solid transparent; background:linear-gradient(#fff,#fff) padding-box, linear-gradient(135deg,#6366f1,#a855f7 55%,#38bdf8) border-box; box-shadow:0 30px 60px -24px rgb(99 102 241 / .5); }
  .row { display:flex; align-items:center; gap:28px; }
  .tile { width:110px; height:110px; border-radius:30px; display:grid; place-items:center; flex:none; background:#dbeafe; color:#1d4ed8; }
  .tile svg { width:64px; height:64px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .big { font-size:56px; font-weight:800; color:var(--ink); line-height:1.3; }
  .deadline { color:#92400e; font-weight:800; font-size:46px; }
  .sub { font-size:36px; color:#475569; }
  .done { background:#059669; color:#fff; font-weight:800; font-size:44px; padding:28px; border-radius:28px; text-align:center; }
  .url { font-size:92px; font-weight:800; color:var(--ink); text-align:center; }
  .btn { background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-weight:800; font-size:48px; padding:34px; border-radius:32px; text-align:center; box-shadow:0 18px 40px -16px rgb(99 102 241 / .6); }
  .tags { display:flex; gap:20px; justify-content:center; } .tags span { background:#fff; border:4px solid #e2e8f0; border-radius:24px; padding:18px 30px; font-size:38px; font-weight:800; }
  .qr { width:420px; height:420px; align-self:center; border-radius:32px; background:#fff; padding:18px; border:4px solid #e2e8f0; }

  /* タイムライン（合計 14 秒）: 0-3.5 表紙 / 3.5-7 困りごと / 7-10.5 カード / 10.5-14 CTA */
  .scene { animation: fade 3.5s ease both; animation-play-state: paused; }
  #a { animation-delay:0s } #b { animation-delay:3.5s } #c { animation-delay:7s } #d { animation-delay:10.5s; animation-name:fadeHold; }
  @keyframes fade { 0%{opacity:0; transform:translateY(24px)} 12%{opacity:1; transform:none} 88%{opacity:1; transform:none} 100%{opacity:0; transform:translateY(-16px)} }
  @keyframes fadeHold { 0%{opacity:0; transform:translateY(24px)} 12%{opacity:1; transform:none} 100%{opacity:1; transform:none} }
  .pop { animation: pop .6s cubic-bezier(.2,.9,.3,1.3) both; animation-play-state: paused; }
  #c .pop { animation-delay: 7.6s } #c .pop.d2 { animation-delay: 8.4s } #c .pop.d3 { animation-delay: 9s }
  #b .pop.d1 { animation-delay: 4s } #b .pop.d2 { animation-delay: 4.8s } #b .pop.d3 { animation-delay: 5.6s }
  @keyframes pop { from{opacity:0; transform:scale(.92) translateY(20px)} to{opacity:1; transform:none} }
  body.play .scene, body.play .pop { animation-play-state: running; }
</style>
</head>
<body>
<div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><b>Tsugiraku</b></div>

<section class="scene" id="a">
  <div class="chip">✦ 東京23区に住む妊婦さんとご家族へ</div>
  <h1>妊娠後の手続きで<br><span class="g">「次に何をするか」</span><br>がすぐわかる</h1>
  <div class="tags"><span style="color:#047857">無料</span><span style="color:#1d4ed8">ログインなし</span><span style="color:#4338ca">広告なし</span></div>
</section>

<section class="scene" id="b">
  <div class="q">妊娠がわかった。<small>でも…</small></div>
  <div class="card pop d1"><div class="big">妊娠届は、いつ・どこに？</div></div>
  <div class="card pop d2"><div class="big">分娩予約、もう締切？</div></div>
  <div class="card pop d3"><div class="big">結局、いくら払うの？</div></div>
</section>

<section class="scene" id="c">
  <div class="chip">✦ 4つ入れるだけ（約1分）</div>
  <div class="card hero">
    <div class="chip pop">✦ Next Action</div>
    <div class="row pop d2"><div class="tile"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v16M4 21h16M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/></svg></div><div class="big">妊娠届を出し、母子健康手帳を受け取る</div></div>
    <div class="deadline pop d2">⏰ 申請可能な時期: 心拍を確認した日から</div>
    <div class="sub pop d2">出典・港区のページへ飛ぶ ・ 確認日 2026/09/25</div>
    <div class="done pop d3">✓ 完了した → 次の1件が出ます</div>
  </div>
</section>

<section class="scene" id="d" style="text-align:center">
  <div class="q">まず、4つ入れてみてください。<small style="color:#4f46e5; font-weight:800">約1分です。</small></div>
  <img class="qr" id="qr" alt="">
  <div class="url">tsugiraku.jp</div>
  <div class="btn">→ プロフィールのリンクから</div>
</section>
</body>
</html>
