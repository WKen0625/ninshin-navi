<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#1e1b4b; --indigo:#4f46e5; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; color:#1f2340; font-feature-settings:"palt"; }
  body { background:#f7f7fc;
    background-image: radial-gradient(60rem 32rem at 110% -10%, rgb(167 139 250 / .3), transparent 60%),
      radial-gradient(48rem 28rem at -20% 8%, rgb(125 211 252 / .32), transparent 60%),
      radial-gradient(40rem 30rem at 50% 120%, rgb(199 210 254 / .4), transparent 60%); }
  .brand { position:absolute; top:96px; left:88px; display:flex; align-items:center; gap:18px; z-index:5; }
  .mark { width:80px; height:80px; border-radius:24px; background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#0ea5e9); display:grid; place-items:center; box-shadow:0 18px 40px -16px rgb(99 102 241 / .6); }
  .mark svg { width:48px; height:48px; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .brand b { font-size:44px; color:var(--ink); }
  .scene { position:absolute; inset:0; padding:220px 88px 120px; display:flex; flex-direction:column; align-items:center; gap:36px; opacity:0; }
  .chip { background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-weight:700; font-size:34px; padding:14px 30px; border-radius:999px; }
  h1 { font-size:96px; line-height:1.18; font-weight:800; color:var(--ink); text-align:center; letter-spacing:-.01em; }
  h1 .g { background:linear-gradient(90deg,#4f46e5,#7c3aed,#0ea5e9); -webkit-background-clip:text; color:transparent; }
  .q { font-size:80px; font-weight:800; color:var(--ink); line-height:1.3; text-align:center; }
  .q small { display:block; font-size:44px; color:#64748b; font-weight:500; margin-top:10px; }
  .url { font-size:88px; font-weight:800; color:var(--ink); }
  .btn { background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-weight:800; font-size:46px; padding:30px 60px; border-radius:32px; box-shadow:0 18px 40px -16px rgb(99 102 241 / .6); }
  .tags { display:flex; gap:20px; } .tags span { background:#fff; border:4px solid #e2e8f0; border-radius:24px; padding:16px 28px; font-size:36px; font-weight:800; }
  .qr { width:360px; height:360px; border-radius:32px; background:#fff; padding:16px; border:4px solid #e2e8f0; }

  /* 人物（SVG）。ゆっくり上下にゆれる */
  .person { width:520px; height:620px; } .person svg { width:100%; height:100%; }
  .bob { animation: bob 2.4s ease-in-out infinite; animation-play-state:paused; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .mouth-sad, .mouth-happy { transition: opacity .3s; }
  .happy .mouth-sad { opacity:0 } .happy .mouth-happy { opacity:1 }
  .mouth-happy { opacity:0 }
  .brow { transition: transform .3s; transform-origin:center; }
  .happy .brow-l { transform: rotate(-14deg) translateY(-8px) } .happy .brow-r { transform: rotate(14deg) translateY(-8px) }
  /* まばたき */
  .eye { transform-origin:center; animation: blink 4s infinite; animation-play-state:paused; }
  @keyframes blink { 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)} }

  /* ？ がふわっと出る */
  .qm { position:absolute; font-size:120px; font-weight:800; color:#7c3aed; opacity:0; animation: qm 1.6s ease-out infinite; animation-play-state:paused; }
  @keyframes qm { 0%{opacity:0; transform:translateY(20px) scale(.8)} 25%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-70px) scale(1.1)} }

  /* 紙が降ってくる */
  .paper { position:absolute; width:150px; height:200px; background:#fff; border:5px solid #e2e8f0; border-radius:16px; opacity:0; animation: fall 2.2s cubic-bezier(.2,.7,.3,1) both; animation-play-state:paused; }
  .paper::before, .paper::after { content:""; position:absolute; left:22px; right:22px; height:12px; background:#c7d2fe; border-radius:6px; }
  .paper::before { top:40px } .paper::after { top:80px; right:60px }
  @keyframes fall { 0%{opacity:0; transform:translateY(-320px) rotate(-20deg)} 20%{opacity:1} 100%{opacity:1; transform:translateY(0) rotate(var(--r))} }

  /* スマホ */
  .phone { width:460px; height:900px; border-radius:60px; background:#1e1b4b; padding:18px; box-shadow:0 40px 80px -30px rgb(30 27 75 / .5); }
  .screen { width:100%; height:100%; border-radius:46px; background:#f7f7fc; padding:36px 26px; display:flex; flex-direction:column; gap:20px; overflow:hidden; }
  .card { background:#fff; border:3px solid #e2e8f0; border-radius:28px; padding:26px; }
  .hero { border:3px solid transparent; background:linear-gradient(#fff,#fff) padding-box, linear-gradient(135deg,#6366f1,#a855f7 55%,#38bdf8) border-box; box-shadow:0 20px 40px -20px rgb(99 102 241 / .5); }
  .chip-s { display:inline-block; background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; font-weight:700; font-size:22px; padding:8px 18px; border-radius:999px; }
  .big { font-size:30px; font-weight:800; color:var(--ink); line-height:1.3; margin-top:14px; }
  .deadline { color:#92400e; font-weight:800; font-size:24px; margin-top:10px; }
  .done { background:#059669; color:#fff; font-weight:800; font-size:26px; padding:16px; border-radius:18px; text-align:center; margin-top:16px; }
  .ghost { height:120px; background:#fff; border:3px solid #e2e8f0; border-radius:28px; opacity:.7 }

  .check { position:absolute; width:180px; height:180px; border-radius:50%; background:#059669; color:#fff; display:grid; place-items:center; font-size:110px; font-weight:800; opacity:0; animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; animation-play-state:paused; box-shadow:0 20px 40px -16px rgb(5 150 105 / .6); }
  .pop { opacity:0; animation: pop .6s cubic-bezier(.2,.9,.3,1.3) both; animation-play-state:paused; }
  @keyframes pop { from{opacity:0; transform:scale(.85) translateY(24px)} to{opacity:1; transform:none} }
  .slide-in { opacity:0; animation: slidein .7s cubic-bezier(.2,.9,.3,1.1) both; animation-play-state:paused; }
  @keyframes slidein { from{opacity:0; transform:translateX(220px)} to{opacity:1; transform:none} }

  /* タイムライン 14秒: A 0-3.5 / B 3.5-7 / C 7-10.5 / D 10.5-14 */
  .scene { animation: fade 3.5s ease both; animation-play-state:paused; }
  #a { animation-delay:0s } #b { animation-delay:3.5s } #c { animation-delay:7s } #d { animation-delay:10.5s; animation-name:fadeHold }
  @keyframes fade { 0%{opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{opacity:0} }
  @keyframes fadeHold { 0%{opacity:0} 10%{opacity:1} 100%{opacity:1} }
  #a .qm.q1{ left:150px; top:780px; animation-delay:.4s } #a .qm.q2{ right:170px; top:720px; animation-delay:1.0s } #a .qm.q3{ left:260px; top:660px; animation-delay:1.6s }
  #b .p1{ left:120px; top:1150px; --r:-14deg; animation-delay:3.7s } #b .p2{ left:300px; top:1230px; --r:8deg; animation-delay:4.0s } #b .p3{ right:140px; top:1180px; --r:16deg; animation-delay:4.3s } #b .p4{ right:330px; top:1260px; --r:-6deg; animation-delay:4.6s } #b .p5{ left:470px; top:1300px; --r:3deg; animation-delay:4.9s }
  #c .phone { animation-delay:7.2s } #c .card.hero .pop:nth-child(1){animation-delay:7.9s} #c .card.hero .pop:nth-child(2){animation-delay:8.2s} #c .card.hero .pop:nth-child(3){animation-delay:8.5s} #c .card.hero .pop:nth-child(4){animation-delay:9.0s}
  #c .check { animation-delay:9.4s; right:150px; top:1180px }
  #d .partner { animation-delay:10.9s } #d .pop.d1 { animation-delay:11.4s } #d .pop.d2 { animation-delay:11.9s }
  body.play .scene, body.play .bob, body.play .eye, body.play .qm, body.play .paper, body.play .check, body.play .pop, body.play .slide-in { animation-play-state:running; }
</style>
</head>
<body>
<div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><b>Tsugiraku</b></div>


<section class="scene" id="a">
  <div class="chip">✦ 東京23区に住む妊婦さんとご家族へ</div>
  <h1>妊娠がわかった。<br><span class="g">うれしい。</span><br>でも…</h1>
  <div class="person bob" data-who="mom"></div>
  <div class="qm q1">？</div><div class="qm q2">？</div><div class="qm q3">？</div>
</section>

<section class="scene" id="b">
  <div class="q">何から？<small>いつまで？ どこに？ いくら？</small></div>
  <div class="person bob" data-who="mom"></div>
  <div class="paper p1"></div><div class="paper p2"></div><div class="paper p3"></div><div class="paper p4"></div><div class="paper p5"></div>
</section>

<section class="scene" id="c" style="flex-direction:row; align-items:flex-end; justify-content:center; gap:0; padding-top:360px">
  <div style="position:absolute; top:220px; left:0; right:0; text-align:center"><div class="chip">✦ 4つ入れるだけ（約1分）</div><div class="q" style="font-size:60px; margin-top:20px">「次にやること」が<br>1件ずつ出ます</div></div>
  <div class="phone slide-in">
    <div class="screen">
      <div class="card hero">
        <div class="chip-s pop">✦ Next Action</div>
        <div class="big pop">妊娠届を出し、母子健康手帳を受け取る</div>
        <div class="deadline pop">⏰ 申請可能な時期: 心拍を確認した日から</div>
        <div class="done pop">✓ 完了した</div>
      </div>
      <div class="ghost"></div><div class="ghost"></div>
    </div>
  </div>
  <div class="person bob happy" data-who="mom" style="width:400px; height:480px; margin-left:-60px"></div>
  <div class="check">✓</div>
</section>

<section class="scene" id="d" style="gap:28px; padding-top:200px">
  <div class="q" style="font-size:66px">まず、4つ入れてみてください。<small style="color:#4f46e5; font-weight:800">約1分です。</small></div>
  <div style="display:flex; align-items:flex-end; justify-content:center; gap:0; height:520px">
    <div class="person bob happy" data-who="mom" style="width:380px; height:460px"></div>
    <div class="person bob slide-in partner" data-who="dad" style="width:380px; height:460px; margin-left:-40px; animation-delay:.3s"></div>
  </div>
  <img class="qr pop d1" id="qr" alt="">
  <div class="url pop d1">tsugiraku.jp</div>
  <div class="btn pop d2">→ プロフィールのリンクから</div>
</section>

<script>
// 人物のイラスト（線のテイスト・フラット）。その場に描くので、場面ごとに表情（.happy）を変えられる
const MOM = `<svg viewBox="0 0 400 620">
  <ellipse cx="200" cy="600" rx="150" ry="18" fill="#c7d2fe" opacity=".6"/>
  <path d="M118 600 C108 440 120 340 200 322 C280 340 292 440 282 600 Z" fill="#a5b4fc"/>
  <path d="M200 330 C250 335 300 390 302 470 C300 520 262 545 220 540 C190 536 182 500 190 440 C195 400 198 360 200 330 Z" fill="#818cf8"/>

  <path d="M120 420 C84 460 78 520 96 560" stroke="#f6d7c3" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M286 400 C330 420 330 470 296 500" stroke="#f6d7c3" stroke-width="34" stroke-linecap="round" fill="none"/>
  <circle cx="296" cy="500" r="20" fill="#f6d7c3"/>
  <circle cx="200" cy="230" r="112" fill="#f6d7c3"/>
  <path d="M88 220 C88 120 150 90 200 90 C260 90 312 120 312 220 C312 250 300 280 300 300 L280 300 C290 250 285 200 260 180 C230 170 160 170 140 180 C115 200 110 250 120 300 L100 300 C100 280 88 250 88 220 Z" fill="#5b3a2e"/>
  <g class="eye"><circle cx="165" cy="240" r="10" fill="#1e1b4b"/><circle cx="235" cy="240" r="10" fill="#1e1b4b"/></g>
  <path class="brow brow-l" d="M150 222 L182 212" stroke="#5b3a2e" stroke-width="7" stroke-linecap="round"/>
  <path class="brow brow-r" d="M250 222 L218 212" stroke="#5b3a2e" stroke-width="7" stroke-linecap="round"/>
  <path class="mouth-sad" d="M184 292 Q200 282 216 292" stroke="#c2410c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path class="mouth-happy" d="M174 280 Q200 310 226 280" stroke="#c2410c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="140" cy="268" r="12" fill="#fda4af" opacity=".6"/><circle cx="260" cy="268" r="12" fill="#fda4af" opacity=".6"/>
</svg>`;
const DAD = `<svg viewBox="0 0 400 620">
  <ellipse cx="200" cy="600" rx="140" ry="18" fill="#bae6fd" opacity=".6"/>
  <path d="M120 600 C110 430 130 330 200 320 C270 330 290 430 280 600 Z" fill="#7dd3fc"/>
  <path d="M200 330 L200 600" stroke="#38bdf8" stroke-width="6"/>
  <path d="M126 420 C90 460 85 520 100 560" stroke="#f1c9b0" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M274 420 C320 440 340 400 352 350" stroke="#f1c9b0" stroke-width="34" stroke-linecap="round" fill="none"/>
  <circle cx="352" cy="350" r="22" fill="#f1c9b0"/>
  <circle cx="200" cy="230" r="108" fill="#f1c9b0"/>
  <path d="M96 210 C96 130 150 100 200 100 C250 100 304 130 304 210 C280 190 230 180 200 184 C170 180 120 190 96 210 Z" fill="#2b2b3a"/>
  <g class="eye"><circle cx="166" cy="240" r="10" fill="#1e1b4b"/><circle cx="234" cy="240" r="10" fill="#1e1b4b"/></g>
  <path d="M150 214 L182 210" stroke="#2b2b3a" stroke-width="7" stroke-linecap="round"/><path d="M250 214 L218 210" stroke="#2b2b3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M176 282 Q200 306 224 282" stroke="#c2410c" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>`;
for (const el of document.querySelectorAll(".person")) el.innerHTML = el.dataset.who === "dad" ? DAD : MOM;
</script>
</body>
</html>
